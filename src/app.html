    return;
  }
  let h;
  try { h = await api("/api/hesap"); } catch (e) { if (e.message !== "giriş") showError("hesabim", offlineMsg(e), pageHesabim); return; }

  let bekleyenKod = null, kodZamanlayici = null;

  const os0 = guessOS();

const sumZero = () => ({ input: 0, output: 0, cw5m: 0, cw1h: 0, cw: 0, cr: 0, tok: 0, usd: 0 });
function add(acc, r) {
  const c5 = r.cw5m || 0, c1 = r.cw1h || 0;
  acc.input += r.input; acc.output += r.output; acc.cw5m += c5; acc.cw1h += c1; acc.cw += c5 + c1; acc.cr += r.cr;
  acc.tok += r.input + r.output + c5 + c1 + r.cr; acc.usd += r.usd;
}
async function loadWeek() {
  const sp = new URLSearchParams(location.search);

  const sgl = aktifSaglayici();
  const q = new URLSearchParams();
  if (h) q.set("start", h);
  if (sgl !== "claude") q.set("saglayici", sgl);
  const qs = q.toString();
  const res = await api("/api/hafta" + (qs ? `?${qs}` : ""));
  if (res && res.ayar) uygulaSistemAyar(res.ayar);
  if (res && res.saglayiciOzeti && res.start === res.current) sonSaglayiciOzeti = res.saglayiciOzeti;
  else if (res && res.saglayiciOzeti && !sonSaglayiciOzeti) sonSaglayiciOzeti = res.saglayiciOzeti;
  return res;
}

function dayBars(d, rows, secili) {
  const days = Array.from({ length: 7 }, (_, i) => ({ i, s: sumZero(), by: new Map() }));
  for (const r of rows) {
    if (r.d < 0 || r.d > 6) continue;
    add(days[r.d].s, r);
    days[r.d].by.set(r.device_id, (days[r.d].by.get(r.device_id) || 0) + r.usd);
  }
  const max = Math.max(...days.map((x) => x.s.usd), 0.01);
  const labels = new Map(d.devices.map((x) => [x.id, x.label]));
  return `<div class="days" role="list">${days.map((x) => {
    const t = d.start + x.i * 86400;
    const future = t > d.now, today = t <= d.now && d.now < t + 86400;
    const tip = [...x.by.entries()].sort((a, b) => b[1] - a[1]).map(([id, v]) => `${esc(labels.get(id) || "?")}: ${money(v)}`).join("<br>");
    const side = x.i < 2 ? "l" : x.i > 4 ? "r" : "";
    const secim = secili !== undefined && !future;
    return `<div class="day ${future ? "future" : ""} ${today ? "today" : ""} ${secim ? "secilir" : ""} ${secili === x.i ? "secili" : ""}" role="listitem" tabindex="0"${secim ? ` data-gun="${x.i}" aria-pressed="${secili === x.i}"` : ""} aria-label="${wd(t)} ${dShort(t)}: ${future ? "henüz başlamadı" : money(x.s.usd)}${secim ? ", limit panelini bu güne kadar göstermek için seç" : ""}">
      ${tip && !future ? `<div class="tip ${side}" aria-hidden="true">${tip}<br><span style="opacity:.7">${short(x.s.tok)} token</span></div>` : ""}
      <div class="v">${future ? "–" : money(x.s.usd)}</div>
      <div class="col" style="height:${future ? 0 : (x.s.usd / max) * 70}%"></div>
      <div class="d"><span>${wd(t)}</span> <span>${dShort(t)}</span></div></div>`;
  }).join("")}</div>`;
}

function liveSetOf(d) {
  if (d.start !== d.current) return new Set();
  const from = Math.floor((d.now - 900) / 300) * 300;
  return new Set((d.recent5 || []).filter((r) => r.tok > 0 && r.bucket >= from).map((r) => r.device_id));
}
const S = 34; // izometrik birim (px)
const iso = (x, y, z = 0) => [(x - y) * S * 0.866, (x + y) * S * 0.5 - z * S];
const pts = (arr) => arr.map((p) => iso(...p).map((v) => v.toFixed(1)).join(",")).join(" ");
function box(x, y, z, w, d, h, top, left, right) {
  return `<polygon points="${pts([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]])}" fill="${left}"/>
          <polygon points="${pts([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]])}" fill="${right}"/>
          <polygon points="${pts([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]])}" fill="${top}"/>`;
}
// Üyeler: limit üyeler arasında eşit ya da özel ağırlıkla bölünür. Üyesi olmayan bilgisayar kendi adıyla tek kişilik grup sayılır.
// Her ofisin kendi üye listesi vardır: elle seçildiyse o liste; otomatikse Claude'da herkes,
// ChatGPT/Gemini'de son haftalarda o sağlayıcıyı kullanmış bilgisayarların sahipleri.
function gruplar(d, perDev, { tumu = false } = {}) {
  const m = new Map((d.uyeler || []).map((u) => [u.id, { id: u.id, ad: u.ad, uye: true, devs: [] }]));
  const out = [...m.values()];
  for (const dev of d.devices) {
    const g = m.get(dev.uye_id);
    if (g) g.devs.push(dev); else out.push({ id: "c:" + dev.id, ad: dev.label, uye: false, devs: [dev] });
  }
  for (const g of out) g.usd = g.devs.reduce((a, x) => a + (perDev?.get(x.id)?.usd || 0), 0);
  if (tumu) return out;
  return ofisUyeleriSec(d, out);
}
function ofisKullananlar(d) {
  const kullanan = new Set();
  for (const w of d.weeks || []) for (const [id, v] of Object.entries(w.byDevice || {})) if (v > 0) kullanan.add(id);
  for (const r of d.usage || []) if (r.usd > 0 || r.tok > 0) kullanan.add(r.device_id);
  for (const r of d.recent5 || []) if (r.tok > 0) kullanan.add(r.device_id);
  return kullanan;
}
function ofisUyeleriSec(d, out) {
  const liste = d.ayar && Array.isArray(d.ayar.ofisUyeler) ? d.ayar.ofisUyeler : null;
  if (liste) return out.filter((g) => liste.includes(g.id));
  if ((d.saglayici || "claude") === "claude") return out;
  const kullanan = ofisKullananlar(d);
  return out.filter((g) => g.devs.some((dv) => kullanan.has(dv.id)));
}
function grupPaylari(groups, ayar) {
  const m = new Map();
  const n = groups.length;
  if (!n) return m;
  const esit = 100 / n;
  if (!ayar || ayar.payModu !== "ozel") {
    for (const g of groups) m.set(g.id, esit);
    return m;
  }
  const ag = groups.map((g) => {
    const v = ayar.ozelPaylar ? Number(ayar.ozelPaylar[g.id]) : NaN;
    return Number.isFinite(v) && v >= 0 ? v : esit;
  });
  const top = ag.reduce((a, b) => a + b, 0);
  groups.forEach((g, i) => m.set(g.id, top > 0 ? (ag[i] / top) * 100 : esit));
  return m;
}

// Seçili saat dilimine ve ofis ayarlarına göre günün vakti, pencere ışığı ve gece uyku durumu

  if (zorla) {
    saat = zorla === "sabah" ? 8.5 : zorla === "gunduz" ? 13.5 : zorla === "aksam" ? 18.5 : 23;
    sa = Math.floor(saat); dk = Math.round((saat - sa) * 60);
  } else {
    const parca = new Intl.DateTimeFormat("en-GB", { timeZone: AKTIF_TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date((nowSec || Date.now() / 1000) * 1000));
    [sa, dk] = parca.split(":").map(Number);

  }
  const geceAktifMi = !oa || oa.geceUykuAktif !== false;

  const bit = oa && Number.isInteger(oa.geceBitis) ? oa.geceBitis : 6;
  const uykuVakti = !geceAktifMi
    ? false
    : zorla
      ? zorla === "gece"

  else if (v.donem === "gece") l.push("Bu saatte hâlâ ofisteyiz, gece sessizliğinde odaklanmak kolay oluyor.", "Gece kahvesi uykuyu kaçırmasın şimdi, bitki çayına mı geçsek?");
  if (Number.isFinite(S0.limitPct)) {
    const p = Math.round(S0.limitPct);
    if (p < 25) l.push(`Haftalık limit daha %${p}'de, gayet rahat gidiyoruz bu hafta.`);

  const f = (v) => v.toFixed(1);
  return `M${f(x1 + nx * r1)} ${f(y1 + ny * r1)}L${f(x2 + nx * r2)} ${f(y2 + ny * r2)}A${r2} ${r2} 0 0 0 ${f(x2 - nx * r2)} ${f(y2 - ny * r2)}L${f(x1 - nx * r1)} ${f(y1 - ny * r1)}A${r1} ${r1} 0 0 0 ${f(x1 + nx * r1)} ${f(y1 + ny * r1)}Z`;
}

function officeScene(d, groups, perDev, liveSet, maxUsd, asanlar = new Map(), opts = {}) {
  const demoMu = !!opts.demo;
  const compact = innerWidth <= 760;
  const n = Math.max(groups.length, 1);
  const DD = 1.04; // masa derinliği
  const dwOf = (k) => (k <= 1 ? 1.75 : 1.75 + (Math.min(k, 3) - 1) * 0.8);
  const maxDw = Math.max(...groups.map((g) => dwOf(g.devs.length)), 1.75);
  const cols = Math.min(n, compact ? 2 : 4), rowsN = Math.ceil(n / cols);
  const step = maxDw + (compact ? 2.75 : 3.25), RY = compact ? (rowsN >= 3 ? 5.15 : 4.85) : 5.55;
  const blokGen = (cols - 1) * step + maxDw;

  // Gece uyku köşesi boyutları: çalışmayan her üyenin yatabileceği yatak yuvaları
  const yatakSayisi = Math.min(Math.max(2, n), 8);
  const yatakSutun = Math.min(yatakSayisi, compact ? (n <= 4 ? 2 : 3) : 4);
  const yatakSatir = Math.ceil(yatakSayisi / yatakSutun);
  const yBw = compact ? 0.92 : 0.98, yBd = compact ? 1.82 : 1.88;
  const ciftArasi = 0.52, koridorArasi = compact ? 0.92 : 1.06, ySatirAdim = yBd + (compact ? 0.68 : 0.88);
  const yatakSatirGenOf = (adet) => {
    const ciftSayi = Math.ceil(adet / 2);
    let gen = 0;
    for (let p = 0; p < ciftSayi; p++) {
      const kalan = Math.min(2, adet - p * 2);
      gen += kalan === 2 ? yBw * 2 + ciftArasi : yBw + 0.46;
      if (p < ciftSayi - 1) gen += koridorArasi;
    }
    return gen;
  };
  const yatakMaxGen = yatakSatirGenOf(yatakSutun);

  const W = Math.max(compact ? 11.4 : 18.2, blokGen + (compact ? 4.2 : 6.4), 6.85 + yatakMaxGen + 2.15);
  const X0 = Math.max(2.6, (W - blokGen) * 0.5 + 0.15);
  const Y0 = 2.45;
  const masaArkaSon = Y0 + (rowsN - 1) * RY + DD + 1.3;
  const yatakY0 = masaArkaSon + (compact ? 0.94 : 1.12);
  const yatakAltSon = yatakY0 + (yatakSatir - 1) * ySatirAdim + yBd;
  const D = Math.max(9.85, masaArkaSon + (compact ? 4.05 : 5.0), yatakAltSon + 0.88);

  const ofisAyar = (d.ayar && d.ayar.ofis) || (SON_AYAR && SON_AYAR.ofis) || {};
  const tema = ofisTema(d.saglayici || "claude");
  const gorunumler = ofisAyar.gorunumler || {};
  const vakit = istanbulVakit(d.now, ofisAyar);
  const limitPct = d.limit && d.limit.pct !== null && d.limit.pct !== undefined ? d.limit.pct : null;
  const siraliGrup = [...groups].sort((a, b) => b.usd - a.usd);
  const topG = siraliGrup[0] && siraliGrup[0].usd > 0 ? siraliGrup[0] : null;
  const topUsd = groups.reduce((a, x) => a + x.usd, 0);

  const desks = groups.map((grp, k) => {
    const r = Math.floor(k / cols), c = k % cols;
    const satirdaki = Math.min(cols, n - r * cols);
    const satirBlok = (satirdaki - 1) * step + maxDw;
    const satirX0 = Math.max(2.6, (W - satirBlok) * 0.5 + 0.15);
    const dw = dwOf(grp.devs.length);
    const x = satirX0 + c * step + (maxDw - dw) / 2, y = Y0 + r * RY;
    const cx = x + dw / 2 - 0.3;
    return {
      grp, dw, x, y, cx,
      koltuk: [cx + 0.3, y + DD + 0.4],
      yanasma: [cx + 0.3, y + DD + 1.18],
      ayak: { x1: x - 0.22, x2: x + dw + 0.22, y1: y - 0.22, y2: y + DD + 0.96 },
    };
  });
  const anchor = (q) => iso(q.x + q.dw / 2 - 0.08, q.y + 0.18, compact ? 2.08 : 2.22);

  // Dinlenme alanı (ön sol-orta) ve uyku köşesi (ön sağ)
  const kanepeY1 = masaArkaSon + 1.15, kanepeY2 = kanepeY1 + 2.25;
  const kanepeX1 = 2.9, kanepeX2 = 3.92;
  const sehpaX1 = 4.95, sehpaX2 = 5.82, sehpaY1 = kanepeY1 + 0.42, sehpaY2 = kanepeY2 - 0.42;
  const kanepeKoltuklar = [
    { koltuk: [kanepeX1 + 0.62, kanepeY1 + 0.62], yanasma: [kanepeX2 + 0.55, kanepeY1 + 0.62], dolu: null },
    { koltuk: [kanepeX1 + 0.62, kanepeY2 - 0.62], yanasma: [kanepeX2 + 0.55, kanepeY2 - 0.62], dolu: null },
  ];

  const yatakBasX = W - 2.18 - yatakMaxGen;
  const yatakSlotlar = [], komodinler = [];
  for (let idx = 0; idx < yatakSayisi; idx++) {
    const r = Math.floor(idx / yatakSutun), c = idx % yatakSutun;
    const p = Math.floor(c / 2), sagMi = c % 2 === 1;
    const ciftSolX = yatakBasX + p * (yBw * 2 + ciftArasi + koridorArasi);
    const bx = sagMi ? ciftSolX + yBw + ciftArasi : ciftSolX;
    const by = yatakY0 + r * ySatirAdim;
    yatakSlotlar.push({
      slot: idx, x1: bx, x2: bx + yBw, y1: by, y2: by + yBd,
      yatak: [bx + yBw * 0.5, by + 0.52],
      yanasma: sagMi ? [bx + yBw + 0.44, by + 0.72] : [bx - 0.44, by + 0.72],
      sagMi, dolu: null,
    });
    if (!sagMi) {
      komodinler.push({ x1: bx + yBw + 0.08, x2: bx + yBw + 0.46, y1: by + 0.08, y2: by + 0.48 });
    }
  }
  const yatakSagSon = Math.max(...yatakSlotlar.map((y) => y.x2), ...komodinler.map((k) => k.x2));

  const esyalar = [
    { ad: "tahta", x1: 0.05, x2: 0.32, y1: 2.35, y2: 4.65, nokta: [1.18, 3.55], bak: [-1, -0.3] },
    { ad: "kahve", x1: 0.24, x2: 1.16, y1: D - 4.75, y2: D - 2.65, nokta: [1.68, D - 3.65], bak: [-1, -0.2] },
    { ad: "sebil", x1: 0.26, x2: 0.94, y1: D - 2.25, y2: D - 1.55, nokta: [1.48, D - 1.88], bak: [-1, -0.2] },
    { ad: "sunucu", x1: W - 1.28, x2: W - 0.32, y1: 0.45, y2: 1.4, nokta: [W - 1.75, 0.98], bak: [1, -0.3] },
    { ad: "raf", x1: W - 1.28, x2: W - 0.32, y1: 1.62, y2: 2.82, nokta: [W - 1.75, 2.25], bak: [1, -0.2] },
    { ad: "kanepe", x1: kanepeX1, x2: kanepeX2, y1: kanepeY1, y2: kanepeY2, nokta: [kanepeX2 + 0.6, (kanepeY1 + kanepeY2) / 2], bak: [-1, 0] },
    { ad: "sehpa", x1: sehpaX1, x2: sehpaX2, y1: sehpaY1, y2: sehpaY2, nokta: [sehpaX2 + 0.55, (sehpaY1 + sehpaY2) / 2], bak: [-1, 0] },
    { ad: "lamba", x1: kanepeX1 - 0.1, x2: kanepeX1 + 0.45, y1: kanepeY1 - 0.54, y2: kanepeY1 - 0.04, nokta: [kanepeX2 + 0.45, kanepeY1], bak: [-1, 0] },
    { ad: "bitkiSol", x1: 0.34, x2: 1.1, y1: 0.38, y2: 1.14, nokta: [1.45, 1.1], bak: [-1, -0.4] },
    { ad: "bitkiOn", x1: 1.85, x2: 2.6, y1: D - 1.45, y2: D - 0.7, nokta: [2.85, D - 1.1], bak: [-1, 0.3] },
    { ad: "bitkiSag", x1: W - 1.35, x2: W - 0.58, y1: D - 1.5, y2: D - 0.72, nokta: [W - 1.75, D - 1.15], bak: [1, 0.3] },
  ];
  const bistroVar = !compact && yatakBasX >= 9.35;
  const bistroX = 7.25, bistroY = kanepeY1 + 0.52;
  if (bistroVar) {
    esyalar.push({ ad: "bistro", x1: bistroX, x2: bistroX + 1.05, y1: bistroY, y2: bistroY + 1.05, nokta: [bistroX - 0.55, bistroY + 0.52], bak: [1, 0.2] });
  }

  // Görünüm kutusu (hem masaüstü hem mobilde tüm odayı ve en üst masa etiketini gereksiz boşluk bırakmadan kapsar)
  const kose = [[0, 0, 0], [W, 0, 0], [0, D, 0], [W, D, 0], [0, 0, 2.75], [W, 0, 2.75], [0, D, 2.75]].map((q) => iso(...q));
  const minX = Math.min(...kose.map((q) => q[0])) - 10;
  const maxX = Math.max(...kose.map((q) => q[0])) + 10;
  const cokluVar = groups.some((g) => g.devs.length > 1);
  const ustPay = compact ? (groups.length >= 5 ? 76 : 64) : (cokluVar ? 84 : 68);
  const minY = Math.min(kose[4][1] - 8, ...desks.map((q) => anchor(q)[1] - ustPay));
  const maxY = Math.max(...kose.map((q) => q[1])) + 12;

  // SVG tanımlar (gradyanlar ve ışık hüzmeleri)
  let g = `<defs>
    <linearGradient id="gokGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${vakit.gokUst}"/><stop offset="100%" stop-color="${vakit.gokAlt}"/></linearGradient>
    <radialGradient id="lambaIsik" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffb85c" stop-opacity="${vakit.lambaOp}"/><stop offset="100%" stop-color="#ffb85c" stop-opacity="0"/></radialGradient>
    <radialGradient id="uykuIsik" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffbe6b" stop-opacity="${(vakit.lambaOp * 0.92).toFixed(2)}"/><stop offset="100%" stop-color="#ffbe6b" stop-opacity="0"/></radialGradient>
    <radialGradient id="ekranIsik" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7fd0ef" stop-opacity=".22"/><stop offset="100%" stop-color="#7fd0ef" stop-opacity="0"/></radialGradient>
  </defs>`;

  // 1) Zemin karoları ve derz çizgileri
  for (let i = 0; i < W; i++) for (let j = 0; j < D; j++) {
    const w = Math.min(1, W - i), h = Math.min(1, D - j);
    g += `<polygon points="${pts([[i, j], [i + w, j], [i + w, j + h], [i, j + h]])}" fill="var(${(i + j) % 2 ? "--floor-a" : "--floor-b"})" stroke="rgba(255,255,255,.022)" stroke-width=".4"/>`;
  }

  // Dinlenme köşesi dokuma kilim/halı + lambader sıcak ışık havuzu
  const hx1 = kanepeX1 - 0.32, hx2 = sehpaX2 + 0.62, hy1 = kanepeY1 - 0.28, hy2 = kanepeY2 + 0.32;
  g += `<polygon points="${pts([[hx1, hy1], [hx2, hy1], [hx2, hy2], [hx1, hy2]])}" fill="${tema.hali[0]}" opacity=".92"/>`;
  g += `<polygon points="${pts([[hx1 + 0.15, hy1 + 0.15], [hx2 - 0.15, hy1 + 0.15], [hx2 - 0.15, hy2 - 0.15], [hx1 + 0.15, hy2 - 0.15]])}" fill="none" stroke="${tema.hali[1]}" stroke-width="1.3" opacity=".72"/>`;
  g += `<polygon points="${pts([[hx1 + 0.36, hy1 + 0.36], [hx2 - 0.36, hy1 + 0.36], [hx2 - 0.36, hy2 - 0.36], [hx1 + 0.36, hy2 - 0.36]])}" fill="${tema.hali[2]}" opacity=".78"/>`;
  const hmx = (hx1 + hx2) / 2, hmy = (hy1 + hy2) / 2;
  g += `<polygon points="${pts([[hmx, hmy - 0.45], [hmx + 0.55, hmy], [hmx, hmy + 0.45], [hmx - 0.55, hmy]])}" fill="${tema.hali[3]}" opacity=".55"/>`;
  const [lx0, ly0] = iso(kanepeX1 + 0.35, kanepeY1 - 0.1, 0.02);
  g += `<ellipse cx="${lx0.toFixed(1)}" cy="${ly0.toFixed(1)}" rx="108" ry="58" fill="url(#lambaIsik)"/>`;

  // Uyku köşesi yumuşak gece halısı + başucu lambası sıcak ışık havuzları
  {
    const ux1 = yatakBasX - 0.32, ux2 = yatakSagSon + 0.32, uy1 = yatakY0 - 0.24, uy2 = yatakAltSon + 0.28;
    g += `<polygon points="${pts([[ux1, uy1], [ux2, uy1], [ux2, uy2], [ux1, uy2]])}" fill="#212d3d" opacity=".92"/>`;
    g += `<polygon points="${pts([[ux1 + 0.15, uy1 + 0.15], [ux2 - 0.15, uy1 + 0.15], [ux2 - 0.15, uy2 - 0.15], [ux1 + 0.15, uy2 - 0.15]])}" fill="none" stroke="#6c89a8" stroke-width="1.15" opacity=".62"/>`;
    g += `<polygon points="${pts([[ux1 + 0.32, uy1 + 0.32], [ux2 - 0.32, uy1 + 0.32], [ux2 - 0.32, uy2 - 0.32], [ux1 + 0.32, uy2 - 0.32]])}" fill="#182230" opacity=".82"/>`;
    for (const km of komodinler) {
      const [klx, kly] = iso((km.x1 + km.x2) / 2, (km.y1 + km.y2) / 2, 0.03);
      g += `<ellipse cx="${klx.toFixed(1)}" cy="${kly.toFixed(1)}" rx="68" ry="36" fill="url(#uykuIsik)"/>`;
    }
  }

  // 2) Arka duvarlar, süpürgelik ve üst pervaz
  const WH = 2.7;
  g += `<polygon points="${pts([[0, 0, 0], [W, 0, 0], [W, 0, WH], [0, 0, WH]])}" fill="var(--wall-a)"/>`;
  g += `<polygon points="${pts([[0, 0, 0], [0, D, 0], [0, D, WH], [0, 0, WH]])}" fill="var(--wall-b)"/>`;
  g += `<polygon points="${pts([[0, 0, 0], [W, 0, 0], [W, 0, 0.18], [0, 0, 0.18]])}" fill="#182022"/>`;
  g += `<polygon points="${pts([[0, 0, 0], [0, D, 0], [0, D, 0.18], [0, 0, 0.18]])}" fill="#141b1d"/>`;
  g += `<polygon points="${pts([[0, 0, WH - 0.08], [W, 0, WH - 0.08], [W, 0, WH], [0, 0, WH]])}" fill="#38484b"/>`;
  g += `<polygon points="${pts([[0, 0, WH - 0.08], [0, D, WH - 0.08], [0, D, WH], [0, 0, WH]])}" fill="#2f3e41"/>`;
  const [kx0, ky0] = iso(0, 0, 0), [kx1, ky1] = iso(0, 0, WH);
  g += `<line x1="${kx0.toFixed(1)}" y1="${ky0.toFixed(1)}" x2="${kx1.toFixed(1)}" y2="${ky1.toFixed(1)}" stroke="#141b1d" stroke-width="1.4"/>`;

  // Panoramik pencereler (İstanbul gökyüzü, şehir silüeti ve zemine düşen gün/gece ışığı)
  const penGen = Math.min(3.8, W * 0.21);
  const pencereler = [W * 0.22, W * 0.58].filter((px) => px + penGen < W - 2.2);
  for (const px of pencereler) {
    // Zemine düşen pencere ışık hüzmesi
    g += `<polygon points="${pts([[px, 0.02, 0], [px + penGen, 0.02, 0], [px + penGen + 0.6, 2.3, 0], [px + 0.6, 2.3, 0]])}" fill="${vakit.isik}" opacity="${vakit.isikOp}"/>`;
    // Pencere kasası ve cam
    g += `<polygon points="${pts([[px - 0.08, 0, 0.78], [px + penGen + 0.08, 0, 0.78], [px + penGen + 0.08, 0, 2.32], [px - 0.08, 0, 2.32]])}" fill="#172023"/>`;
    g += `<polygon points="${pts([[px, 0, 0.85], [px + penGen, 0, 0.85], [px + penGen, 0, 2.25], [px, 0, 2.25]])}" fill="url(#gokGrad)"/>`;
    // Uzak şehir silüeti
    for (let b = 0; b < 5; b++) {
      const bx = px + 0.15 + b * (penGen / 5.2), bw = penGen / 6.2, bh = 0.28 + ((b * 37) % 5) * 0.09;
      g += `<polygon points="${pts([[bx, 0, 0.85], [bx + bw, 0, 0.85], [bx + bw, 0, 0.85 + bh], [bx, 0, 0.85 + bh]])}" fill="#111a26" opacity=".72"/>`;
      if (vakit.yildiz && b % 2 === 0) {
        const [wx, wy] = iso(bx + bw * 0.45, 0, 0.96 + bh * 0.4);
        g += `<circle cx="${wx.toFixed(1)}" cy="${wy.toFixed(1)}" r="1.1" fill="#ffd97d" opacity=".75"/>`;
      }
    }
    if (vakit.yildiz) {
      const [yx, yy] = iso(px + penGen * 0.76, 0, 1.98);
      g += `<circle cx="${yx.toFixed(1)}" cy="${yy.toFixed(1)}" r="3.2" fill="#f7eed0" opacity=".82"/>`;
      const [s1x, s1y] = iso(px + penGen * 0.28, 0, 2.02);
      g += `<circle cx="${s1x.toFixed(1)}" cy="${s1y.toFixed(1)}" r="0.9" fill="#fff" opacity=".7"/>`;
    } else {
      const [cx2, cy2] = iso(px + penGen * 0.35, 0, 1.95);
      g += `<ellipse cx="${cx2.toFixed(1)}" cy="${cy2.toFixed(1)}" rx="11" ry="3.8" fill="#fff" opacity=".28"/>`;
    }
    // Pencere kayıtları (alüminyum doğrama)
    const orta = px + penGen / 2;
    g += `<polygon points="${pts([[orta - 0.03, 0, 0.85], [orta + 0.03, 0, 0.85], [orta + 0.03, 0, 2.25], [orta - 0.03, 0, 2.25]])}" fill="#1c2629"/>`;
    g += `<polygon points="${pts([[px, 0, 0.75], [px + penGen + 0.06, 0, 0.75], [px + penGen + 0.06, 0.08, 0.81], [px, 0.08, 0.81]])}" fill="#3b4b4f"/>`;
  }

  // Arka duvarda canlı "Haftalık Limit" durum ekranı
  {
    // Sol arka duvarda ofisin marka tabelası (Claude / ChatGPT / Gemini)
    const tbX = 0.55, tbG = 1.75;
    if (tbX + tbG < (pencereler[0] ?? W) - 0.15) {
      g += `<polygon points="${pts([[tbX, 0, 1.62], [tbX + tbG, 0, 1.62], [tbX + tbG, 0, 2.3], [tbX, 0, 2.3]])}" fill="#10151a" stroke="${tema.tabelaRenk}" stroke-width="1.1"/>`;
      tema.noktalar.forEach((renk, i) => {
        const [nx, ny] = iso(tbX + 0.2 + i * 0.13, 0, 2.08);
        g += `<circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="2.1" fill="${renk}"/>`;
      });
      const [t1x, t1y] = iso(tbX + tbG / 2 + 0.12, 0, 1.98);
      g += `<g transform="matrix(0.866 0.5 0 1 ${t1x.toFixed(1)} ${t1y.toFixed(1)})"><text x="0" y="0" text-anchor="middle" fill="${tema.tabelaRenk}" font-size="10" font-weight="800" letter-spacing=".5">${esc(tema.tabela)}</text></g>`;
      const [t2x, t2y] = iso(tbX + tbG / 2, 0, 1.73);
      g += `<g transform="matrix(0.866 0.5 0 1 ${t2x.toFixed(1)} ${t2y.toFixed(1)})"><text x="0" y="0" text-anchor="middle" fill="#9fb0bf" font-size="6" font-weight="600">${esc(tema.altTabela)} ofisi</text></g>`;
    }
  }
  {
    const tvX = pencereler.length > 1 ? (pencereler[0] + penGen + pencereler[1]) / 2 - 0.85 : W * 0.46;
    if (tvX > 1.8 && tvX + 1.7 < W - 2) {
      g += `<polygon points="${pts([[tvX, 0, 1.25], [tvX + 1.65, 0, 1.25], [tvX + 1.65, 0, 2.12], [tvX, 0, 2.12]])}" fill="#141a1d" stroke="#3c4b4f" stroke-width=".8"/>`;
      g += `<polygon points="${pts([[tvX + 0.07, 0, 1.32], [tvX + 1.58, 0, 1.32], [tvX + 1.58, 0, 2.05], [tvX + 0.07, 0, 2.05]])}" fill="#0c1317"/>`;
      const oran = limitPct !== null ? Math.min(1, Math.max(0.04, limitPct / 100)) : 0.15;
      const barRenk = limitPct !== null && limitPct >= 85 ? "#f0786d" : limitPct !== null && limitPct >= 65 ? "#e0a64a" : "#67c1e3";
      g += `<polygon points="${pts([[tvX + 0.16, 0, 1.48], [tvX + 1.48, 0, 1.48], [tvX + 1.48, 0, 1.62], [tvX + 0.16, 0, 1.62]])}" fill="#1f2a2e"/>`;
      g += `<polygon points="${pts([[tvX + 0.16, 0, 1.48], [tvX + 0.16 + 1.32 * oran, 0, 1.48], [tvX + 0.16 + 1.32 * oran, 0, 1.62], [tvX + 0.16, 0, 1.62]])}" fill="${barRenk}"/>`;
      const [tx, ty] = iso(tvX + 0.82, 0, 1.82);
      g += `<g transform="matrix(0.866 0.5 0 1 ${tx.toFixed(1)} ${ty.toFixed(1)})"><text x="0" y="0" text-anchor="middle" fill="#cfe2e8" font-size="8" font-weight="700">${limitPct !== null ? "LİMİT %" + Math.round(limitPct) : "PANO"}</text></g>`;
    }
  }

  // Sol duvarda analog İstanbul saati, Sprint / Mimari Beyaz Tahta ve Kahve Köşesi Tablosu
  {
    const [sx2, sy2] = iso(0, 1.65, 1.92);
    const akrep = ((vakit.sa % 12) + vakit.dk / 60) * 30 * (Math.PI / 180);
    const yelkovan = vakit.dk * 6 * (Math.PI / 180);
    g += `<g transform="matrix(0.866 -0.5 0 1 ${sx2.toFixed(1)} ${sy2.toFixed(1)})">
      <circle r="9" fill="#182024" stroke="#6d8086" stroke-width="1.2"/>
      <circle r="7.5" fill="#edf2f4"/>
      <line x1="0" y1="0" x2="${(Math.sin(akrep) * 4.2).toFixed(1)}" y2="${(-Math.cos(akrep) * 4.2).toFixed(1)}" stroke="#1b2226" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="${(Math.sin(yelkovan) * 5.8).toFixed(1)}" y2="${(-Math.cos(yelkovan) * 5.8).toFixed(1)}" stroke="#c0504d" stroke-width=".95" stroke-linecap="round"/>
      <circle r="1" fill="#1b2226"/>
    </g>`;
    const wy1 = 2.4, wy2 = 4.6;
    g += `<polygon points="${pts([[0, wy1, 0.92], [0, wy2, 0.92], [0, wy2, 2.18], [0, wy1, 2.18]])}" fill="#dce3e6" stroke="#536368" stroke-width="1.2"/>`;
    g += `<polygon points="${pts([[0, wy1 + 0.08, 0.98], [0, wy2 - 0.08, 0.98], [0, wy2 - 0.08, 2.12], [0, wy1 + 0.08, 2.12]])}" fill="#f4f7f8"/>`;
    // Kanban sütun çizgileri ve renkli yapışkan notlar
    for (const cy of [wy1 + 0.78, wy1 + 1.48]) {
      const a = iso(0, cy, 1.05), b = iso(0, cy, 2.05);
      g += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#cad4d8" stroke-width=".8"/>`;
    }
    const notlar = [[0.22, 1.82, "#f6d365"], [0.46, 1.82, "#ff9a9e"], [0.22, 1.52, "#84fab0"], [0.92, 1.82, "#8fd3f4"], [0.92, 1.5, "#f6d365"], [1.62, 1.82, "#a6c1ee"], [1.62, 1.52, "#84fab0"]];
    for (const [dy, z0, renk] of notlar) {
      g += `<polygon points="${pts([[0, wy1 + dy, z0], [0, wy1 + dy + 0.19, z0], [0, wy1 + dy + 0.19, z0 + 0.2], [0, wy1 + dy, z0 + 0.2]])}" fill="${renk}"/>`;
    }
    // Kalemlik rafı
    g += box(0, wy1 + 0.3, 0.88, 0.1, 1.5, 0.05, "#6b7b80", "#4b585c", "#5b696e");
    // Kahve köşesi üstü çerçeveli poster
    const py1 = D - 4.25, py2 = D - 3.25;
    g += `<polygon points="${pts([[0, py1, 1.52], [0, py2, 1.52], [0, py2, 2.25], [0, py1, 2.25]])}" fill="#1b2226" stroke="#c48b55" stroke-width="1.1"/>`;
    g += `<polygon points="${pts([[0, py1 + 0.08, 1.59], [0, py2 - 0.08, 1.59], [0, py2 - 0.08, 2.18], [0, py1 + 0.08, 2.18]])}" fill="#263840"/>`;
    const [px0, py0] = iso(0, (py1 + py2) / 2, 1.84);
    g += `<circle cx="${px0.toFixed(1)}" cy="${py0.toFixed(1)}" r="6" fill="#d8a26f" opacity=".85"/>`;
  }

  // 3) Derinlik sıralı 3B mobilya ve eşyalar
  const ogeler = [];
  {
    // Sol arka köşe bitkisi
    const bSol = esyalar.find((e) => e.ad === "bitkiSol");
    ogeler.push({ ...bSol, svg: bitkiCiz(bSol.x1, bSol.y1, 1.05) });

    // Kahve ve Çay Barı (espresso makinesi, buhar, kupalar, simit tabağı)
    const k = esyalar.find((e) => e.ad === "kahve");
    let ks = box(k.x1, k.y1, 0, k.x2 - k.x1, k.y2 - k.y1, 0.88, "var(--oak-top)", "#22292d", "#2c353a");
    ks += box(k.x1 - 0.02, k.y1 - 0.02, 0.86, k.x2 - k.x1 + 0.05, k.y2 - k.y1 + 0.04, 0.07, "#e0ac79", "var(--oak-side)", "var(--oak)");
    // Dolap kapak çizgisi ve kulplar
    const [dk1, dky1] = iso(k.x2, k.y1 + 0.7, 0.08), [dk2, dky2] = iso(k.x2, k.y1 + 0.7, 0.82);
    ks += `<line x1="${dk1.toFixed(1)}" y1="${dky1.toFixed(1)}" x2="${dk2.toFixed(1)}" y2="${dky2.toFixed(1)}" stroke="#1b2124" stroke-width="1"/>`;
    // Espresso makinesi
    ks += box(k.x1 + 0.14, k.y1 + 0.2, 0.93, 0.52, 0.62, 0.52, "#4a525a", "#2b3036", "#383f47");
    ks += box(k.x1 + 0.22, k.y1 + 0.26, 1.45, 0.36, 0.48, 0.06, "#cfd6dc", "#9aa3ab", "#b4bec6");
    const [gx, gy] = iso(k.x1 + 0.67, k.y1 + 0.5, 1.26);
    ks += `<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="2.6" fill="#f3f5f6" stroke="#222" stroke-width=".6"/>`;
    // Buhar
    const [bx, by] = iso(k.x1 + 0.52, k.y1 + 0.55, 1.52);
    ks += `<g class="buhar"><path d="M${bx.toFixed(1)} ${by.toFixed(1)} q-3 -5 2 -10 q4 -4 0 -9"/><path d="M${(bx + 5).toFixed(1)} ${(by + 2).toFixed(1)} q3 -5 -2 -10 q-3 -4 1 -8"/></g>`;
    // Renkli kupalar ve simit tabağı
    ks += box(k.x1 + 0.32, k.y1 + 1.05, 0.93, 0.17, 0.17, 0.15, "#f7f9fa", "#cfd6db", "#e3e8ec");
    ks += box(k.x1 + 0.56, k.y1 + 1.12, 0.93, 0.17, 0.17, 0.15, "#d96b52", "#a84e39", "#c25d46");
    const [sx0, sy0] = iso(k.x1 + 0.52, k.y1 + 1.62, 0.95);
    ks += `<ellipse cx="${sx0.toFixed(1)}" cy="${sy0.toFixed(1)}" rx="8.5" ry="4.6" fill="#eef2f4" stroke="#bdc6cc" stroke-width=".6"/>`;
    ks += `<ellipse cx="${sx0.toFixed(1)}" cy="${(sy0 - 1).toFixed(1)}" rx="5.2" ry="2.7" fill="none" stroke="#c67d38" stroke-width="2.2"/>`;
    ogeler.push({ ...k, svg: ks });

    // Su Sebili
    const sb = esyalar.find((e) => e.ad === "sebil");
    let ts = box(sb.x1 + 0.06, sb.y1 + 0.06, 0, 0.52, 0.52, 0.92, "#e8edf0", "#bcc5cc", "#d4dce2");
    ts += box(sb.x1 + 0.44, sb.y1 + 0.18, 0.55, 0.12, 0.28, 0.22, "#262d32", "#1c2226", "#22292e");
    ts += box(sb.x1 + 0.13, sb.y1 + 0.13, 0.92, 0.38, 0.38, 0.52, "#a8dcf7", "#6fb2d9", "#89c7eb");
    const [kabX, kabY] = iso(sb.x1 + 0.34, sb.y1 + 0.34, 1.15);
    ts += `<circle class="led-yanip" cx="${kabX.toFixed(1)}" cy="${kabY.toFixed(1)}" r="1.6" fill="#fff" opacity=".65"/>`;
    ogeler.push({ ...sb, svg: ts });

    // Sunucu Dolabı (yanıp sönen LED'li)
    const sr = esyalar.find((e) => e.ad === "sunucu");
    let srs = box(sr.x1 + 0.08, sr.y1 + 0.08, 0, 0.76, 0.78, 1.82, "#3c4650", "#20262d", "#2c343d");
    for (let u = 0; u < 4; u++) {
      const uz = 0.28 + u * 0.36;
      const [lx1, ly1] = iso(sr.x1 + 0.14, sr.y2 - 0.08, uz + 0.12);
      const [lx2, ly2] = iso(sr.x1 + 0.62, sr.y2 - 0.08, uz + 0.12);
      srs += `<line x1="${lx1.toFixed(1)}" y1="${ly1.toFixed(1)}" x2="${lx2.toFixed(1)}" y2="${ly2.toFixed(1)}" stroke="#12161a" stroke-width="2.4"/>`;
      srs += `<circle class="led-yanip${u % 2 ? " gec" : ""}" cx="${(lx1 + 3).toFixed(1)}" cy="${(ly1 + 1.5).toFixed(1)}" r="1.3" fill="${u === 2 ? "#e0a64a" : "#56d364"}"/>`;
      srs += `<circle cx="${(lx1 + 7.5).toFixed(1)}" cy="${(ly1 + 3.8).toFixed(1)}" r="1.1" fill="#67c1e3"/>`;
    }
    ogeler.push({ ...sr, svg: srs });

    // Kitaplık + Sarı Debug Ördeği
    const rf = esyalar.find((e) => e.ad === "raf");
    let rfs = box(rf.x1 + 0.1, rf.y1 + 0.06, 0, 0.72, 1.06, 1.68, "var(--oak-top)", "var(--oak-side)", "var(--oak)");
    const kitapRenk = ["#c0504d", "#3f7cac", "#d08a2e", "#4f9a5a", "#8064a2", "#e8eef2"];
    for (let kat = 0; kat < 3; kat++) {
      const kz = 0.18 + kat * 0.48;
      rfs += box(rf.x1 + 0.12, rf.y1 + 0.12, kz, 0.45, 0.92, 0.05, "#7d532d", "#694524", "#754d29");
      for (let b = 0; b < 4; b++) {
        const kr = kitapRenk[(kat * 3 + b) % kitapRenk.length];
        rfs += box(rf.x1 + 0.16, rf.y1 + 0.18 + b * 0.2, kz + 0.05, 0.34, 0.14, 0.32 - (b % 2) * 0.05, kr, koyu(kr, 0.75), koyu(kr, 0.88));
      }
    }
    const [ox, oy] = iso(rf.x1 + 0.44, rf.y1 + 0.55, 1.72);
    rfs += `<ellipse cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" rx="3.8" ry="2.8" fill="#f5c842"/><circle cx="${(ox - 2).toFixed(1)}" cy="${(oy - 3.2).toFixed(1)}" r="2.2" fill="#ffd64f"/><polygon points="${(ox - 4).toFixed(1)},${(oy - 3.2).toFixed(1)} ${(ox - 6).toFixed(1)},${(oy - 2.6).toFixed(1)} ${(ox - 4).toFixed(1)},${(oy - 2.1).toFixed(1)}" fill="#e87e24"/>`;
    ogeler.push({ ...rf, svg: rfs });

    // Lambader (Dinlenme köşesi)
    const lb = esyalar.find((e) => e.ad === "lamba");
    const [lbx, lby] = iso(lb.x1 + 0.3, lb.y1 + 0.3, 0);
    const [, lbyUst] = iso(lb.x1 + 0.3, lb.y1 + 0.3, 1.65);
    let lbs = `<ellipse cx="${lbx.toFixed(1)}" cy="${lby.toFixed(1)}" rx="7" ry="3.5" fill="#2c3338" stroke="#475259" stroke-width=".7"/>`;
    lbs += `<line x1="${lbx.toFixed(1)}" y1="${lby.toFixed(1)}" x2="${lbx.toFixed(1)}" y2="${lbyUst.toFixed(1)}" stroke="#8c969c" stroke-width="1.8"/>`;
    lbs += `<polygon points="${(lbx - 8).toFixed(1)},${(lbyUst + 5).toFixed(1)} ${(lbx + 8).toFixed(1)},${(lbyUst + 5).toFixed(1)} ${(lbx + 5.2).toFixed(1)},${(lbyUst - 7).toFixed(1)} ${(lbx - 5.2).toFixed(1)},${(lbyUst - 7).toFixed(1)}" fill="#f3d59b" stroke="#c89f5d" stroke-width=".8"/>`;
    ogeler.push({ ...lb, svg: lbs });

    // İkili Modern Kanepe (+x yönüne bakar, kanepe-yuva oturanları kolçakların arasına yerleştirir)
    const kn = esyalar.find((e) => e.ad === "kanepe");
    let kns = box(kn.x1, kn.y1, 0.06, kn.x2 - kn.x1, kn.y2 - kn.y1, 0.34, tema.kanepe.ust, tema.kanepe.sol, tema.kanepe.sag);
    // Arka kolçak (y1), sırtlık (x1), minder çizgisi ve kırlentler
    kns += box(kn.x1, kn.y1, 0.4, kn.x2 - kn.x1, 0.22, 0.28, ...tema.kanepe.kol);
    kns += box(kn.x1, kn.y1, 0.4, 0.28, kn.y2 - kn.y1, 0.52, ...tema.kanepe.sirt);
    kns += box(kn.x1 + 0.3, kn.y1 + 0.28, 0.42, 0.22, 0.38, 0.28, tema.kirlent, koyu(tema.kirlent, 0.75), koyu(tema.kirlent, 0.88));
    kns += `<g class="kanepe-yuva"></g>`;
    // Ön kolçak (y2: oturan kişinin önünde kalır, gerçek 3B derinlik sağlar)
    kns += box(kn.x1, kn.y2 - 0.22, 0.4, kn.x2 - kn.x1, 0.22, 0.28, ...tema.kanepe.kol);
    ogeler.push({ ...kn, svg: kns });

    // Orta Sehpa (üstünde dizüstü bilgisayar, dergi ve kahve fincanı)
    const sh = esyalar.find((e) => e.ad === "sehpa");
    let shs = box(sh.x1 + 0.06, sh.y1 + 0.06, 0, 0.1, 0.1, 0.34, "#4b3621", "#3b2a19", "#43301d");
    shs += box(sh.x2 - 0.16, sh.y2 - 0.16, 0, 0.1, 0.1, 0.34, "#4b3621", "#3b2a19", "#43301d");
    shs += box(sh.x1, sh.y1, 0.34, sh.x2 - sh.x1, sh.y2 - sh.y1, 0.07, "var(--oak-top)", "var(--oak-side)", "var(--oak)");
    shs += box(sh.x1 + 0.2, sh.y1 + 0.22, 0.41, 0.36, 0.42, 0.03, "#8c969e", "#5d666d", "#747e86");
    shs += box(sh.x1 + 0.44, sh.y1 + 0.82, 0.41, 0.15, 0.15, 0.12, "#f4f6f7", "#cbd2d6", "#dfe4e8");
    ogeler.push({ ...sh, svg: shs });

    // Ön bitkiler ve isteğe bağlı yüksek ayaküstü sohbet masası
    const bOn = esyalar.find((e) => e.ad === "bitkiOn");
    ogeler.push({ ...bOn, svg: bitkiCiz(bOn.x1, bOn.y1, 0.95) });
    const bSag = esyalar.find((e) => e.ad === "bitkiSag");
    ogeler.push({ ...bSag, svg: bitkiCiz(bSag.x1, bSag.y1, 1.08) });

    if (bistroVar) {
      const bs = esyalar.find((e) => e.ad === "bistro");
      const [bx0, by0] = iso(bs.x1 + 0.52, bs.y1 + 0.52, 0);
      const [, byUst] = iso(bs.x1 + 0.52, bs.y1 + 0.52, 0.92);
      let bss = `<ellipse cx="${bx0.toFixed(1)}" cy="${by0.toFixed(1)}" rx="10" ry="5" fill="#252c30" stroke="#3f4a50" stroke-width=".8"/>`;
      bss += `<line x1="${bx0.toFixed(1)}" y1="${by0.toFixed(1)}" x2="${bx0.toFixed(1)}" y2="${byUst.toFixed(1)}" stroke="#3b454b" stroke-width="3.2"/>`;
      bss += `<ellipse cx="${bx0.toFixed(1)}" cy="${byUst.toFixed(1)}" rx="21" ry="11.5" fill="var(--oak-side)"/><ellipse cx="${bx0.toFixed(1)}" cy="${(byUst - 2.5).toFixed(1)}" rx="21" ry="11.5" fill="var(--oak-top)" stroke="#b67f4c" stroke-width=".6"/>`;
      bss += `<circle cx="${(bx0 - 6).toFixed(1)}" cy="${(byUst - 3).toFixed(1)}" r="2.4" fill="#f5f7f8"/><circle cx="${(bx0 + 7).toFixed(1)}" cy="${(byUst - 1).toFixed(1)}" r="2.8" fill="#5e9e6d"/>`;
      ogeler.push({ ...bs, svg: bss });
    }

    // Başucu komodinleri ve loş gece lambaları
    for (const km of komodinler) {
      let kms = box(km.x1, km.y1, 0, km.x2 - km.x1, km.y2 - km.y1, 0.44, "var(--oak-top)", "var(--oak-side)", "var(--oak)");
      const [cx1, cy1] = iso(km.x1 + 0.05, km.y2, 0.24), [cx2, cy2] = iso(km.x2 - 0.05, km.y2, 0.24);
      kms += `<line x1="${cx1.toFixed(1)}" y1="${cy1.toFixed(1)}" x2="${cx2.toFixed(1)}" y2="${cy2.toFixed(1)}" stroke="#3b2817" stroke-width="1"/>`;
      const [lmx, lmy] = iso((km.x1 + km.x2) / 2, (km.y1 + km.y2) / 2, 0.45);
      const [, lmyUst] = iso((km.x1 + km.x2) / 2, (km.y1 + km.y2) / 2, 0.68);
      kms += `<ellipse cx="${lmx.toFixed(1)}" cy="${lmy.toFixed(1)}" rx="3.4" ry="1.8" fill="#2c3338"/>`;
      kms += `<line x1="${lmx.toFixed(1)}" y1="${lmy.toFixed(1)}" x2="${lmx.toFixed(1)}" y2="${lmyUst.toFixed(1)}" stroke="#9aa4ad" stroke-width="1.3"/>`;
      kms += `<polygon points="${(lmx - 4.8).toFixed(1)},${(lmyUst + 3).toFixed(1)} ${(lmx + 4.8).toFixed(1)},${(lmyUst + 3).toFixed(1)} ${(lmx + 3.2).toFixed(1)},${(lmyUst - 4.5).toFixed(1)} ${(lmx - 3.2).toFixed(1)},${(lmyUst - 4.5).toFixed(1)}" fill="${vakit.yildiz ? "#ffd787" : "#efe2c6"}" stroke="#c59b57" stroke-width=".65"/>`;
      ogeler.push({ ad: "komodin", ...km, svg: kms });
    }

    // Uyku köşesi ahşap yataklar (yatak-yuva yastık ile yorgan arasına yerleşir: uyuyan kişi yorganın altında kalır)
    for (const sl of yatakSlotlar) {
      const bx = sl.x1, by = sl.y1, bw = sl.x2 - sl.x1, bd = sl.y2 - sl.y1;
      const [yorUst, yorSol, yorSag] = YORGAN_PALET[sl.slot % YORGAN_PALET.length];
      let ys = "";
      // Ayaklar ve meşe karyola kasası
      ys += box(bx + 0.03, by + 0.03, 0, 0.1, 0.1, 0.12, "#3b2a19", "#2b1e12", "#332415");
      ys += box(bx + bw - 0.13, by + 0.03, 0, 0.1, 0.1, 0.12, "#3b2a19", "#2b1e12", "#332415");
      ys += box(bx + 0.03, by + bd - 0.13, 0, 0.1, 0.1, 0.12, "#3b2a19", "#2b1e12", "#332415");
      ys += box(bx + bw - 0.13, by + bd - 0.13, 0, 0.1, 0.1, 0.12, "#3b2a19", "#2b1e12", "#332415");
      ys += box(bx, by, 0.1, bw, bd, 0.16, "var(--oak-top)", "var(--oak-side)", "var(--oak)");
      // Başlık ve kumaş sırt minderi
      ys += box(bx, by, 0.1, bw, 0.11, 0.7, "var(--oak-top)", "var(--oak-side)", "var(--oak)");
      ys += box(bx + 0.09, by + 0.09, 0.36, bw - 0.18, 0.05, 0.34, "#4b5968", "#35404b", "#3f4d5a");
      // Çarşaflı yatak şiltesi + dolgun yastık
      ys += box(bx + 0.04, by + 0.11, 0.24, bw - 0.08, bd - 0.18, 0.14, "#e9eef4", "#c4d0dc", "#d6e0ec");
      ys += box(bx + 0.17, by + 0.16, 0.38, bw - 0.34, 0.36, 0.1, "#ffffff", "#d5dfe9", "#e7eef6");
      // Uyuyan kişinin yerleşeceği 3B ara katman
      ys += `<g class="yatak-yuva" data-slot="${sl.slot}"></g>`;
      // Katlanmış beyaz çarşaf yakası + kapitone yorgan + ayak ucu ahşabı
      ys += box(bx + 0.02, by + 0.64, 0.36, bw - 0.04, 0.17, 0.14, "#f4f7fa", "#cbd5e0", "#e1e8f0");
      ys += box(bx + 0.02, by + 0.8, 0.34, bw - 0.04, bd - 0.87, 0.15, yorUst, yorSol, yorSag);
      const [qx1, qy1] = iso(bx + 0.07, by + 1.28, 0.492), [qx2, qy2] = iso(bx + bw - 0.07, by + 1.28, 0.492);
      ys += `<line x1="${qx1.toFixed(1)}" y1="${qy1.toFixed(1)}" x2="${qx2.toFixed(1)}" y2="${qy2.toFixed(1)}" stroke="rgba(255,255,255,.16)" stroke-width=".9"/>`;
      ys += box(bx, by + bd - 0.08, 0.1, bw, 0.08, 0.34, "var(--oak-top)", "var(--oak-side)", "var(--oak)");
      ogeler.push({ ad: "yatak", slot: sl.slot, x1: bx, x2: bx + bw, y1: by, y2: by + bd, svg: ys });
    }
  }

  // Çalışma masaları, çok renkli kod ekranları, ergonomik sandalyeler
  const labels = [];
  desks.forEach((q, dIdx) => {
    const { grp, x, y, dw, cx } = q;
    const devs = grp.devs, k = devs.length;
    const ilk = devs[0];
    const herhangiAcik = devs.some((dv) => liveSet.has(dv.id));
    const demoAttr = demoMu ? ` data-demo-grp="${esc(grp.id)}"` : "";
    let s = ilk ? `<g class="desk-hit" data-dev="${ilk.id}"${demoAttr}>` : "<g>";
    // Masa ayakları + tabla + masa matı
    s += box(x + 0.04, y + 0.04, 0, 0.1, DD - 0.08, 0.73, "#2b3338", "#1f2529", "#262d32");
    s += box(x + dw - 0.14, y + 0.04, 0, 0.1, DD - 0.08, 0.73, "#2b3338", "#1f2529", "#262d32");
    s += box(x, y, 0.73, dw, DD, 0.08, "var(--oak-top)", "var(--oak-side)", "var(--oak)");
    s += `<polygon points="${pts([[x + dw / 2 - 0.54, y + 0.46, 0.812], [x + dw / 2 + 0.64, y + 0.46, 0.812], [x + dw / 2 + 0.64, y + 0.88, 0.812], [x + dw / 2 - 0.54, y + 0.88, 0.812]])}" fill="#20262b" opacity=".82"/>`;
    if (herhangiAcik) {
      const [gx, gy] = iso(x + dw / 2, y + 0.42, 0.82);
      s += `<ellipse cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" rx="36" ry="18" fill="url(#ekranIsik)"/>`;
    }
    // Haftalık harcama kâğıt yığını + masa kupası
    const ph = maxUsd > 0 ? Math.max(0.04, (grp.usd / maxUsd) * 0.34) : 0.04;
    s += box(x + dw - 0.38, y + 0.56, 0.81, 0.28, 0.34, ph, "#ffffff", "#d2d7d9", "#e6eaec");
    const gor = gorunumler[grp.id] || null;
    const kupaIdx = gor && Number.isInteger(gor.renk) && gor.renk >= 0 ? gor.renk : dIdx;
    const kupaR = UST_PALET[kupaIdx % UST_PALET.length][0];
    s += box(x + 0.12, y + 0.64, 0.81, 0.14, 0.14, 0.13, "#f5f7f8", koyu(kupaR, 0.8), kupaR);

    // Bilgisayar ekranları
    devs.slice(0, 3).forEach((dev, j) => {
      const on = liveSet.has(dev.id);
      const mw = k === 1 ? 0.98 : 0.72, mx = k === 1 ? x + (dw - mw) / 2 : x + 0.2 + j * 0.8;
      let m = `<g class="desk-hit" data-dev="${dev.id}"${demoAttr}><title>${esc(dev.label)}</title>`;
      m += box(mx + mw / 2 - 0.12, y + 0.16, 0.81, 0.24, 0.16, 0.02, "#2f373b", "#232a2d", "#293135");
      m += box(mx + mw / 2 - 0.04, y + 0.19, 0.83, 0.08, 0.08, 0.15, "#434e53", "#2f373b", "#394347");
      m += box(mx, y + 0.14, 0.98, mw, 0.06, 0.54, "#2f373b", "#1e2427", "#262d31");
      const sc = [[mx + 0.05, y + 0.202, 1.02], [mx + mw - 0.05, y + 0.202, 1.02], [mx + mw - 0.05, y + 0.202, 1.47], [mx + 0.05, y + 0.202, 1.47]];
      m += `<polygon points="${pts(sc)}" fill="${on ? tema.ekran : "var(--screen-off)"}"/>`;
      if (on) {
        m += `<polygon points="${pts([[mx + 0.05, y + 0.203, 1.40], [mx + mw - 0.05, y + 0.203, 1.40], [mx + mw - 0.05, y + 0.203, 1.47], [mx + 0.05, y + 0.203, 1.47]])}" fill="${tema.ekranBant}"/>`;
        const L = (fx, fz, len, col) => {
          const a = iso(mx + 0.11 + fx, y + 0.205, 1.07 + fz), b2 = iso(mx + 0.11 + fx + len, y + 0.205, 1.07 + fz);
          return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b2[0].toFixed(1)}" y2="${b2[1].toFixed(1)}" stroke="${col}"/>`;
        };
        const u = mw - 0.24;
        m += `<g class="screen-lines">${L(0, 0.27, u * 0.92, tema.kodRenk[0])}${L(0.05, 0.19, u * 0.68, tema.kodRenk[1])}${L(0.05, 0.11, u * 0.82, tema.kodRenk[2])}${L(0, 0.04, u * 0.55, tema.kodRenk[3])}</g>`;
      }
      s += m + "</g>";
    });
    // Klavye ve fare
    s += box(x + dw / 2 - 0.42, y + 0.54, 0.815, 0.78, 0.24, 0.03, "#aeb6ba", "#7c8589", "#949da1");
    s += box(x + dw / 2 + 0.44, y + 0.59, 0.815, 0.12, 0.18, 0.03, "#aeb6ba", "#7c8589", "#949da1");

    // Ergonomik döner sandalye: yıldız ayak, amortisör, minder, oturan yuvası ve kavisli arkalık
    const [ayX, ayY] = iso(cx + 0.3, y + DD + 0.36, 0.02);
    s += `<ellipse cx="${ayX.toFixed(1)}" cy="${ayY.toFixed(1)}" rx="11" ry="5.5" fill="#1e2428" stroke="#364046" stroke-width="1.2"/>`;
    s += box(cx + 0.25, y + DD + 0.31, 0.03, 0.1, 0.1, 0.32, "#353f44", "#242b2f", "#2c3539");

  OFIS.sahne = {

    kisiler: groups.map((grp, i) => {
      const q = desks.find((x) => x.grp.id === grp.id);
      const gor = gorunumler[grp.id] || null;
      const rIdx = gor && Number.isInteger(gor.renk) && gor.renk >= 0 ? gor.renk : i;
      return { id: grp.id, ad: grp.ad, i, gorunum: gor, renk: UST_PALET[rIdx % UST_PALET.length][0], canli: grp.devs.some((dev) => liveSet.has(dev.id)), asim: asanlar.has(grp.id), fazla: asanlar.get(grp.id) || 0, koltuk: q.koltuk, yanasma: q.yanasma };
    }),
    anahtar: `${d.saglayici || "claude"}|${W.toFixed(2)}|${D.toFixed(2)}|${compact}|${groups.map((x) => x.id).join(",")}|${JSON.stringify(ofisAyar)}`,
  };

  const sglOfis = d.saglayici || "claude";
  const durumOf = (dev) => {
    const on = liveSet.has(dev.id), a = ago(dev.last_seen, d.now);

  const lbl = labels.map(({ grp, lx, ly }) => {

    if (!devs.length) {

    const ds = devs.map(durumOf);
    const on = ds.some((x) => x.on);
    const son = devs.reduce((a, x) => (x.last_seen > a.last_seen ? x : a), devs[0]);
    const a = ago(son.last_seen, d.now);
    const status = on ? "şu an aktif" : a.t.replace(/^son veri /, "");
    const supheliVar = devs.some((x) => isSus(x, sglOfis));
    const dikkatVar = !supheliVar && devs.some((x) => isWarn(x, sglOfis));
    const eskiVar = devs.some((x) => isOld(x, d));
    const state = supheliVar ? "bad" : on ? "on" : a.stale ? "stale" : "idle";
    const uyariHtml = asimPuan
      ? `<small class="dl-uyari bad">+%${asimPuan}<span class="dl-asim-ek"> aşım</span></small>`
      : supheliVar
        ? `<small class="dl-uyari bad">şüpheli</small>`
        : dikkatVar
          ? `<small class="dl-uyari warn">dikkat</small>`
          : eskiVar
            ? `<small class="dl-uyari warn">eski sürüm</small>`
            : "";
    const durumHtml = `<small class="dl-durum${!on && a.stale ? " warn" : ""}">${esc(status)}</small>`;
    if (devs.length === 1) {
      const dev = devs[0];
      if (demoMu) {
        return `<button type="button" class="desk-label" data-demo-grp="${esc(grp.id)}" ${veriAttr} aria-label="${esc(grp.ad)}, ${money(grp.usd)}, ${esc(status)}" style="${pos}">
      <b><i class="dot ${state}"></i><span class="dl-ad">${esc(grp.ad)}</span></b><span class="dl-alt"><span class="amt">${money(grp.usd)}</span>${uyariHtml}</span>${uyariHtml ? "" : durumHtml}</button>`;

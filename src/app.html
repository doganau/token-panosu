// Seçili gün sayfa yenilense de (aynı hafta ve sağlayıcı içinde) korunur
let seciliGun = { start: null, sgl: null, gun: null };
const haftaGun = (d) => (seciliGun.start === d.start && seciliGun.sgl === (d.saglayici || "claude") ? seciliGun.gun : null);
function wireGunler(d, perDev) {
  const sgl = d.saglayici || "claude";
  const ciz = () => {
    const g = haftaGun(d);
    $("#limwrap").innerHTML = limitPanel(d, perDev, g);
    document.querySelectorAll(".days .day[data-gun]").forEach((el) => {
      const sec = Number(el.dataset.gun) === g;
      el.classList.toggle("secili", sec);
      el.setAttribute("aria-pressed", String(sec));
    });
  };
  const sec = (g) => { seciliGun = { start: d.start, sgl, gun: g === haftaGun(d) ? null : g }; ciz(); };
  $("#gunwrap").onclick = (e) => { const el = e.target.closest("[data-gun]"); if (el) sec(Number(el.dataset.gun)); };
  $("#gunwrap").onkeydown = (e) => {
    const el = e.target.closest("[data-gun]");
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); sec(Number(el.dataset.gun)); }
  };
  $("#limwrap").onclick = async (e) => {
    if (e.target.closest("[data-gun-kaldir]")) { seciliGun = { start: null, sgl: null, gun: null }; ciz(); return; }
    if (e.target.closest("[data-fable-ac]")) { fableFormAcik = true; ciz(); $("#fable-pct")?.focus(); return; }
    const clSil = e.target.closest("[data-claude-sil]");
    if (clSil) {
      clSil.disabled = true;
      try { await api("/api/yonetim/claude-yuzde", { method: "POST", body: JSON.stringify({ pct: null, h_pct: null }) }); await pageWeek(true); }
      catch { clSil.disabled = false; }
      return;
    }
    const fbSil = e.target.closest("[data-fable-sil]");
    if (fbSil) {
      fbSil.disabled = true;
      try { await api("/api/yonetim/fable-yuzde", { method: "POST", body: JSON.stringify({ pct: null }) }); await pageWeek(true); }
      catch { fbSil.disabled = false; }
      return;
    }
    const silBtn = e.target.closest("[data-sgl-sil]");
    if (silBtn) {
      silBtn.disabled = true;
      try { await api("/api/yonetim/saglayici-yuzde", { method: "POST", body: JSON.stringify({ saglayici: silBtn.dataset.sglSil, pct: null }) }); await pageWeek(true); }
      catch { silBtn.disabled = false; }
    }
  };
  $("#limwrap").onsubmit = async (e) => {
    const cf = e.target.closest("[data-claude-form]");
    if (cf) {
      e.preventDefault();
      const durum = $(".fable-durum", cf), btn = $("button[type=submit]", cf);
      const pct = Number(String(cf.pct.value).replace(",", "."));
      if (!Number.isFinite(pct) || pct < 0 || pct > 100) { durum.textContent = "0 ile 100 arasında bir sayı yaz."; return; }
      btn.disabled = true; durum.textContent = "Kaydediliyor…";
      try { await api("/api/yonetim/claude-yuzde", { method: "POST", body: JSON.stringify({ pct }) }); await pageWeek(true); }
      catch (er) { durum.textContent = er.message === "giriş" ? "" : "Kaydedilemedi."; btn.disabled = false; }
      return;
    }
    const ff = e.target.closest("[data-fable-form]");
    if (ff) {
      e.preventDefault();
      const durum = $(".fable-durum", ff), btn = $("button[type=submit]", ff);
      const pct = Number(String(ff.pct.value).replace(",", "."));
      if (!Number.isFinite(pct) || pct < 0 || pct > 100) { durum.textContent = "0 ile 100 arasında bir sayı yaz."; return; }
      btn.disabled = true; durum.textContent = "Kaydediliyor…";
      try { await api("/api/yonetim/fable-yuzde", { method: "POST", body: JSON.stringify({ pct }) }); await pageWeek(true); }
      catch (er) { durum.textContent = er.message === "giriş" ? "" : "Kaydedilemedi."; btn.disabled = false; }
      return;
    }
    const sf = e.target.closest("[data-sgl-form]");
    if (sf) {
      e.preventDefault();
      const durum = $(".fable-durum", sf), btn = $("button[type=submit]", sf);
      const pct = Number(String(sf.pct.value).replace(",", "."));
      if (!Number.isFinite(pct) || pct < 0 || pct > 100) { durum.textContent = "0 ile 100 arasında bir sayı yaz."; return; }
      btn.disabled = true; durum.textContent = "Kaydediliyor…";
      try { await api("/api/yonetim/saglayici-yuzde", { method: "POST", body: JSON.stringify({ saglayici: sf.dataset.sgl, pct }) }); await pageWeek(true); }
      catch (er) { durum.textContent = er.message === "giriş" ? "" : "Kaydedilemedi."; btn.disabled = false; }
    }
  };
}
function wireDesks() {
  document.querySelectorAll(".desk-hit").forEach((g) => (g.onclick = (e) => { e.stopPropagation(); go(`/pano/bilgisayar/${g.dataset.dev}${location.search}`); }));
  document.querySelectorAll(".desk-label.multi[data-dev]").forEach((dl) => {
    dl.onclick = (e) => {
      if (e.target.closest(".dvs a")) return;
      e.stopPropagation();
      go(`/pano/bilgisayar/${dl.dataset.dev}${location.search}`);
    };
    dl.onkeydown = (e) => {
      if (e.target.closest(".dvs a")) return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        go(`/pano/bilgisayar/${dl.dataset.dev}${location.search}`);
      }
    };
  });
}

const WEEK_SN = 7 * 86400;

        svg.insertBefore(m, svg.querySelector(".hit") || null);
      }
    };
    const secDegis = (i) => { const t = s.pts[i]?.t; if (t === undefined || t > d.now) return; sec(selT === t ? null : t); $("#gsr").textContent = selT === null ? "Seçim kaldırıldı" : `Seçildi: ${dilimAdi(s.pts[i], s.adim, mode)}`; };
    const goster = (i) => {
      const son = s.pts.findLastIndex((p) => p.t <= d.now);
      i = Math.max(0, Math.min(son, i)); secili = i;
      const p = s.pts[i];
      svg.querySelectorAll(".col.on, .hit.on").forEach((e) => e.classList.remove("on"));
      svg.querySelector(`.col[data-i="${i}"]`)?.classList.add("on");
      svg.querySelector(`.hit[data-i="${i}"]`)?.classList.add("on");
      const devam = p.t + s.adim > d.now;
      const r = box.clientWidth / W;
      let yTop;
      if (grafikCizgi) {
        const cv = g.cum[i], px = g.cx(i), py = g.y(cv);
        if (cross) { cross.setAttribute("x1", px.toFixed(1)); cross.setAttribute("x2", px.toFixed(1)); cross.style.display = ""; }
        if (ptOn) { ptOn.setAttribute("cx", px.toFixed(1)); ptOn.setAttribute("cy", py.toFixed(1)); ptOn.style.display = ""; }
        tip.innerHTML = `<b>${usd2.format(cv)}</b><span>${p.usd > 0 ? `+${usd2.format(p.usd)} bu dilimde` : "bu dilimde artış yok"} · ${short(g.cumTok[i])} token</span><small>${dilimAdi(p, s.adim, mode)}${devam ? ", sürüyor" : ""}</small>`;
        yTop = py;
        $("#gsr").textContent = `${dilimAdi(p, s.adim, mode)}: toplam ${usd2.format(cv)}`;
      } else {
        tip.innerHTML = `<b>${money(p.usd)}</b><span>${short(p.tok)} token</span><small>${dilimAdi(p, s.adim, mode)}${devam ? ", sürüyor" : ""}</small>`;
        yTop = p.usd > 0 ? g.y(p.usd) : GT + (H - GT - GB);
        $("#gsr").textContent = `${dilimAdi(p, s.adim, mode)}: ${money(p.usd)}, ${short(p.tok)} token`;
      }
      tip.style.left = `${Math.min(box.clientWidth - 90, Math.max(90, g.cx(i) * r))}px`;
      tip.style.top = `${Math.max(0, yTop * r - 10)}px`;
      tip.style.display = "grid";
    };
    const gizle = () => {
      secili = -1; tip.style.display = "none";
      if (cross) cross.style.display = "none";
      if (ptOn) ptOn.style.display = "none";
      svg.querySelectorAll(".col.on, .hit.on").forEach((e) => e.classList.remove("on"));
    };
    const konum = (e) => {
      const r = svg.getBoundingClientRect();
      return Math.floor((((e.clientX - r.left) / r.width) * W - g.gl) / g.band);
    };
    // ipucu yalnızca fare ile; dokunmada seçim paneli yeterli ve ipucu panelin üstünde takılı kalmaz
    svg.onpointermove = (e) => { if (e.pointerType !== "mouse") return; const i = konum(e); if (i >= 0 && i < s.pts.length && s.pts[i].t <= d.now) goster(i); else gizle(); };
    svg.onclick = (e) => { const i = konum(e); if (i >= 0 && i < s.pts.length) secDegis(i); if (e.pointerType && e.pointerType !== "mouse") gizle(); };
    svg.onpointerleave = (e) => { if (e.pointerType === "mouse") gizle(); };
    svg.onblur = gizle;
    svg.onkeydown = (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home" || e.key === "End") {
        e.preventDefault();
        const son = s.pts.findLastIndex((p) => p.t <= d.now);
        goster(e.key === "Home" ? 0 : e.key === "End" ? son : secili < 0 ? son : secili + (e.key === "ArrowRight" ? 1 : -1));
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        secDegis(secili < 0 ? s.pts.findLastIndex((p) => p.t <= d.now) : secili);
      } else if (e.key === "Escape") { gizle(); if (selT !== null) { sec(null); $("#gsr").textContent = "Seçim kaldırıldı"; } }
    };
    uygula(); panel();
  };
  document.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { mode = b.dataset.mode; selT = null; draw(); }));
  if (cizgiBtn) cizgiBtn.onclick = () => { grafikCizgi = !grafikCizgi; draw(); };
  const onK = (e) => {
    if (!$("#gr")) { removeEventListener("keydown", onK); return; }
    if (e.key === "Escape" && selT !== null) sec(null);
  };
  addEventListener("keydown", onK);
  const gdt = $("#gdt");
  if (gdt) gdt.onclick = (e) => { if (e.target.closest("[data-sel-kaldir]")) sec(null); };
  draw();
  // 1 ve 6 saat modunda 60 sn'de bir yenile; sayfa değişince (grafik DOM'da yokken) zamanlayıcı ve dinleyici kalkar
  clearInterval(refresh);
  refresh = setInterval(async () => {
    if (!$("#gr")) { clearInterval(refresh); removeEventListener("resize", onR); return; }
    if (!MODLAR[mode].bes || document.hidden) return;
    try { d = await loadWeek(); draw(); } catch {}
  }, 60000);
  const onR = () => { if (!$("#gr")) { removeEventListener("resize", onR); return; } draw(); };
  addEventListener("resize", onR);
}

// ---------------- bilgisayar detayı & hesap yardımcıları ----------------
function gorulenHesaplarListesi(devices, sglId) {
  const ozetEposta = new Map();
  for (const dv of devices || []) {
    const ep = dv.hesapEposta && dv.hesapEposta[sglId];
    const oz = dv.hesaplar && dv.hesaplar[sglId];
    if (ep && oz && !ozetEposta.has(oz)) ozetEposta.set(oz, ep);
  }
  const harita = new Map();
  for (const dv of devices || []) {
    const oz = (dv.hesaplar && dv.hesaplar[sglId]) || "";
    const ep = (dv.hesapEposta && dv.hesapEposta[sglId]) || (oz ? ozetEposta.get(oz) || "" : "");
    if (!ep && !oz) continue;
    const anahtar = ep ? "e:" + ep : "o:" + oz;
    let g = harita.get(anahtar);
    if (!g) {
      g = { anahtar, eposta: ep, ozet: oz, cihazlar: [], ilkEtiket: dv.label || "", ilkCihazId: dv.id };
      harita.set(anahtar, g);
    } else if (!g.ozet && oz) {
      g.ozet = oz;
    }
    if (dv.label && !g.cihazlar.includes(dv.label)) g.cihazlar.push(dv.label);
  }
  return [...harita.values()].sort((a, b) => Number(!!b.eposta) - Number(!!a.eposta) || b.cihazlar.length - a.cihazlar.length);
}

// select-menu-interaction rehberi: :user-invalid ARIA eşitlemesi, koşullu aria-describedby ve kademeli geri dönüş
const kilitAlanKirli = new WeakMap();
function alanHataBagla(el, goster) {
  const errId = el.dataset && el.dataset.error;
  if (!errId) return;
  const ids = (el.getAttribute("aria-describedby") || "").split(/\s+/).filter((id) => id && id !== errId);
  if (goster) ids.push(errId);
  if (ids.length) el.setAttribute("aria-describedby", ids.join(" "));
  else el.removeAttribute("aria-describedby");
}
function etkilesimliDogrulamaBagla(kok) {
  if (!kok) return;
  const destekVar = typeof CSS !== "undefined" && CSS.supports && CSS.supports("selector(:user-invalid)");
  const guncelle = (el) => {
    if (!el || !el.matches || !el.matches("input, select, textarea") || !el.validity) return;
    let gecersiz = false;
    if (destekVar) {
      gecersiz = el.matches(":user-invalid");
    } else {
      const st = kilitAlanKirli.get(el);
      gecersiz = !!(st && st.etkilesti && st.cikti && !el.validity.valid);
      el.classList.toggle("user-invalid-fallback", gecersiz);
    }
    el.setAttribute("aria-invalid", gecersiz ? "true" : "false");
    alanHataBagla(el, gecersiz);
  };
  kok.querySelectorAll("input[data-error], select[data-error]").forEach((el) => {
    el.setAttribute("aria-invalid", "false");
    alanHataBagla(el, false);
    el.addEventListener("invalid", () => {
      kilitAlanKirli.set(el, { etkilesti: true, cikti: true });
      guncelle(el);
    });
    el.addEventListener("input", () => {
      const st = kilitAlanKirli.get(el) || { etkilesti: false, cikti: false };
      st.etkilesti = true;
      kilitAlanKirli.set(el, st);
      guncelle(el);
    });
    el.addEventListener("change", () => {
      const st = kilitAlanKirli.get(el) || { etkilesti: false, cikti: false };
      st.etkilesti = true;
      st.cikti = true;
      kilitAlanKirli.set(el, st);
      guncelle(el);
    });
    el.addEventListener("blur", () => {
      const st = kilitAlanKirli.get(el) || { etkilesti: false, cikti: false };
      st.cikti = true;
      kilitAlanKirli.set(el, st);
      guncelle(el);
    });
  });
}

function cihazHesapRozetleri(dev, hesapKilit) {
  const hs = dev.hesaplar || {};
  const eps = dev.hesapEposta || {};
  const bayraklar = flagsOf(dev);
  return SAGLAYICILAR.map((p) => {
    const farkli = bayraklar.some((f) => f.k === "farkli_hesap_" + p.id);
    const oz = hs[p.id] || "";
    const kilit = hesapKilit && hesapKilit[p.id];
    const ep = eps[p.id] || (!farkli && oz && kilit && kilit.ozet === oz && kilit.eposta ? kilit.eposta : "");
    const gorunen = ep || (oz ? "#" + oz.slice(0, 6) : "");
    const ayrinti = ep ? `${ep}${oz ? ` (#${oz.slice(0, 8)})` : ""}` : oz ? `#${oz.slice(0, 8)}` : "ayrı hesap";
    if (farkli) return `<span class="pill" title="Ayrı ${esc(p.ad)} hesabı (${esc(ayrinti)}) — ortak ofis kotasına dahil edilmez">${ICON[p.id]}<span>${esc(p.ad)}: ${esc(ep ? `${ep} (ayrı hesap)` : "Ayrı hesap")}</span></span>`;
    const ortakEslesiyor = kilit && ((kilit.eposta && ep && kilit.eposta === ep) || (!ep && kilit.ozet && oz === kilit.ozet) || (!kilit.eposta && kilit.ozet && oz === kilit.ozet));
    if (gorunen && ortakEslesiyor) return `<span class="pill pill-ok" title="Ortak ${esc(p.ad)} hesabı doğrulandı: ${esc(ayrinti)}">${ICON[p.id]}<span>${esc(p.ad)}: ${esc(gorunen)}</span></span>`;
    if (gorunen) return `<span class="pill" title="${esc(p.ad)} hesabı: ${esc(ayrinti)}">${ICON[p.id]}<span>${esc(p.ad)}: ${esc(gorunen)}</span></span>`;
    return "";
  }).filter(Boolean).join("");
}

// ---------------- limit analizi ----------------
// Soru: limit yüzdesinin yükselişi harcanan token ile ne kadar uyuşuyor? Bu bölümdeki fonksiyonlar DOM'a dokunmaz.

// Hafta başından t anına kadar birikmiş kullanım. Saatlik kovalar toplanır;
// t'nin düştüğü kısmi saat, saat içinde düzgün dağılmış varsayılarak doğrusal oranlanır.
// saatlik: [{hour, usd, usd_fablesiz, tok, ...}] saate göre sıralı; anahtar: toplanacak alan.
function birikimli(saatlik, t, anahtar) {
  let toplam = 0;
  for (const h of saatlik) {
    if (h.hour >= t) break;
    toplam += h[anahtar] * Math.min(1, (t - h.hour) / 3600);
  }
  return toplam;
}

// Sıradan en küçük kareler: y = a + b·x. R² = korelasyon katsayısının karesi (0 ile 1 arası).
// x'ler hepsi aynıysa (sxx = 0) ya da y'ler hepsi aynıysa doğru tanımsızdır: null döner.
function dogruUydur(xs, ys) {
  const n = xs.length;
  if (n < 2) return null;
  const mx = xs.reduce((a, v) => a + v, 0) / n, my = ys.reduce((a, v) => a + v, 0) / n;
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxx += (xs[i] - mx) ** 2; sxy += (xs[i] - mx) * (ys[i] - my); syy += (ys[i] - my) ** 2; }
  if (!(sxx > 0) || !(syy > 0)) return null;
  const b = sxy / sxx;
  return { a: my - b * mx, b, r2: (sxy * sxy) / (sxx * syy), n };
}

// Yüzdenin yeni bir değere çıktığı ilk okumalar (tamsayı yüzdenin basamak gürültüsünü ayıklar).
function degisimNoktalari(seri) {
  const out = [];
  for (const p of [...seri].sort((x, y) => x.t - y.t)) if (!out.length || p.pct !== out[out.length - 1].pct) out.push(p);
  return out;
}

const OLCUTLER = [
  { k: "usd", ad: "API karşılığı, tüm modeller", usd: true },
  { k: "usd_fablesiz", ad: "API karşılığı, Fable hariç", usd: true, sgl: "claude" },
  { k: "tok", ad: "Toplam token", usd: false },
];
const EN_AZ_DEGER = 3; // doğru uydurmak için gereken farklı yüzde sayısı

// Tüm analiz: noktalar, ölçütler için doğru, en iyi uyum ve ardışık değişimler arası aralıklar.
function limitAnaliz(d) {
  const sgl = d.saglayici || "claude";
  const aktifOlcutler = OLCUTLER.filter((m) => !m.sgl || m.sgl === sgl);
  const pts = degisimNoktalari(d.seri || []).map((p) => {
    const o = { t: p.t, pct: p.pct };
    for (const m of aktifOlcutler) o[m.k] = birikimli(d.saatlik, p.t, m.k);
    return o;
  });
  const farkli = new Set(pts.map((p) => p.pct)).size;
  const yeterli = farkli >= EN_AZ_DEGER;
  const olcutler = aktifOlcutler.map((m) => ({ ...m, fit: yeterli ? dogruUydur(pts.map((p) => p[m.k]), pts.map((p) => p.pct)) : null }))
    .map((m) => ({ ...m, gecerli: !!(m.fit && m.fit.b > 0) })); // eğim pozitif değilse harcamayla ilişki yok demektir
  const iyi = olcutler.filter((m) => m.gecerli).sort((x, y) => y.fit.r2 - x.fit.r2)[0] || null;
  const usdFit = olcutler[0].gecerli ? olcutler[0].fit : null;
  const araliklar = [];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], dp = b.pct - a.pct, usd = b.usd - a.usd;
    const beklenen = usdFit ? dp / usdFit.b : null; // doğruya göre bu yükselişin "olması gereken" harcaması
    araliklar.push({ bas: a.t, son: b.t, dp, usd, basina: dp > 0 ? usd / dp : null, beklenen, sapma: beklenen === null ? null : usd - beklenen });
  }
  return { pts, farkli, yeterli, olcutler, iyi, usdFit, araliklar, okuma: (d.ham || []).length };
}

const isaretli = (v) => (v < 0 ? "−" : "+") + money(Math.abs(v));
const birimYaz = (m, v) => (m.usd ? money(v) : short(v) + " token");

// Zaman grafiği: x = hafta başından şimdiye zaman, y = limit yüzdesi. İki çizgi, tek eksen:
// gerçek limit (okumalardan basamaklı) ve harcamadan beklenen (a + b × birikmiş API karşılığı, saatlik).
function zamanSeri(A, d) {
  const t0 = d.start, t1 = Math.max(t0 + 3600, Math.min(d.now, d.end));
  const pts = A.pts, ilk = pts.length ? pts[0].t : null;
  const gercek = (t) => { let v = null; for (const p of pts) { if (p.t <= t) v = p.pct; else break; } return v; };
  let beklenen = null, yaklasik = false;
  const fit = A.usdFit;
  if (fit) beklenen = (t) => Math.max(0, fit.a + fit.b * birikimli(d.saatlik, t, "usd"));
  else if (pts.length) {
    const son = pts[pts.length - 1], c = birikimli(d.saatlik, son.t, "usd");
    if (c > 0) { yaklasik = true; beklenen = (t) => (son.pct * birikimli(d.saatlik, t, "usd")) / c; }
  }
  const saat = [];
  for (let t = t0; t < t1; t += 3600) saat.push(t);
  saat.push(t1);
  return { t0, t1, ilk, gercek, beklenen, yaklasik, saat };
}
function zamanGrafik(A, S, W, H) {
  const wide = W >= 640, gr = wide ? 96 : GR;
  const iw = W - GL - gr, ih = H - GT - GB, base = GT + ih;
  const exp = S.beklenen ? S.saat.map((t) => S.beklenen(t)) : [];
  const maxY = Math.max(1, ...A.pts.map((p) => p.pct), ...exp);
  const adimY = [1, 2, 5, 10, 20, 25].find((s) => (maxY * 1.05) / s <= 5) || 25;
  const topY = Math.min(100, Math.ceil((maxY * 1.05) / adimY) * adimY);
  const x = (t) => GL + ((t - S.t0) / (S.t1 - S.t0)) * iw, y = (v) => base - (Math.min(v, topY) / topY) * ih;
  const yt = [];
  for (let v = 0; v <= topY + 1e-9; v += adimY) yt.push(v);
  const gun = [];
  for (let t = S.t0; t <= S.t1 + 1; t += 86400) gun.push(t);
  const kx = W < 420 ? 2 : 1;
  const grid = yt.map((v) => `${v > 0 ? `<line class="gl" x1="${GL}" x2="${GL + iw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>` : ""}<text x="${GL - 10}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">%${pctFmt(v)}</text>`).join("")
    + `<line class="axis" x1="${GL}" x2="${GL + iw}" y1="${base}" y2="${base}"/>`
    + gun.map((t, i) => `<line class="tick" x1="${x(t).toFixed(1)}" x2="${x(t).toFixed(1)}" y1="${base}" y2="${base + 5}"/>${i % kx === 0 ? `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}">${dShort(t)}</text>` : ""}`).join("");
  // gerçek limit: ilk okumadan başlar, sonrası basamak
  let real = "", realEnd = null;
  if (A.pts.length) {
    const p = A.pts;
    real = `M${x(p[0].t).toFixed(1)} ${y(p[0].pct).toFixed(1)}`;
    for (let i = 1; i < p.length; i++) real += `H${x(p[i].t).toFixed(1)}V${y(p[i].pct).toFixed(1)}`;
    real += `H${x(S.t1).toFixed(1)}`;
    realEnd = p[p.length - 1].pct;
  }
  const expPath = exp.length ? "M" + S.saat.map((t, i) => `${x(t).toFixed(1)} ${y(exp[i]).toFixed(1)}`).join("L") : "";
  const expEnd = exp.length ? exp[exp.length - 1] : null;
  let etiket = "";
  if (wide && realEnd !== null) {
    let ya = y(realEnd), yb = expEnd !== null ? y(expEnd) : null;
    if (yb !== null && Math.abs(ya - yb) < 15) { const m = (ya + yb) / 2, s = ya <= yb ? -1 : 1; ya = m + s * 8; yb = m - s * 8; }
    const ex = (GL + iw + 8).toFixed(1);
    etiket = `<text class="endl" x="${ex}" y="${(ya + 4).toFixed(1)}">Gerçek %${pctFmt(realEnd)}</text>`
      + (yb !== null ? `<text class="endl" x="${ex}" y="${(yb + 4).toFixed(1)}">Beklenen %${pctFmt(expEnd)}</text>` : "");
  }
  const aciklama = `Limit yüzdesi ve harcamadan beklenen yüzde, hafta başından şimdiye. ${A.pts.length ? `Gerçek limit şu an %${pctFmt(realEnd)}` : ""}${expEnd !== null ? `, beklenen %${pctFmt(expEnd)}` : ""}. Zamanda gezinmek için ok tuşlarını kullan.`;
  return { x, y, iw, html: `<svg viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${aciklama}">
    <text x="${GL}" y="11" text-anchor="start">Limit</text>${grid}
    ${expPath ? `<path class="ln-exp" d="${expPath}"/>` : ""}${real ? `<path class="ln-real" d="${real}"/>` : ""}${etiket}
    <line class="cross" x1="0" x2="0" y1="${GT}" y2="${base}" style="display:none"/><circle class="pt-real" r="4.5" style="display:none"/><circle class="pt-exp" r="4.5" style="display:none"/>
    <rect class="hit" x="${GL}" y="${GT}" width="${iw}" height="${ih + GB}"/></svg><div class="gtip" aria-hidden="true"></div>` };
}
function wireZaman(A, d) {
  const box = $("#lg"); if (!box) return;
  const S = zamanSeri(A, d);
  let secili = null;
  const draw = () => {
    const W = Math.max(300, Math.round(box.clientWidth) || 640), H = innerWidth <= 760 ? 240 : 300;
    const g = zamanGrafik(A, S, W, H);
    box.innerHTML = g.html;
    const svg = box.querySelector("svg"), tip = box.querySelector(".gtip");
    const cross = svg.querySelector(".cross"), pr = svg.querySelector(".pt-real"), pe = svg.querySelector(".pt-exp");
    const gizle = () => { secili = null; tip.style.display = "none"; [cross, pr, pe].forEach((e) => (e.style.display = "none")); };
    const goster = (t) => {
      t = Math.max(S.t0, Math.min(S.t1, Math.round((t - S.t0) / 3600) * 3600 + S.t0)); secili = t;
      const gv = S.gercek(t), ev = S.beklenen ? S.beklenen(t) : null, px = g.x(t);
      cross.setAttribute("x1", px.toFixed(1)); cross.setAttribute("x2", px.toFixed(1)); cross.style.display = "";
      const ys = [];
      if (gv !== null) { pr.setAttribute("cx", px.toFixed(1)); pr.setAttribute("cy", g.y(gv).toFixed(1)); pr.style.display = ""; ys.push(g.y(gv)); } else pr.style.display = "none";
      if (ev !== null) { pe.setAttribute("cx", px.toFixed(1)); pe.setAttribute("cy", g.y(ev).toFixed(1)); pe.style.display = ""; ys.push(g.y(ev)); } else pe.style.display = "none";
      const fark = gv !== null && ev !== null ? gv - ev : null;
      tip.innerHTML = `<small>${dTime(t)}</small><span>Gerçek: ${gv !== null ? "%" + pctFmt(gv) : "okuma yok"}</span>`
        + (ev !== null ? `<span>Beklenen${S.yaklasik ? " (yaklaşık)" : ""}: %${pctFmt(ev)}</span>` : "")
        + (fark !== null ? `<b>Fark: ${fark < 0 ? "−" : "+"}%${pctFmt(Math.abs(fark))}</b>` : "");
      tip.style.display = "grid";
      const r = box.clientWidth / W, yy = ys.length ? Math.min(...ys) : GT + 20;
      tip.style.left = `${Math.min(box.clientWidth - 70, Math.max(70, px * r))}px`;
      tip.style.top = `${Math.max(tip.offsetHeight + 4, yy * r - 12)}px`;
      $("#lgsr").textContent = `${dTime(t)}: gerçek limit ${gv !== null ? "%" + pctFmt(gv) : "okuma yok"}${ev !== null ? `, beklenen %${pctFmt(ev)}` : ""}${fark !== null ? `, fark ${fark < 0 ? "eksi " : "artı "}${pctFmt(Math.abs(fark))} puan` : ""}`;
    };
    const zamanOf = (e) => { const r = svg.getBoundingClientRect(), k = W / r.width; return S.t0 + (((e.clientX - r.left) * k - GL) / g.iw) * (S.t1 - S.t0); };
    svg.onpointermove = (e) => { if (e.pointerType === "mouse" || e.buttons || e.pointerType === "touch") goster(zamanOf(e)); };
    svg.onpointerdown = (e) => goster(zamanOf(e));
    svg.onpointerleave = (e) => { if (e.pointerType === "mouse") gizle(); };
    svg.onblur = gizle;
    svg.onkeydown = (e) => {
      const ad = { ArrowLeft: -3600, ArrowRight: 3600, PageUp: -86400, PageDown: 86400 }[e.key];
      if (ad !== undefined || e.key === "Home" || e.key === "End") {
        e.preventDefault();
        goster(e.key === "Home" ? S.t0 : e.key === "End" ? S.t1 : (secili === null ? S.t1 : secili) + ad);
      } else if (e.key === "Escape") gizle();
    };
    if (secili !== null) goster(secili);
  };
  draw();
  const onR = () => { if (!$("#lg")) { removeEventListener("resize", onR); return; } draw(); };

}

async function pageLimit() {
  shell("limit", `<p class="muted" role="status">Yükleniyor…</p>`, { authed: true });
  let d;
  try {
    const sp = new URLSearchParams(location.search);
    const h = sp.get("h");
    const sgl = aktifSaglayici();
    const q = new URLSearchParams();
    if (h) q.set("start", h);
    if (sgl !== "claude") q.set("saglayici", sgl);
    const qs = q.toString();
    d = await api("/api/limit-analiz" + (qs ? `?${qs}` : ""));
    if (d && d.ayar) uygulaSistemAyar(d.ayar);
  } catch (e) { if (e.message !== "giriş") showError("limit", offlineMsg(e), () => pageLimit()); return; }
  limitRender(d);

function yerelTarihSaatDegeri(tsSec) {
  const dt = new Date((tsSec || Math.floor(Date.now() / 1000)) * 1000);
  const pad = (n) => String(n).padStart(2, "0");
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:00`;
}

function ofisAyariBirlestir(ayar, sgl) {
  const o = (ayar.saglayiciAyar && ayar.saglayiciAyar[sgl]) || {};
  const ozelMod = o.haftaMod === "otomatik" || o.haftaMod === "elle" ? o.haftaMod : "varsayilan";
  return {
    haftaModOzel: ozelMod,
    haftaMod: ozelMod !== "varsayilan" ? ozelMod : (ayar.haftaMod === "elle" ? "elle" : "otomatik"),
    haftaGun: Number.isInteger(o.haftaGun) ? o.haftaGun : ayar.haftaGun,
    haftaSaat: Number.isInteger(o.haftaSaat) ? o.haftaSaat : ayar.haftaSaat,
    payModu: o.payModu || ayar.payModu || "esit",
    ozelPaylar: o.ozelPaylar || ayar.ozelPaylar || {},
    ofis: { ...(ayar.ofis || {}), ...(o.ofis || {}) },
    ofisUyeler: Array.isArray(o.uyeler) ? o.uyeler : null,
  };
}

async function pageSettings(bolum = "genel") {
  if (!OTURUM.admin) {
    if (!OTURUM.yon.size) return pageYoneticiGerekli("ayarlar");
    if (!OFISE_OZEL_BOLUM.has(bolum) || !ofisYonetebilir(aktifSaglayici())) {
      const ilk = SAGLAYICILAR.find((p) => ofisYonetebilir(p.id)).id;
      return go(urlKur(OFISE_OZEL_BOLUM.has(bolum) ? location.pathname : "/pano/ayarlar/uyeler", { sgl: ilk }));
    }
  }
  if (bolum === "kullanicilar") return pageKullanicilar();
  shell("ayarlar", `${ayarUstBolum(bolum)}<p class="muted" role="status">Yükleniyor…</p>`, { authed: true });
  const odaklaSekme = () => {
    const aktifBag = $(".ayar-nav a[aria-current=\"page\"]");
    if (aktifBag) aktifBag.scrollIntoView({ block: "nearest", inline: "nearest" });
  };

  if (bolum === "genel") {
    let paket;
    try { paket = await api("/api/yonetim/ayarlar"); }
    catch (e) { if (e.message !== "giriş") showError("ayarlar", offlineMsg(e), () => pageSettings("genel")); return; }
    const ayar = paket.ayar || {};
    uygulaSistemAyar(ayar);
    let tzListe = [...ORNEK_ZAMAN_DILIMLERI];
    try {
      if (typeof Intl.supportedValuesOf === "function") {
        const tumTz = Intl.supportedValuesOf("timeZone");
        tzListe = [...new Set([...ORNEK_ZAMAN_DILIMLERI, ...tumTz])];
      }
    } catch {}

    const genelMod = ayar.haftaMod === "elle" ? "elle" : "otomatik";
    const saHarita = ayar.saglayiciAyar || {};
    const hsPaket = paket.haftaSifirlama || {};
    const hsKaynakRozet = (hs) => {
      if (!hs) return { sinif: "pill", metin: "Varsayılan" };
      if (hs.kaynak === "otomatik_disk") return { sinif: "pill pill-ok", metin: "Otomatik · Diskten" };
      if (hs.kaynak === "otomatik_yedek") return { sinif: "pill", metin: "Otomatik · Yedek" };
      return { sinif: "pill pill-accent", metin: "Elle" };
    };
    const hsDiskMetni = (hs) => {
      if (!hs || !hs.diskVar) return "Diskte henüz 7 günlük pencere verisi yok; yedek gün ve saat devrede.";
      const saatStr = `${String(hs.diskSaat ?? 0).padStart(2, "0")}:${String(hs.diskDakika ?? 0).padStart(2, "0")}`;
      const cihazNot = hs.diskCihazEtiket ? ` · ${hs.diskCihazEtiket}` : "";
      return `Diskten okunan: ${GUN_ADLARI[hs.diskGun] || ""} ${saatStr} (${dTime(hs.diskSonraki)}${cihazNot})`;
    };
    const hsEtkinMetni = (hs) => {
      if (!hs) return "";
      const saatStr = `${String(hs.saat ?? 9).padStart(2, "0")}:00`;
      return `Etkin hafta sınırı: ${GUN_ADLARI[hs.gun] || ""} ${saatStr} · Sıradaki sıfırlama: ${dTime(hs.sonrakiReset)}`;
    };

    shell("ayarlar", `
      ${ayarUstBolum("genel")}
      <section class="card" aria-labelledby="h-genel-ayar">
        <h2 id="h-genel-ayar">Genel Görünüm ve Haftalık Sıfırlama</h2>
        <p class="card-sub">Pano başlığı üst menüde ve tarayıcı sekmesinde görünür. Haftalık sıfırlama zamanı otomatik modda hiçbir ağ isteği atılmadan yerel disk dosyalarından salt okunur biçimde alınır; dilersen genel olarak veya ofis bazında elle de sabitleyebilirsin.</p>
        <form id="f-genel" method="POST" action="/api/yonetim/ayarlar" aria-labelledby="h-genel-ayar">
          <div class="ayar-grid">
            <div class="ayar-alan">
              <label for="g-baslik">Pano başlığı</label>
              <input id="g-baslik" name="panoBaslik" type="text" maxlength="48" required value="${esc(ayar.panoBaslik || "Token Panosu")}">
              <p class="ayar-ipucu">Ekip ya da proje adını yazabilirsin (örn. Ekip Token Panosu).</p>
            </div>
            <div class="ayar-alan">
              <label for="g-tz">Saat dilimi (IANA)</label>
              <div class="satir-ici-form">
                <input id="g-tz" name="zamanDilimi" type="text" list="tz-secenekler" required autocorrect="off" autocapitalize="none" spellcheck="false" value="${esc(ayar.zamanDilimi || "Europe/Istanbul")}">
                <button type="button" class="btn btn-plain btn-sm" id="btn-yerel-tz">Tarayıcıdan al</button>
              </div>
              <datalist id="tz-secenekler">${tzListe.map((z) => `<option value="${esc(z)}"></option>`).join("")}</datalist>
              <p class="ayar-ipucu">Örn. <code>Europe/Istanbul</code>, <code>UTC</code>, <code>Europe/Berlin</code>.</p>
            </div>
          </div>

          <fieldset class="ayar-kutu-grup" aria-describedby="g-mod-ipucu">
            <legend>Haftalık sıfırlama modu</legend>
            <div class="radyo-satir">
              <span class="radyo-eleman"><input type="radio" id="g-mod-oto" name="haftaMod" value="otomatik"${genelMod === "otomatik" ? " checked" : ""}><label for="g-mod-oto">Otomatik (Diskten oku)</label></span>
              <span class="radyo-eleman"><input type="radio" id="g-mod-elle" name="haftaMod" value="elle"${genelMod === "elle" ? " checked" : ""}><label for="g-mod-elle">Elle (Manuel gün ve saat)</label></span>
            </div>
            <p class="ayar-ipucu" id="g-mod-ipucu" style="margin-top:8px">${genelMod === "otomatik"
              ? "Bağlı bilgisayarların yerel Claude, Codex ve Antigravity dosyalarındaki 7 günlük kota penceresinden her ofisin sıfırlanma zamanı otomatik okunur; henüz disk verisi olmayan ofislerde aşağıdaki yedek gün ve saat kullanılır."
              : "Tüm ofislerde (ofis bazında ayrıca özelleştirilmediyse) aşağıda seçtiğin manuel gün ve saat kullanılır."}</p>
          </fieldset>

          <div class="ayar-grid">
            <div class="ayar-alan">
              <label for="g-gun" id="g-gun-etiket">${genelMod === "otomatik" ? "Yedek sıfırlama günü" : "Manuel sıfırlama günü"}</label>
              <select id="g-gun" name="haftaGun" aria-describedby="g-gun-ipucu">${[1, 2, 3, 4, 5, 6, 0].map((g) => `<option value="${g}"${g === ayar.haftaGun ? " selected" : ""}>${GUN_ADLARI[g]}</option>`).join("")}</select>
              <p class="ayar-ipucu" id="g-gun-ipucu">${genelMod === "otomatik" ? "Diskte 7 günlük pencere verisi henüz oluşmamış ofisler için yedek başlangıç günü." : "Haftalık kullanım ve limit penceresinin başladığı gün."}</p>
            </div>
            <div class="ayar-alan">
              <label for="g-saat" id="g-saat-etiket">${genelMod === "otomatik" ? "Yedek sıfırlama saati" : "Manuel sıfırlama saati"}</label>
              <select id="g-saat" name="haftaSaat" aria-describedby="g-saat-ipucu">${saatSecenekleri(Number.isInteger(ayar.haftaSaat) ? ayar.haftaSaat : 9)}</select>
              <p class="ayar-ipucu" id="g-saat-ipucu">${genelMod === "otomatik" ? "Disk verisi bulunmayan ofislerde kullanılacak yedek başlangıç saati." : "Seçili saat diliminde haftanın ve günlük sütunların başlangıç saati."}</p>
            </div>
          </div>

          <fieldset class="ayar-kutu-grup">
            <legend>Ofis bazında haftalık sıfırlama durumu ve özelleştirme</legend>
            <div class="ayar-grid" style="margin-top:8px;margin-bottom:0">
              ${SAGLAYICILAR.map((p) => {
                const oAyar = saHarita[p.id] || {};
                const ozelMod = oAyar.haftaMod === "otomatik" || oAyar.haftaMod === "elle" ? oAyar.haftaMod : "varsayilan";
                const oGun = Number.isInteger(oAyar.haftaGun) ? oAyar.haftaGun : (Number.isInteger(ayar.haftaGun) ? ayar.haftaGun : 6);
                const oSaat = Number.isInteger(oAyar.haftaSaat) ? oAyar.haftaSaat : (Number.isInteger(ayar.haftaSaat) ? ayar.haftaSaat : 9);
                const hs = hsPaket[p.id] || null;
                const rz = hsKaynakRozet(hs);
                return `<div class="ayar-kutu-grup" style="margin:0;background:var(--surface)">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
                    <b style="display:inline-flex;align-items:center;gap:6px;font-size:14.5px">${ICON[p.id]} ${esc(p.ad)}</b>
                    <span class="${rz.sinif}" data-hs-rozet="${p.id}">${esc(rz.metin)}</span>
                  </div>
                  <p class="ayar-ipucu" data-hs-detay="${p.id}" style="margin-bottom:4px">${esc(hsDiskMetni(hs))}</p>
                  <p class="ayar-ipucu" data-hs-etkin="${p.id}" style="margin-bottom:10px;color:var(--ink-2)">${esc(hsEtkinMetni(hs))}</p>
                  <div class="ayar-alan">
                    <label for="hs-mod-${p.id}">${esc(p.ad)} sıfırlama tercihi</label>
                    <select id="hs-mod-${p.id}" name="hs_mod_${p.id}" data-hs-mod="${p.id}" aria-controls="hs-elle-${p.id}">
                      <option value="varsayilan"${ozelMod === "varsayilan" ? " selected" : ""}>Genel ayarı izle</option>
                      <option value="otomatik"${ozelMod === "otomatik" ? " selected" : ""}>Her zaman otomatik (diskten)</option>
                      <option value="elle"${ozelMod === "elle" ? " selected" : ""}>Elle özelleştir (gün ve saat seç)</option>
                    </select>
                  </div>
                  <div id="hs-elle-${p.id}" class="karakter-alanlar" style="margin-top:8px"${ozelMod === "elle" ? "" : " hidden"}>
                    <div class="ayar-alan">
                      <label for="hs-gun-${p.id}">${esc(p.ad)} günü</label>
                      <select id="hs-gun-${p.id}" name="hs_gun_${p.id}">${[1, 2, 3, 4, 5, 6, 0].map((g) => `<option value="${g}"${g === oGun ? " selected" : ""}>${GUN_ADLARI[g]}</option>`).join("")}</select>
                    </div>
                    <div class="ayar-alan">
                      <label for="hs-saat-${p.id}">${esc(p.ad)} saati</label>
                      <select id="hs-saat-${p.id}" name="hs_saat_${p.id}">${saatSecenekleri(oSaat)}</select>
                    </div>
                  </div>
                </div>`;
              }).join("")}
            </div>
          </fieldset>

          <div class="durum-satir">
            <button type="submit" class="btn btn-ink">Genel ayarları kaydet</button>
            <span class="kayit-durum" id="genel-durum" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>
      <section class="card" id="sistem-guncelleme-kutu" aria-labelledby="h-sis-guncelle">
        <div class="card-head">
          <h2 id="h-sis-guncelle">Açık Kaynak Sürüm ve Güncelleme</h2>
          <span class="pill" id="sis-surum-rozet">Kontrol ediliyor…</span>
        </div>
        <p class="card-sub" id="sis-surum-detay" style="margin-bottom:10px">GitHub üzerindeki son yayınlanan sürüm kontrol ediliyor…</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
          <button type="button" class="btn btn-plain btn-sm" id="btn-sis-guncelle">Şimdi kontrol et</button>
          <a class="btn btn-ink btn-sm" id="sis-indir-link" href="${GITHUB_URL}/releases" target="_blank" rel="noopener noreferrer" hidden>GitHub sürümünü görüntüle →</a>
        </div>
      </section>
      <section class="card" aria-labelledby="h-erisim-bilgi">
        <h2 id="h-erisim-bilgi">Erişim ve hesaplar</h2>
        <p class="card-sub" style="margin-bottom:12px">Girişler kullanıcı adı ve şifreyle yapılıyor. Yeni üye eklediğinde tek kullanımlık şifre oluşturma bağlantısı üretilir; kimin hangi ofisi görüp yönetebileceğini Kullanıcılar sayfasından ayarlayabilirsin.</p>
        <a class="btn btn-ink btn-sm" href="/pano/ayarlar/kullanicilar" data-link>Kullanıcılar →</a>
      </section>
      <div class="danger-zone">
        <h2>Tüm ayarları varsayılana döndür</h2>
        <p>Pano başlığı, saat dilimi, özel kota ağırlıkları, özel model fiyatları ve ofis özelleştirmeleri fabrika varsayılanlarına sıfırlanır. Bağlı bilgisayarlar ve geçmiş kullanım verileri silinmez.</p>
        <button type="button" class="btn btn-danger" id="btn-varsayilan">Varsayılan ayarlara dön</button>
      </div>`, { authed: true });
    odaklaSekme();
    const sistemSurumKontrolEt = async (zorla = false) => {
      const rz = $("#sis-surum-rozet"), dt = $("#sis-surum-detay"), lnk = $("#sis-indir-link"), btn = $("#btn-sis-guncelle");
      if (!rz || !dt) return;
      if (btn) btn.disabled = true;
      try {
        const r = await api(zorla ? "/api/sistem-guncelleme?zorla=1" : "/api/sistem-guncelleme");
        if (!$("#sis-surum-rozet")) return;
        const mSurum = Number(r && r.mevcut_surum) || 40;
        const sSurum = Number(r && r.son_surum) || mSurum;
        const guvenliUrl = r && typeof r.indir_url === "string" && r.indir_url.startsWith("https://") ? r.indir_url : `${GITHUB_URL}/releases`;
        if (r && r.guncel === false && sSurum > mSurum) {
          rz.className = "pill pill-accent";
          rz.textContent = `Yeni sürüm: v${sSurum}`;
          dt.textContent = `Çalışan sunucu sürümü v${mSurum}; GitHub üzerinde v${sSurum} yayınlandı.`;
          if (lnk) { lnk.href = guvenliUrl; lnk.hidden = false; }
        } else {
          rz.className = "pill pill-ok";
          rz.textContent = `v${mSurum} · Güncel`;
          dt.textContent = `Çalışan sunucu ve istemci altyapısı güncel (v${mSurum}).`;
          if (lnk) { lnk.href = guvenliUrl; lnk.hidden = true; }
        }
      } catch {
        if ($("#sis-surum-rozet")) {
          rz.className = "pill";
          rz.textContent = "v40";
          dt.textContent = "GitHub sürüm bilgisi şu an sorgulanamadı.";
        }
      }
      if (btn) btn.disabled = false;
    };
    if ($("#btn-sis-guncelle")) $("#btn-sis-guncelle").onclick = () => sistemSurumKontrolEt(true);
    sistemSurumKontrolEt(false);
    $("#btn-yerel-tz").onclick = () => {
      try {
        const z = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (z) $("#g-tz").value = z;
      } catch {}
    };
    const genelModEtiketGuncelle = () => {
      const secili = ($("input[name=haftaMod]:checked", $("#f-genel")) || {}).value !== "elle" ? "otomatik" : "elle";
      const oto = secili === "otomatik";
      $("#g-mod-ipucu").textContent = oto
        ? "Bağlı bilgisayarların yerel Claude, Codex ve Antigravity dosyalarındaki 7 günlük kota penceresinden her ofisin sıfırlanma zamanı otomatik okunur; henüz disk verisi olmayan ofislerde aşağıdaki yedek gün ve saat kullanılır."
        : "Tüm ofislerde (ofis bazında ayrıca özelleştirilmediyse) aşağıda seçtiğin manuel gün ve saat kullanılır.";
      $("#g-gun-etiket").textContent = oto ? "Yedek sıfırlama günü" : "Manuel sıfırlama günü";
      $("#g-gun-ipucu").textContent = oto
        ? "Diskte 7 günlük pencere verisi henüz oluşmamış ofisler için yedek başlangıç günü."
        : "Haftalık kullanım ve limit penceresinin başladığı gün.";
      $("#g-saat-etiket").textContent = oto ? "Yedek sıfırlama saati" : "Manuel sıfırlama saati";
      $("#g-saat-ipucu").textContent = oto
        ? "Disk verisi bulunmayan ofislerde kullanılacak yedek başlangıç saati."
        : "Seçili saat diliminde haftanın ve günlük sütunların başlangıç saati.";
    };
    document.querySelectorAll("#f-genel input[name=haftaMod]").forEach((r) => { r.onchange = genelModEtiketGuncelle; });
    document.querySelectorAll("#f-genel [data-hs-mod]").forEach((sel) => {
      sel.onchange = () => {
        const kutu = $(`#hs-elle-${sel.dataset.hsMod}`);
        if (kutu) kutu.hidden = sel.value !== "elle";
      };
    });
    const hsKartlariGuncelle = (yeniHs) => {
      if (!yeniHs) return;
      for (const p of SAGLAYICILAR) {
        const hs = yeniHs[p.id];
        if (!hs) continue;
        const rz = hsKaynakRozet(hs);
        const rozetEl = $(`[data-hs-rozet="${p.id}"]`);
        if (rozetEl) { rozetEl.className = rz.sinif; rozetEl.textContent = rz.metin; }
        const detayEl = $(`[data-hs-detay="${p.id}"]`);
        if (detayEl) detayEl.textContent = hsDiskMetni(hs);
        const etkinEl = $(`[data-hs-etkin="${p.id}"]`);
        if (etkinEl) etkinEl.textContent = hsEtkinMetni(hs);
      }
    };
    $("#f-genel").onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.submitter || $("#f-genel button[type=submit]"), dr = $("#genel-durum");
      const tz = $("#g-tz").value.trim();
      try { new Intl.DateTimeFormat("tr-TR", { timeZone: tz }).format(new Date(0)); }
      catch { durumYaz(dr, "Geçersiz IANA saat dilimi (örn. Europe/Istanbul yazın).", true); $("#g-tz").focus(); return; }
      const haftaMod = ($("input[name=haftaMod]:checked", $("#f-genel")) || {}).value === "elle" ? "elle" : "otomatik";
      const saglayiciAyar = {};
      for (const p of SAGLAYICILAR) {
        const mSel = $(`#hs-mod-${p.id}`);
        if (!mSel) continue;
        const mDeger = mSel.value;
        saglayiciAyar[p.id] = mDeger === "elle"
          ? {
              haftaMod: "elle",
              haftaGun: Number($(`#hs-gun-${p.id}`).value),
              haftaSaat: Number($(`#hs-saat-${p.id}`).value),
            }
          : {
              haftaMod: mDeger === "otomatik" ? "otomatik" : "varsayilan",
              haftaGun: null,
              haftaSaat: null,
            };
      }
      btn.disabled = true; durumYaz(dr, "Kaydediliyor…");
      try {
        const res = await api("/api/yonetim/ayarlar", {
          method: "POST",
          body: JSON.stringify({
            panoBaslik: $("#g-baslik").value.trim(),
            zamanDilimi: tz,
            haftaMod,
            haftaGun: Number($("#g-gun").value),
            haftaSaat: Number($("#g-saat").value),
            saglayiciAyar,
          }),
        });
        uygulaSistemAyar(res.ayar);
        hsKartlariGuncelle(res.haftaSifirlama);
        OFIS.anahtar = "";
        const brandSpan = $(".brand span");
        if (brandSpan) brandSpan.textContent = PANO_BASLIK;
        document.title = `Ayarlar · ${PANO_BASLIK}`;
        durumYaz(dr, "Kaydedildi.");
      } catch (er) { durumYaz(dr, er.message, true); }
      btn.disabled = false;
    };
    $("#btn-varsayilan").onclick = () => {
      const dlg = document.createElement("dialog");
      dlg.setAttribute("aria-labelledby", "vd-baslik");
      dlg.innerHTML = `<h2 id="vd-baslik">Ayarlar varsayılana döndürülsün mü?</h2>
        <p>Tüm özelleştirilmiş pano, kota payı, özel fiyat ve ofis ayarları ilk kurulum değerlerine sıfırlanacak. Kullanım kayıtlarına ve bilgisayarlara dokunulmaz.</p>
        <p class="err" id="vd-hata" role="alert"></p>
        <div class="actions"><button type="button" class="btn btn-plain" id="vd-iptal" autofocus>Vazgeç</button><button type="button" class="btn btn-solid-danger" id="vd-onay">Varsayılana döndür</button></div>`;
      document.body.appendChild(dlg);
      dlg.addEventListener("close", () => dlg.remove());
      $("#vd-iptal", dlg).onclick = () => dlg.close();
      $("#vd-onay", dlg).onclick = async (ev) => {
        ev.target.disabled = true;
        try {
          const res = await api("/api/yonetim/ayarlar", { method: "POST", body: JSON.stringify({ varsayilanaDon: true }) });
          uygulaSistemAyar(res.ayar);
          OFIS.anahtar = "";
          dlg.close();
          pageSettings("genel");
        } catch (er) { $("#vd-hata", dlg).textContent = er.message; ev.target.disabled = false; }
      };
      dlg.showModal();
    };
    return;
  }

  if (bolum === "uyeler") {
    let d, paket;
    try { [d, paket] = await Promise.all([loadWeek(), api("/api/yonetim/ayarlar")]); }
    catch (e) { if (e.message !== "giriş") showError("ayarlar", offlineMsg(e), () => pageSettings("uyeler")); return; }
    const ayar = paket.ayar || {};
    uygulaSistemAyar(ayar);
    const sglU = d.saglayici || aktifSaglayici();
    const temaU = ofisTema(sglU);
    const eff = ofisAyariBirlestir(ayar, sglU);
    const uyeler = d.uyeler || [];
    const cihazSayi = new Map();
    for (const dv of d.devices) if (dv.uye_id) cihazSayi.set(dv.uye_id, (cihazSayi.get(dv.uye_id) || 0) + 1);
    const tumGruplar = gruplar(d, new Map(), { tumu: true });
    const groups = gruplar(d, new Map());
    const ofisteki = new Set(groups.map((g) => g.id));
    const kullananlar = ofisKullananlar(d);
    const esitPay = groups.length ? Math.round((100 / groups.length) * 10) / 10 : 100;
    const gorunumler = { ...((ayar.ofis && ayar.ofis.gorunumler) || {}) };
    const ofisUyeKarti = `<section class="card" aria-labelledby="h-ofis-uyeler">
        <h2 id="h-ofis-uyeler">${esc(temaU.ad)} Üyeleri</h2>
        <p class="card-sub">Her ofisin kendi kadrosu vardır. Burada seçilen kişiler yalnızca ${esc(temaU.ad)} içinde masa sahibi olur ve bu ofisin kota paylaşımına katılır; diğer ofisleri etkilemez.</p>

              <th scope="row"><span class="model-etiket">${esc(m)}</span></th>
              <td>$${pctFmt(b[0])}</td>
              <td>$${pctFmt(b[1])}</td>
              <td>$${pctFmt(b[2])} / $${pctFmt(b[3])}</td>
              <td>$${pctFmt(b[4])}</td>
              <td>
                <div class="satir-ici-form" style="justify-content:flex-end">
                  <button type="button" class="btn btn-plain btn-sm" data-fiyat-doldur="${esc(m)}">Düzenle</button>
                  <button type="button" class="btn btn-danger btn-sm" data-fiyat-sil="${esc(m)}">Kaldır</button>
                </div>
              </td>
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>` : ""}

      <h3 id="h-tum-fiyatlar" style="margin:0 0 10px;font-size:15px">Etkin Tüm Model Fiyatları ($ / 1M Token)</h3>
      <search class="fiyat-arama" aria-label="Model fiyat tablosunda ara ve filtrele">
        <label for="fy-ara" class="visually-hidden">Model ara</label>
        <input id="fy-ara" type="search" placeholder="Model ara… (örn. opus-5-5, gpt-6.1, gemini-4, codex)" autocomplete="off" spellcheck="false">
        <div class="gr-modes" role="group" aria-label="Sağlayıcı filtresi">
          <button type="button" data-fy-filtre="tumu" aria-pressed="true">Tümü (${tumModeller.length})</button>
          <button type="button" data-fy-filtre="claude" aria-pressed="false">Claude (${sglSayi.claude})</button>
          <button type="button" data-fy-filtre="chatgpt" aria-pressed="false">ChatGPT (${sglSayi.chatgpt})</button>
          <button type="button" data-fy-filtre="gemini" aria-pressed="false">Gemini (${sglSayi.gemini})</button>
        </div>
      </search>
      <div class="table-wrap fiyat-kaydir" tabindex="0" role="region" aria-labelledby="h-tum-fiyatlar" style="max-block-size:400px;overflow-y:auto">
        <table>
          <thead><tr><th scope="col">Model</th><th scope="col">Ofis</th><th scope="col">Girdi</th><th scope="col">Çıktı</th><th scope="col">Cache yazma (5dk/1sa)</th><th scope="col">Cache okuma</th><th scope="col">Uzun bağlam (@uzun)</th><th scope="col">İşlem</th></tr></thead>
          <tbody id="fy-tablo-govde">${tumModeller.map((m) => {
            const k = etkinListe[m] || {};
            const b = k.b || [0, 0, 0, 0, 0];
            const sgl = fiyatSglOf(m);
            const sb = saglayiciBilgi(sgl);
            const ozelMi = Object.hasOwn(ozelFiyatlar, m);
            return `<tr data-fy-satir="${esc(m)}" data-fy-sgl="${esc(sgl)}">
              <th scope="row"><span class="model-etiket">${esc(m)}</span>${ozelMi ? ` <span class="pill pill-accent">özel</span>` : ""}</th>
              <td><span class="pill">${ICON[sb.id]}<span>${esc(sb.ad)}</span></span></td>
              <td>$${pctFmt(b[0])}</td>
              <td>$${pctFmt(b[1])}</td>
              <td>$${pctFmt(b[2])} / $${pctFmt(b[3])}</td>
              <td>$${pctFmt(b[4])}</td>
              <td>${esc(uzunEtiket(k.u))}</td>
              <td><button type="button" class="btn btn-plain btn-sm" data-fiyat-doldur="${esc(m)}">Özelleştir</button></td>
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>
    </section>

    <section class="card" aria-labelledby="h-disa-aktar">
      <h2 id="h-disa-aktar">Verileri Dışa Aktar (CSV / JSON)</h2>
      <p class="card-sub">İndirilen dosyalarda hiçbir gizli anahtar, parola veya ham oturum kimliği yer almaz; e-tabloda incelemek veya yedek almak için güvenle kullanabilirsin.</p>
      <div class="disa-aktar-grid">
        <div class="disa-kart">
          <div><b>Bu Hafta · CSV</b><p>Excel, Google E-Tablolar ve Numbers ile doğrudan açılan UTF-8 saatlik kullanım tablosu.</p></div>
          <a class="btn btn-plain btn-sm" href="/api/yonetim/disa-aktar?bicim=csv&amp;kapsam=hafta${haftaParam}" download>CSV indir (Bu hafta)</a>
        </div>
        <div class="disa-kart">
          <div><b>Tüm Zamanlar · CSV</b><p>Veritabanındaki tüm saatlik kullanım geçmişi (en fazla 50.000 satır).</p></div>
          <a class="btn btn-plain btn-sm" href="/api/yonetim/disa-aktar?bicim=csv&amp;kapsam=tumu" download>CSV indir (Tümü)</a>
        </div>
        <div class="disa-kart">
          <div><b>Bu Hafta · JSON</b><p>Sistem ayarları, üye listesi, bilgisayarlar ve seçili haftanın saatlik verileri.</p></div>
          <a class="btn btn-plain btn-sm" href="/api/yonetim/disa-aktar?bicim=json&amp;kapsam=hafta${haftaParam}" download>JSON indir (Bu hafta)</a>
        </div>
        <div class="disa-kart">
          <div><b>Tüm Zamanlar · JSON</b><p>Ayarlar, üyeler, cihaz meta verileri ve tüm kullanım geçmişini içeren tam arşiv.</p></div>
          <a class="btn btn-plain btn-sm" href="/api/yonetim/disa-aktar?bicim=json&amp;kapsam=tumu" download>JSON indir (Tam yedek)</a>
        </div>
      </div>
    </section>`, { authed: true });
  odaklaSekme();

  $("#btn-fiyat-yenile").onclick = async (e) => {
    const dr = $("#fy-yenile-durum");
    e.target.disabled = true; durumYaz(dr, "Güncelleniyor…");
    try {
      const r = await api("/api/yonetim/fiyatlar/yenile", { method: "POST" });
      if (r.tamam === false) { durumYaz(dr, r.hata || "Güncellenemedi.", true); e.target.disabled = false; return; }
      pageSettings("fiyatlar");
    } catch (er) { durumYaz(dr, er.message, true); e.target.disabled = false; }
  };
  const modeliFormaDoldur = (m) => {
    const kayit = ozelFiyatlar[m] || etkinListe[m]?.b || kullanilanHarita.get(m)?.b;
    $("#of-model").value = m;
    if (Array.isArray(kayit) && kayit.length === 5) {
      $("#of-f0").value = kayit[0];
      $("#of-f1").value = kayit[1];
      $("#of-f2").value = kayit[2];
      $("#of-f3").value = kayit[3];
      $("#of-f4").value = kayit[4];
    }
    $("#of-model").focus();
  };
  let aktifFyFiltre = "tumu";
  const fyFiltreUygula = () => {
    const q = ($("#fy-ara")?.value || "").trim().toLowerCase();
    document.querySelectorAll("#fy-tablo-govde tr[data-fy-satir]").forEach((tr) => {
      const m = tr.dataset.fySatir || "";
      const sgl = tr.dataset.fySgl || "";
      const goster = (aktifFyFiltre === "tumu" || sgl === aktifFyFiltre) && (!q || m.includes(q));
      tr.hidden = !goster;
    });
  };
  $("#fy-ara")?.addEventListener("input", fyFiltreUygula);
  document.querySelectorAll("[data-fy-filtre]").forEach((btn) => {
    btn.addEventListener("click", () => {
      aktifFyFiltre = btn.dataset.fyFiltre;
      document.querySelectorAll("[data-fy-filtre]").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      fyFiltreUygula();
    });
  });
  $("#of-model").addEventListener("change", () => {
    const m = $("#of-model").value.trim().toLowerCase();
    if (ozelFiyatlar[m] || etkinListe[m]) modeliFormaDoldur(m);
  });
  document.querySelectorAll("[data-fiyat-doldur]").forEach((b) => {
    b.onclick = () => modeliFormaDoldur(b.dataset.fiyatDoldur);
  });
  document.querySelectorAll("[data-fiyat-sil]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      const yeni = { ...ozelFiyatlar };
      delete yeni[b.dataset.fiyatSil];
      try { await api("/api/yonetim/ayarlar", { method: "POST", body: JSON.stringify({ ozelFiyatlar: yeni }) }); sonSaglayiciOzeti = null; pageSettings("fiyatlar"); }
      catch (er) { durumYaz($("#of-fiyat-durum"), er.message, true); b.disabled = false; }
    };
  });
  $("#f-ozel-fiyat").onsubmit = async (e) => {
    e.preventDefault();
    const dr = $("#of-fiyat-durum"), btn = e.submitter || $("#f-ozel-fiyat button[type=submit]");
    const m = $("#of-model").value.trim().toLowerCase();
    if (!/^[a-z0-9][a-z0-9.\-_]{0,63}$/.test(m)) { durumYaz(dr, "Model adı yalnızca küçük harf, rakam, nokta, tire ve alt çizgi içerebilir.", true); return; }
    const b = [$("#of-f0"), $("#of-f1"), $("#of-f2"), $("#of-f3"), $("#of-f4")].map((el) => Number(String(el.value).replace(",", ".")));
    if (!b.every((v) => Number.isFinite(v) && v >= 0 && v <= 10000)) { durumYaz(dr, "Fiyat alanları 0 ile 10.000 arasında sayı olmalı.", true); return; }
    const yeni = { ...ozelFiyatlar, [m]: b };
    btn.disabled = true; durumYaz(dr, "Kaydediliyor…");
    try { await api("/api/yonetim/ayarlar", { method: "POST", body: JSON.stringify({ ozelFiyatlar: yeni }) }); sonSaglayiciOzeti = null; pageSettings("fiyatlar"); }
    catch (er) { durumYaz(dr, er.message, true); btn.disabled = false; }
  };
}

// ---------------- yönlendirme ----------------
let refresh = null;
async function route() {
  clearInterval(refresh);
  OFIS.yenidenCiz = null;
  const p = location.pathname;
  if (p === "/") return pageLanding();
  if (p === "/kurulum") return pagePairInstall();
  if (p === "/giris") return pageLogin();
  if (p === "/sifre") return pageSifreBelirle();
  if (!(await isAuthed())) return go("/giris");
  if (p === "/pano/hesabim") return pageHesabim();
  const sgl = aktifSaglayici();
  const aktifSayfa = p === "/pano" ? "hafta" : p.startsWith("/pano/ayarlar") ? "ayarlar" : p === "/pano/limit" ? "limit" : "hafta";
  if (!OTURUM.admin && !OTURUM.gor.size && !p.startsWith("/pano/ayarlar")) return go("/pano/hesabim");
  if (!ofisIzinli(sgl) && !p.startsWith("/pano/ayarlar")) return pageOfisKapisi(sgl, aktifSayfa);
  if (!OTURUM.admin && p === "/pano/bilgisayarlar") return pageYoneticiGerekli("bilgisayarlar");
  if (p === "/pano") { await pageWeek(); refresh = setInterval(() => { if (!document.hidden && location.pathname === "/pano" && !document.activeElement?.matches("input, a, button")) pageWeek(true); }, 60000); return; }
  if (p === "/pano/bilgisayarlar") return pageDevices();
  if (p === "/pano/limit") return pageLimit();
  if (p === "/pano/ayarlar") return pageSettings("genel");
  const ma = p.match(/^\/pano\/ayarlar\/(uyeler|limit|ofis|fiyatlar|kullanicilar)$/);
  if (ma) return pageSettings(ma[1]);
  const m = p.match(/^\/pano\/bilgisayar\/([a-f0-9]{32})$/);
  if (m) return pageDevice(m[1]);
  go("/");
}
route();
</script>

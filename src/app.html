<!doctype html>
<html lang="tr" data-saglayici="claude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#090c11">
<script>
try {
  const t = localStorage.getItem("tp_tema");
  const m = t === "light" || t === "dark" ? t : "light dark";
  document.querySelector('meta[name="color-scheme"]').content = m;
  const koyu = m === "dark" || (m === "light dark" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = koyu ? "#090c11" : "#f4f6fa";
} catch {}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cpath d='M3 15 13 9.5 23 15 13 20.5Z' fill='%23c8915c'/%3E%3Cpath d='M3 15v2.4L13 23v-2.5Z' fill='%238a5a30'/%3E%3Cpath d='M23 15v2.4L13 23v-2.5Z' fill='%23a8713f'/%3E%3Cpath d='M10 6.2 16.5 2.6v6.2L10 12.4Z' fill='%2367c1e3'/%3E%3C/svg%3E">
<title>Token Panosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --ground-l: #f4f6fa;
  --ground-d: #090c11;
  --surface-l: #ffffff;
  --surface-d: #11161f;
  --surface-2-l: #edf1f7;
  --surface-2-d: #171e2a;
  --surface-3-l: #e2e8f2;
  --surface-3-d: #202938;
  --ink-l: #0e1624;
  --ink-d: #f2f5f9;
  --ink-2-l: #334155;
  --ink-2-d: #c1cad8;
  --ink-3-l: #566579;
  --ink-3-d: #8c98ac;
  --line-l: #dbe2ec;
  --line-d: #242e3e;
  --line-strong-l: #8494aa;
  --line-strong-d: #3f4f66;
  --shell-l: rgba(255, 255, 255, .86);
  --shell-d: rgba(11, 15, 22, .84);
  --accent-l: #b86228;
  --accent-d: #de9658;
  --accent-top-l: #9a4e19;
  --accent-top-d: #ebb27e;
  --accent-side-l: #854113;
  --accent-side-d: #ad6d37;
  --accent-soft-l: rgba(184, 98, 40, .11);
  --accent-soft-d: rgba(222, 150, 88, .15);
  --warn-l: #a86408;
  --warn-d: #e5ac4c;
  --danger-l: #c83228;
  --danger-d: #f2796e;
  --ok-l: #127a4d;
  --ok-d: #4ac98b;
  --focus-l: #1f66d1;
  --focus-d: #7fc3f0;
  --shadow-card: 0 1px 2px rgba(15, 23, 36, .04), 0 8px 24px -12px rgba(15, 23, 36, .08);

  --ground: var(--ground-l);
  --surface: var(--surface-l);
  --surface-2: var(--surface-2-l);
  --surface-3: var(--surface-3-l);
  --ink: var(--ink-l);
  --ink-2: var(--ink-2-l);
  --ink-3: var(--ink-3-l);
  --line: var(--line-l);
  --line-strong: var(--line-strong-l);
  --shell: var(--shell-l);
  --accent: var(--accent-l);
  --accent-top: var(--accent-top-l);
  --accent-side: var(--accent-side-l);
  --accent-soft: var(--accent-soft-l);
  --warn: var(--warn-l);
  --danger: var(--danger-l);
  --ok: var(--ok-l);
  --focus: var(--focus-l);

  @media (prefers-color-scheme: dark) {
    --ground: var(--ground-d);
    --surface: var(--surface-d);
    --surface-2: var(--surface-2-d);
    --surface-3: var(--surface-3-d);
    --ink: var(--ink-d);
    --ink-2: var(--ink-2-d);
    --ink-3: var(--ink-3-d);
    --line: var(--line-d);
    --line-strong: var(--line-strong-d);
    --shell: var(--shell-d);
    --accent: var(--accent-d);
    --accent-top: var(--accent-top-d);
    --accent-side: var(--accent-side-d);
    --accent-soft: var(--accent-soft-d);
    --warn: var(--warn-d);
    --danger: var(--danger-d);
    --ok: var(--ok-d);
    --focus: var(--focus-d);
    --shadow-card: 0 12px 32px -16px rgba(0, 0, 0, .55);
  }

  &:has(> head > meta[name="color-scheme"][content="dark"]) {
    color-scheme: dark;
    --ground: var(--ground-d);
    --surface: var(--surface-d);
    --surface-2: var(--surface-2-d);
    --surface-3: var(--surface-3-d);
    --ink: var(--ink-d);
    --ink-2: var(--ink-2-d);
    --ink-3: var(--ink-3-d);
    --line: var(--line-d);
    --line-strong: var(--line-strong-d);
    --shell: var(--shell-d);
    --accent: var(--accent-d);
    --accent-top: var(--accent-top-d);
    --accent-side: var(--accent-side-d);
    --accent-soft: var(--accent-soft-d);
    --warn: var(--warn-d);
    --danger: var(--danger-d);
    --ok: var(--ok-d);
    --focus: var(--focus-d);
    --shadow-card: 0 12px 32px -16px rgba(0, 0, 0, .55);
  }

  &:has(> head > meta[name="color-scheme"][content="light"]) {
    color-scheme: light;
    --ground: var(--ground-l);
    --surface: var(--surface-l);
    --surface-2: var(--surface-2-l);
    --surface-3: var(--surface-3-l);
    --ink: var(--ink-l);
    --ink-2: var(--ink-2-l);
    --ink-3: var(--ink-3-l);
    --line: var(--line-l);
    --line-strong: var(--line-strong-l);
    --shell: var(--shell-l);
    --accent: var(--accent-l);
    --accent-top: var(--accent-top-l);
    --accent-side: var(--accent-side-l);
    --accent-soft: var(--accent-soft-l);
    --warn: var(--warn-l);
    --danger: var(--danger-l);
    --ok: var(--ok-l);
    --focus: var(--focus-l);
    --shadow-card: 0 1px 2px rgba(15, 23, 36, .04), 0 10px 26px -14px rgba(15, 23, 36, .1);
  }

  &[data-saglayici="chatgpt"] {
    --accent-l: #0d8566;
    --accent-d: #19c394;
    --accent-top-l: #086950;
    --accent-top-d: #54dfb7;
    --accent-side-l: #065742;
    --accent-side-d: #109671;
    --accent-soft-l: rgba(13, 133, 102, .11);
    --accent-soft-d: rgba(25, 195, 148, .15);
  }

  &[data-saglayici="gemini"] {
    --accent-l: #2563eb;
    --accent-d: #6ea3ff;
    --accent-top-l: #1d4ed8;
    --accent-top-d: #9bc0ff;
    --accent-side-l: #1e40af;
    --accent-side-d: #467ee3;
    --accent-soft-l: rgba(37, 99, 235, .11);
    --accent-soft-d: rgba(110, 163, 255, .15);
  }

  @supports (color: light-dark(white, black)) {
    --ground: light-dark(var(--ground-l), var(--ground-d));
    --surface: light-dark(var(--surface-l), var(--surface-d));
    --surface-2: light-dark(var(--surface-2-l), var(--surface-2-d));
    --surface-3: light-dark(var(--surface-3-l), var(--surface-3-d));
    --ink: light-dark(var(--ink-l), var(--ink-d));
    --ink-2: light-dark(var(--ink-2-l), var(--ink-2-d));
    --ink-3: light-dark(var(--ink-3-l), var(--ink-3-d));
    --line: light-dark(var(--line-l), var(--line-d));
    --line-strong: light-dark(var(--line-strong-l), var(--line-strong-d));
    --shell: light-dark(var(--shell-l), var(--shell-d));
    --accent: light-dark(var(--accent-l), var(--accent-d));
    --accent-top: light-dark(var(--accent-top-l), var(--accent-top-d));
    --accent-side: light-dark(var(--accent-side-l), var(--accent-side-d));
    --accent-soft: light-dark(var(--accent-soft-l), var(--accent-soft-d));
    --warn: light-dark(var(--warn-l), var(--warn-d));
    --danger: light-dark(var(--danger-l), var(--danger-d));
    --ok: light-dark(var(--ok-l), var(--ok-d));
    --focus: light-dark(var(--focus-l), var(--focus-d));
  }

  --shell-ink: var(--ink);
  --shell-ink-2: var(--ink-2);
  --oak: var(--accent);
  --oak-top: var(--accent-top);
  --oak-side: var(--accent-side);
  --floor-a: #1f292b;
  --floor-b: #1a2325;
  --screen-on: #5bc4ec;
  --screen-off: #0b1011;
  --mon: #3b4447;
  --plant: var(--ok);
  --plant-2: var(--ok);
  --wall-a: #2a3739;
  --wall-b: #243133;
  --chair: #46565a;
  --chair-side: #394649;
  --chair-top: #56686c;
  --r: 12px;
  --r-sm: 8px;
  accent-color: var(--accent);
  scrollbar-width: thin;
  scrollbar-color: var(--ink-3) var(--ground);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 15.5px/1.55 Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
h1:focus { outline: none; }
.visually-hidden:where(:not(:focus-within, :active)) {
  position: absolute !important;
  clip-path: inset(50%) !important;
  overflow: hidden !important;
  width: 1px !important;
  height: 1px !important;
  margin: -1px !important;
  padding: 0 !important;
  border: 0 !important;
  white-space: nowrap !important;
}
.skip { position: fixed; left: 14px; top: -72px; z-index: 60; background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: var(--r-sm); font-weight: 700; text-decoration: none; box-shadow: var(--shadow-card); }
.skip:focus { top: 10px; }
::selection { background: var(--accent-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
a { color: inherit; text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: max(24px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-right, 0px)); }

/* Üst menü & Sağlayıcı seçici */
.bar {
  position: sticky; top: 0; z-index: 30;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--shell);
  color: var(--shell-ink);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-block-end: 1px solid var(--line);
}
.bar-row {
  display: flex; align-items: center; gap: 18px; min-block-size: 62px; padding-block: 8px;
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 16.5px; letter-spacing: -0.015em;
  text-decoration: none; white-space: nowrap; flex-shrink: 0;
}
.brand svg { width: 26px; height: 26px; flex-shrink: 0; }
.brand-badge {
  font-size: 11px; font-weight: 700; color: var(--ink-3);
  background: var(--surface-2); border: 1px solid var(--line);
  padding: 2px 7px; border-radius: 999px; letter-spacing: 0;
}

/* Sağlayıcı sekme şeridi (Claude · ChatGPT · Gemini) */
.sgl-nav {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px; border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  overflow-x: auto; white-space: nowrap; flex-shrink: 0;
  scrollbar-width: none;
}
.sgl-nav::-webkit-scrollbar { display: none; }
.sgl-link {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px; border-radius: 8px; min-block-size: 34px;
  text-decoration: none; font-size: 13.5px; font-weight: 600;
  color: var(--ink-2); flex: none;
  transition: background-color .15s, color .15s;
}
.sgl-link svg { width: 15px; height: 15px; flex-shrink: 0; }
.sgl-link:hover { color: var(--ink); background: var(--surface-3); }
.sgl-link[aria-current="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .14);
}
.sgl-link[aria-current="true"]::after {
  content: "";
  position: absolute;
  inset-inline: 10px;
  inset-block-end: 2px;
  border-block-end: 2.5px solid var(--accent);
}
.sgl-tutar {
  font-size: 11.5px; font-weight: 700; color: var(--ink-3);
  padding: 1px 6px; border-radius: 999px;
  background: var(--surface-3);
}
.sgl-link[aria-current="true"] .sgl-tutar {
  color: var(--accent-top);
  background: var(--accent-soft);
}
.sgl-link.kilitli { color: var(--ink-3); }
.hesap-btn { display: inline-flex; align-items: center; gap: 6px; }
.hesap-btn svg { width: 15px; height: 15px; }
.giris-alt { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: 13.5px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--ink-3); text-decoration: underline; font: inherit; cursor: pointer; }
.link-btn:hover { color: var(--ink); }
.satir-ici-form .sifre-goster { flex: none; }
.rol-pill { font-size: 11.5px; }
.kullanici-tablo td, .kullanici-tablo th { vertical-align: top; }
.kullanici-tablo .ofis-rolleri { display: flex; flex-wrap: wrap; gap: 4px; }
.link-kutu { margin-top: 10px; }
.sgl-kilit { display: inline-flex; color: var(--ink-3); }
.sgl-kilit svg { width: 13px; height: 13px; }

/* Şifreli ofis giriş ekranı */
.ofis-kapi {
  max-width: 460px; margin: 28px auto 0; text-align: center;
  border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
  padding: 30px 26px 24px; box-shadow: var(--shadow-card);
}
.ofis-kapi .kapi-ikon {
  inline-size: 56px; block-size: 56px; margin: 0 auto 14px; border-radius: 16px;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-top);
}
.ofis-kapi .kapi-ikon svg { width: 28px; height: 28px; }
.ofis-kapi h1 { font-size: 22px; margin: 0 0 6px; }
.ofis-kapi form { text-align: start; margin-top: 18px; }
.ofis-kapi .diger-ofisler { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.ofis-kapi .diger-ofisler a { display: inline-flex; align-items: center; gap: 6px; }
.ofis-kapi .diger-ofisler svg { width: 14px; height: 14px; }
.ofis-secim { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
.ofis-secim a {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 600;
}
.ofis-secim a svg { width: 14px; height: 14px; }
.ofis-secim a[aria-current="true"] { border-color: var(--accent); color: var(--accent-top); background: var(--accent-soft); }
.uye-secim-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 10px; }
.uye-secim-liste label { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin: 0; color: var(--ink); }
.uye-secim-liste small { color: var(--ink-3); margin-inline-start: auto; }

/* Ana sayfa bağlantıları */
.nav { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.nav a {
  position: relative;
  display: inline-flex; align-items: center; min-block-size: 36px;
  text-decoration: none; color: var(--ink-2);
  padding: 6px 11px; border-radius: 8px; font-size: 14px; font-weight: 600;
  white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] {
  color: var(--ink);
  background: var(--surface-2);
}
.nav a[aria-current="page"]::after {
  content: "";
  position: absolute;
  inset-inline: 10px;
  inset-block-end: 3px;
  border-block-end: 2px solid var(--accent);
}

.bar .end { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.tema-btn {
  display: inline-grid; place-items: center;
  min-inline-size: 36px; min-block-size: 36px; padding: 0 9px;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink-2);
}
.tema-btn:hover { color: var(--ink); border-color: var(--line-strong); }
.tema-btn svg { width: 16px; height: 16px; }
/* Koyu moddayken güneş (Açık temaya geç), açık moddayken ay (Koyu temaya geç) görünür */
.tema-koyu { display: inline-flex; align-items: center; }
.tema-acik { display: none; align-items: center; }
@media (prefers-color-scheme: dark) {
  :root:not(:has(> head > meta[name="color-scheme"][content="light"])) .tema-koyu { display: none; }
  :root:not(:has(> head > meta[name="color-scheme"][content="light"])) .tema-acik { display: inline-flex; }
}
:root:has(> head > meta[name="color-scheme"][content="dark"]) .tema-koyu { display: none; }
:root:has(> head > meta[name="color-scheme"][content="dark"]) .tema-acik { display: inline-flex; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid transparent; border-radius: var(--r-sm);
  padding: 8px 15px; min-block-size: 36px;
  font-size: 14px; font-weight: 600; text-decoration: none; line-height: 1.2;
  transition: background-color .14s, border-color .14s, opacity .14s;
}
.btn-light { background: var(--ink); color: var(--ground); }
.btn-light:hover { opacity: .9; }
.btn-ghost { background: transparent; color: var(--ink-2); border-color: var(--line); }
.btn-ghost:hover { color: var(--ink); background: var(--surface-2); border-color: var(--line-strong); }
.btn-ink { background: var(--ink); color: var(--ground); }
.btn-ink:hover { opacity: .9; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { filter: brightness(1.06); }
.btn-plain { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn-plain:hover { border-color: var(--line-strong); background: var(--surface-3); }
.btn-danger { background: transparent; color: var(--danger); border-color: color-mix(in oklab, var(--danger) 55%, var(--line)); }
.btn-danger:hover { background: var(--danger); color: var(--ground); border-color: var(--danger); }
.btn-sm { padding: 5px 11px; min-block-size: 30px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: default; }

main { padding: 30px 0 84px; }
h1 { font-size: clamp(27px, 3.6vw, 40px); line-height: 1.12; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.025em; text-wrap: balance; }
h2 { font-size: 18.5px; margin: 0 0 14px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 15.5px; margin: 0 0 6px; font-weight: 700; }
p { margin: 0 0 12px; }
.lead { font-size: 16.5px; color: var(--ink-2); max-width: 68ch; }
.muted { color: var(--ink-3); }
.warn { color: var(--warn); }
.ok { color: var(--ok); }
section { margin-top: 28px; }

/* Kart & Bento mimarisi */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 22px 24px;
  box-shadow: var(--shadow-card);
}
.card + .card, section.card { margin-top: 22px; }
.card-head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 16px; margin-bottom: 14px;
}
.card-head h2 { margin: 0; display: inline-flex; align-items: center; gap: 8px; }
.card-head h2 svg, .ayar-alan label svg { width: 17px; height: 17px; flex-shrink: 0; vertical-align: -3px; }
.card-sub { color: var(--ink-3); font-size: 13.5px; margin: -6px 0 16px; max-width: 72ch; }

/* Özet KPI şeridi */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-top: 18px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  min-width: 0;
}
.kpi-etiket {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 12.5px; font-weight: 600; color: var(--ink-3);
}
.kpi-deger {
  font-size: clamp(20px, 2.3vw, 26px); font-weight: 800; line-height: 1.15;
  letter-spacing: -0.02em; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.kpi-deger.kpi-eposta {
  font-size: clamp(13.5px, 1.35vw, 16.5px); font-weight: 700; letter-spacing: -0.01em;
}
.kpi-alt { font-size: 12.5px; color: var(--ink-3); line-height: 1.35; }
.kpi-alt a { color: var(--ink-2); font-weight: 600; text-decoration: none; }
.kpi-alt a:hover { color: var(--ink); text-decoration: underline; }

/* Rozetler */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2.5px 8.5px; border-radius: 999px;
  font-size: 12px; font-weight: 600; line-height: 1.35;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line); white-space: nowrap;
}
.pill svg { width: 12.5px; height: 12.5px; flex-shrink: 0; }
.pill-accent { background: var(--accent-soft); color: var(--accent-top); border-color: color-mix(in oklab, var(--accent) 35%, var(--line)); }
.pill-ok { background: color-mix(in oklab, var(--ok) 13%, transparent); color: var(--ok); border-color: color-mix(in oklab, var(--ok) 38%, var(--line)); }
.pill-warn { background: color-mix(in oklab, var(--warn) 14%, transparent); color: var(--warn); border-color: color-mix(in oklab, var(--warn) 40%, var(--line)); }
.pill-bad { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); border-color: color-mix(in oklab, var(--danger) 42%, var(--line)); }
.mono-hash { font: 600 12px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .01em; }

/* Bilgi kutusu (boş sağlayıcı durumu vb.) */
.callout {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 15px 18px; border-radius: var(--r);
  background: var(--accent-soft);
  border: 1px solid color-mix(in oklab, var(--accent) 32%, var(--line));
  margin-top: 18px; font-size: 14px; color: var(--ink-2);
}
.callout > svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; color: var(--accent-top); }
.callout b { color: var(--ink); }
.callout code {
  font: 600 12.5px/1.3 ui-monospace, "SF Mono", Menlo, monospace;
  background: var(--surface); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line);
}

/* Kurulum sayfası & Sekmeler (tabs rehberiyle uyumlu) */
@property --fade-start {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@property --fade-end {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
.os-tabs {
  display: flex; gap: 4px; margin-bottom: 22px;
  border-block-end: 1px solid var(--line);
  overflow-x: auto; white-space: nowrap; scrollbar-width: none;
  scroll-snap-type: inline proximity;
  --fade-size: 2.25rem;
  --fade-dir: right;
  --fade-start-pos: 0;
  --fade-end-pos: 100%;
  scroll-padding-inline: var(--fade-size);
  mask:
    linear-gradient(black, black) no-clip subtract,
    linear-gradient(to var(--fade-dir), black, transparent) var(--fade-start-pos) 0 / var(--fade-start) 100% no-repeat no-clip,
    linear-gradient(to var(--fade-dir), transparent, black) var(--fade-end-pos) 0 / var(--fade-end) 100% no-repeat no-clip;
  animation: reveal-fade-start linear both, hide-fade-end linear both;
  animation-timeline: scroll(self inline);
  animation-range: 0 var(--fade-size), calc(100% - var(--fade-size)) 100%;
  transition: --fade-start .2s, --fade-end .2s;
}
.os-tabs:dir(rtl) {
  --fade-dir: left;
  --fade-start-pos: 100%;
  --fade-end-pos: 0;
}
.os-tabs.more-start { --fade-start: var(--fade-size); }
.os-tabs.more-end { --fade-end: var(--fade-size); }
@keyframes reveal-fade-start { to { --fade-start: var(--fade-size); } }
@keyframes hide-fade-end { from { --fade-end: var(--fade-size); } }
.os-tabs::-webkit-scrollbar { display: none; }
.os-tabs [role="tab"] {
  position: relative; flex: none; scroll-snap-align: start;
  display: inline-flex; align-items: center; gap: 7px;
  background: none; border: 0; border-radius: 8px 8px 0 0;
  padding: 10px 16px; min-block-size: 40px;
  color: var(--ink-3); font-weight: 600; font-size: 14.5px;
}
.os-tabs [role="tab"] svg { width: 15px; height: 15px; flex-shrink: 0; }
.os-tabs [role="tab"]:hover { color: var(--ink); background: var(--surface-2); }
.os-tabs [role="tab"][aria-selected="true"] {
  color: var(--ink);
}
.os-tabs [role="tab"][aria-selected="true"]::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  border-block-end: 3px solid var(--accent);
}
/* hidden="until-found" panellerde boş şerit bırakmamak için aynı grid hücresinde tutulur; dolgu iç sarmalayıcıdadır */
.sekme-paneller { display: grid; }
.sekme-paneller > [role="tabpanel"] { grid-area: 1 / 1; min-width: 0; margin: 0; padding: 0; border: 0; background: none; }
.sekme-paneller > [role="tabpanel"][hidden] { pointer-events: none; }
.steps { display: grid; gap: 18px; max-width: 820px; }
.step {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px;
  padding: 18px 20px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line);
}
.step > div { min-width: 0; }
.step .n {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-top);
  border: 1px solid color-mix(in oklab, var(--accent) 40%, var(--line));
  display: grid; place-items: center; font-weight: 800; font-size: 14px; flex-shrink: 0;
}
.cmd {
  color-scheme: only dark;
  display: flex; align-items: stretch; margin-top: 10px; min-width: 0; max-width: 100%;
  background: #0b0f16; color: #eef2f7; accent-color: var(--accent);
  border: 1px solid #253042; border-radius: var(--r-sm); overflow: hidden;
}
.cmd code { flex: 1; min-width: 0; padding: 13px 15px; font: 13.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow-x: auto; white-space: pre; }
.cmd button { background: #131924; border: 0; border-inline-start: 1px solid #253042; color: #b8c4d4; padding: 0 16px; font-weight: 600; font-size: 13.5px; }
.cmd button:hover { color: #ffffff; background: #1b2434; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.fact-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow-card);
}
.fact-card p { color: var(--ink-2); margin: 0; font-size: 14px; }

/* Giriş */
.login {
  max-width: 410px; margin: 8vh auto 0;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 30px 28px; box-shadow: var(--shadow-card);
}
label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; color: var(--ink-2); }
input[type=password], input[type=email], input[type=text], input[type=search], input[type=number], input[type="datetime-local"], select {
  width: 100%; font: inherit; font-size: max(1rem, 1em); padding: 9px 12px; min-block-size: 40px;
  border-radius: var(--r-sm); border: 1px solid var(--line-strong);
  background: var(--surface-2); color: var(--ink); box-sizing: border-box;
}
input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
input:user-invalid, select:user-invalid { border-color: var(--danger); }
.field { margin-bottom: 14px; }
.err { color: var(--danger); margin-top: 10px; font-size: 14px; font-weight: 600; }

/* Hafta başlığı */
.weekhead {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 20px; margin-top: 4px;
}
.weekhead .range {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  color: var(--ink-3); font-size: 13.5px; font-weight: 600; margin-bottom: 6px;
}
.weeknav {

}
.rail { display: flex; align-items: flex-end; gap: 5px; height: 48px; }
.rail a { display: block; width: 16px; background: var(--surface-3); border-radius: 4px 4px 2px 2px; min-height: 5px; transition: background-color .14s; }
.rail a:hover { background: var(--ink-3); }

.arrow {

}

/* İzometrik Ofis Sahnesi (her iki temada da zengin koyu stüdyo atmosferini korur) */

  }
  @container office (min-width: 620px) {
    .ofis-balon { padding: 4px 7.5px 4.5px; border-radius: 7.5px; }
  }
}
.ofis-balon .ob-ad { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: #b8c4c1; margin-right: 3px; }
.ofis-balon .ob-ad i { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.ofis-balon .ob-ok { position: absolute; width: 5.5px; height: 5.5px; background: rgba(18, 24, 28, .95); transform: translate(-50%, -50%) rotate(45deg); }
.ofis-balon.kavga-b { background: rgba(48, 19, 17, .94); color: #fff4f2; box-shadow: 0 5px 14px -4px rgba(0, 0, 0, .6), 0 0 0 1px rgba(240, 120, 109, .55); }
.ofis-balon.kavga-b .ob-ad { color: #ffb4ad; }
.ofis-balon.kavga-b .ob-ok { background: rgba(48, 19, 17, .96); }
.kavga-bulutlari { pointer-events: none; }
.kavga-bulutlari .toz { fill: #efe8d8; stroke: #cbbda2; stroke-width: .9; opacity: .92; }
.kavga-bulutlari .cizgi { stroke: #ffd24c; stroke-width: 1.5; stroke-linecap: round; }
.kavga-bulutlari .yildiz { font: 700 11px/1 system-ui, sans-serif; fill: #f7c942; }
.buhar path { fill: none; stroke: #ffffff; stroke-width: 1.2; stroke-linecap: round; opacity: .36; }
@media (prefers-reduced-motion: no-preference) {
  .buhar path { animation: buhar 2.8s ease-in-out infinite; }
  .buhar path:nth-child(2) { animation-delay: -1.4s; }
  .led-yanip { animation: led 1.9s steps(2, end) infinite; }
  .led-yanip.gec { animation-delay: -.85s; animation-duration: 2.5s; }
  .screen-lines line { stroke-dasharray: 12 28; animation: type 2.6s linear infinite; }
  .screen-lines line:nth-child(2) { animation-delay: -.8s; }
  .screen-lines line:nth-child(3) { animation-delay: -1.6s; }
  .screen-lines line:nth-child(4) { animation-delay: -2.1s; }
  .office-stage.duraklatildi .buhar path,
  .office-stage.duraklatildi .led-yanip,
  .office-stage.duraklatildi .screen-lines line { animation-play-state: paused; }
}
@keyframes buhar { 0% { opacity: 0; transform: translateY(2px); } 45% { opacity: .42; } 100% { opacity: 0; transform: translateY(-9px); } }
@keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .22; } }
.screen-lines line { stroke-width: 1.35; stroke-linecap: round; }
@keyframes type { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
.legend { display: flex; gap: 10px 18px; flex-wrap: wrap; justify-content: center; color: var(--ink-3); font-size: 12.5px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, .08); }
.legend.lg-leg { border-top: 0; padding-top: 0; justify-content: flex-start; margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 9px; border-radius: 2px; display: inline-block; }
.legend i.ln { width: 18px; height: 2.5px; border-radius: 0; }

/* Günlük çubuklar */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 205px; }
.day {
  display: flex; flex-direction: column; justify-content: flex-end; height: 100%;
  text-align: center; position: relative; padding: 8px 4px 6px; border-radius: 10px;
  transition: background-color .14s;
}
.day .col { background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 3px; margin: 0 auto; width: min(52px, 72%); transition: filter .14s; }
.day .v { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }
.day .d { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; border-top: 1px solid var(--line); padding-top: 7px; }
.day .d span { display: inline; }
.day.future .v { color: var(--ink-3); font-weight: 500; }
.day.today { background: var(--surface-2); }
.day.today .d { color: var(--ink); font-weight: 700; }
.day.secilir { cursor: pointer; }
.day.secilir:hover { background: var(--surface-2); }
.day.secilir:hover .col { filter: brightness(1.1); }
.day.secili { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: 1px; }
.day.secili .d { color: var(--ink); font-weight: 700; }

.fable-cubuk {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
}
.fable-gir {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px;
}
.fable-gir label { color: var(--ink-3); margin: 0; font-size: 12.5px; }
.fable-gir input { font: inherit; font-size: 13px; width: 5.2em; min-block-size: 30px; padding: 3px 7px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); color: var(--ink); }
.fable-gir button { font: inherit; font-size: 12px; font-weight: 600; line-height: 1; min-block-size: 30px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); cursor: pointer; }
.fable-gir button:hover { border-color: var(--ink-2); background: var(--surface-3); }
.fable-durum { color: var(--ink-3); font-size: 12px; }
.fable-ayar-bag { margin-inline-start: auto; font-size: 12.5px; font-weight: 600; color: var(--ink-3); text-decoration: none; }
.fable-ayar-bag:hover { color: var(--ink); text-decoration: underline; }
.lgun-kaldir { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); cursor: pointer; align-self: flex-start; }
.lgun-kaldir:hover { border-color: var(--ink-2); }

.tip {
  position: absolute; bottom: calc(100% - 14px); left: 50%; transform: translateX(-50%); z-index: 5;
  background: var(--ink); color: var(--ground); border-radius: 8px; padding: 8px 11px; font-size: 12.5px;
  text-align: left; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s;
  box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .4);
}
.tip.l { left: 0; transform: none; }
.tip.r { left: auto; right: 0; transform: none; }
.day:hover .tip, .day:focus-within .tip { opacity: 1; }

/* Duyarlı tablolar (responsive-table rehberiyle uyumlu) */
.table-wrap {
  container-type: inline-size;
  overflow-x: auto;
  border-radius: var(--r-sm);
}
.table-wrap:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
th, td { padding: 11px 12px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface);
  color: var(--ink-3); font-weight: 600; font-size: 12.5px;
  border-block-end: 1px solid var(--line);
}
tbody td { border-block-end: 1px solid var(--line); }
tbody tr:last-child td { border-block-end: 0; }
tbody tr:hover td { background: var(--surface-2); }
tfoot td { font-weight: 700; border-block-start: 2px solid var(--line); background: var(--surface-2); }
td.usd { font-weight: 700; color: var(--ink); }
.usd-wrap { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; }
.pay-cubuk { width: 42px; height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; display: inline-block; flex-shrink: 0; }
.pay-cubuk i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
td a { font-weight: 600; text-decoration: none; }
td a:hover { color: var(--accent-top); text-decoration: underline; }
.model-etiket { font: 600 13px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.note { color: var(--ink-3); font-size: 13.5px; max-width: 74ch; margin-top: 14px; margin-bottom: 0; }

@container (max-width: 680px) {
  .table-wrap th:first-child, .table-wrap td:first-child {
    position: sticky; left: 0; z-index: 2;
    background: var(--surface);
    border-inline-end: 1px solid var(--line);
  }
  .table-wrap tbody tr:hover td:first-child { background: var(--surface-2); }
  .table-wrap tfoot td:first-child { background: var(--surface-2); }
  .pay-cubuk { display: none; }
}

/* Detay & Limit kartı */
.back {
  display: inline-flex; gap: 6px; align-items: center;
  color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 600;
  margin-bottom: 16px; padding: 5px 10px 5px 7px; border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line);
}
.back:hover { color: var(--ink); border-color: var(--line-strong); }
.back svg { width: 16px; height: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.split > section { margin-top: 22px; }

.limit-card { margin-top: 20px; }
.lhead { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: flex-start; }
.lhead p { margin: 0; }
.lhead-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
.lbig { font-size: clamp(34px, 6.5vw, 52px); font-weight: 800; line-height: 1.05; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; margin-top: 4px !important; }
.llist { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 12px; }
.lrow {
  display: grid; grid-template-columns: minmax(90px, 180px) 1fr auto; gap: 14px; align-items: center;
  padding: 10px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
}
.lrow .ln { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.lbar { position: relative; height: 10px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.lbar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; }
.lbar i.over { background: var(--danger); }
.lmid { display: grid; gap: 6px; min-width: 0; }
.fbar { position: relative; height: 5px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.fbar i { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 999px; }
.fbar i.over { background: var(--danger); }
.flab { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.lv { display: grid; text-align: right; font-variant-numeric: tabular-nums; }
.lv small { color: var(--ink-3); font-size: 12px; }
.old { font-weight: 600; }

/* Grafikler */
.chart { position: relative; margin: 6px 0 8px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
.chart svg:focus-visible { outline-offset: 6px; }
.chart text { font-size: 12px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .axis, .chart .tick { stroke: var(--ink-3); stroke-width: 1; }
.chart .col { fill: var(--accent); transition: fill .12s ease-out; }
.chart .col.live { fill: var(--accent-side); }
.chart .col.on { fill: var(--accent-top); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit.on { fill: var(--surface-2); }
.chart .cols { pointer-events: none; }
.chart .future { fill: var(--surface-2); opacity: .6; }
.chart .ln-real, .chart .ln-exp { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: butt; }
.chart .ln-real { stroke: var(--accent); }
.chart .ln-exp { stroke: var(--screen-on); }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; pointer-events: none; }
.chart .pt-real, .chart .pt-exp { stroke: var(--surface); stroke-width: 2; pointer-events: none; }
.chart .pt-real { fill: var(--accent); }
.chart .pt-exp { fill: var(--screen-on); }
.chart .endl { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
tr.best td { font-weight: 700; color: var(--ink); background: var(--accent-soft); }
.chart .peak { fill: var(--ink-2); font-weight: 700; }
.chart .empty-t { fill: var(--ink-3); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) {
  .chart svg.grow .col { transform-box: fill-box; transform-origin: 50% 100%; animation: sutun .42s cubic-bezier(.16, 1, .3, 1) both; }
}
@keyframes sutun { from { transform: scaleY(0); } }
.chart .col.sel { fill: var(--accent-top); }
.chart svg.has-sel .col:not(.sel) { opacity: .42; }
.chart .selmark { fill: var(--accent-top); pointer-events: none; }
.gdt { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); min-height: 240px; }
.gdt-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 14px; }
.gdt-head h3 { margin: 0; font-size: 16.5px; }
.gdt-head .muted, .gdt-head button { font-size: 13.5px; }
.gdt-head button { font: inherit; font-size: 13.5px; background: none; border: 0; padding: 4px 0; min-height: 30px; color: var(--accent-top); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.gdt-head button:hover { color: var(--ink); }
.gdt-fig { display: flex; flex-wrap: wrap; gap: 10px 32px; margin: 0 0 16px; }
.gdt-fig div { display: flex; flex-direction: column-reverse; }
.gdt-fig dt { color: var(--ink-3); font-size: 12.5px; }
.gdt-fig dd { margin: 0; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.gdt-fig.sm { gap: 8px 26px; margin-bottom: 14px; }
.gdt-fig.sm dd { font-size: 15.5px; font-weight: 600; color: var(--ink-2); }
.gdt-bos { color: var(--ink-3); margin: 0; }

.gtip {
  position: absolute; top: 0; transform: translate(-50%, -100%);
  display: none; gap: 2px; min-width: 130px;
  background: var(--ink); color: var(--ground);
  padding: 8px 12px; border-radius: 9px; pointer-events: none;
  box-shadow: 0 10px 24px -6px rgba(0, 0, 0, .45); font-variant-numeric: tabular-nums; z-index: 6;
}
.gtip b { font-size: 16.5px; line-height: 1.2; }
.gtip span { font-size: 12.5px; }
.gtip small { font-size: 11.5px; opacity: .72; white-space: nowrap; }

.gr-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 14px; }
.gr-head h2 { margin: 0; }
.gr-kontroller { display: flex; align-items: center; gap: 8px; }
.gr-modes { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line); }
.gr-modes button { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-3); background: none; border: 0; border-radius: 7px; padding: 6px 12px; min-height: 34px; cursor: pointer; white-space: nowrap; }
.gr-modes button:hover { color: var(--ink); }
.gr-modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.gr-tur {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 12px; min-height: 40px; cursor: pointer; white-space: nowrap;
}
.gr-tur:hover { color: var(--ink); border-color: var(--line-strong); }
.gr-tur[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-top); border-color: var(--accent); }
.chart .ln-rise { fill: none; stroke: var(--accent-top); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.chart .ln-area { pointer-events: none; }
.chart .pt-step { fill: var(--accent); pointer-events: none; }
.chart .pt-end { fill: var(--accent-top); stroke: var(--surface); stroke-width: 2; pointer-events: none; }
.chart .pt-on { fill: var(--accent-top); stroke: var(--ink); stroke-width: 2; pointer-events: none; }
.chart .pt-sel { fill: none; stroke: var(--ink); stroke-width: 1.8; pointer-events: none; }
.gr-ozet { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 0 0 10px; }
.gr-ozet p { margin: 0; }
.gr-ozet .gsum { font-size: 14.5px; color: var(--ink-2); }
.gr-ozet .gsum b { font-size: 26px; font-weight: 800; color: var(--ink); margin-right: 6px; letter-spacing: -0.02em; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }
.danger-zone {
  margin-top: 28px; padding: 22px 24px;
  border-radius: var(--r); background: var(--surface);
  border: 1px solid color-mix(in oklab, var(--danger) 38%, var(--line));
}
.danger-zone p { color: var(--ink-2); max-width: 60ch; }
.rename { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rename input { max-width: 320px; }

/* Bilgisayarlar & Ortak Hesap Kilidi */
.kilit-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 16px;
}
.kilit-kart {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 16px 18px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
}
.kilit-ust { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kilit-ust b { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; }
.kilit-ust b svg { width: 16px; height: 16px; }
.kilit-detay { font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; min-width: 0; }
.kilit-detay small { color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }
.kilit-eposta { color: var(--ink); font-weight: 700; overflow-wrap: anywhere; }
.kilit-form { display: grid; gap: 7px; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.kilit-form label { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 0; }
.kilit-form select { min-block-size: 34px; padding: 5px 10px; font-size: 13px; }
.kilit-aksiyonlar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.alan-hata { display: none; color: var(--danger); font-size: 12px; font-weight: 600; margin-top: 2px; }
:is(:user-invalid, .user-invalid-fallback) {
  border-color: var(--danger);
  background-color: color-mix(in oklab, var(--danger) 9%, var(--surface));
}
:is(:user-invalid, .user-invalid-fallback) + .alan-hata { display: block; }
.hesap-rozetler { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.hesap-rozetler .pill { max-width: 100%; }
.hesap-rozetler .pill > span { overflow: hidden; text-overflow: ellipsis; max-width: 26ch; }

.hlist { list-style: none; margin: 16px 0 0; padding: 0; }
.hlist li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.hlist li:last-child { border-bottom: 0; }
.hlist small { display: block; font-size: 12.5px; }
.devlist td small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.addrow { display: grid; grid-template-columns: 1fr 180px auto; gap: 12px; align-items: end; }
#f-profil.addrow { grid-template-columns: minmax(180px, 380px) auto; justify-content: start; }
#add.addrow:has(#uy) { grid-template-columns: 1fr 160px 180px auto; }
.bildirim .field { margin-bottom: 14px; }
.bildirim .hint { font-size: 12.5px; margin: 5px 0 0; }
.blist { list-style: none; margin: 20px 0 0; padding: 0; }
.blist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.blist li:last-child { border-bottom: 0; }
.blist b { display: block; overflow-wrap: anywhere; }
.blist small { display: block; font-size: 12.5px; }
.codebox { margin-top: 18px; padding: 16px 18px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.code { font: 700 24px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em; color: var(--accent-top); }
.empty { color: var(--ink-3); padding: 18px 0; text-align: center; }

/* Onay penceresi */
dialog {
  border: 1px solid var(--line); border-radius: 14px; padding: 24px;
  max-width: min(440px, calc(100dvw - 32px));
  background: var(--surface); color: var(--ink);
  box-shadow: 0 24px 60px -12px rgba(0, 0, 0, .55);
}
dialog:modal { overscroll-behavior: contain; }
dialog::backdrop { background: rgba(7, 10, 15, .62); backdrop-filter: blur(3px); overflow: hidden; overscroll-behavior: contain; }
dialog h2 { margin-bottom: 8px; }
dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.btn-solid-danger { background: var(--danger); color: #fff; }
.btn-solid-danger:hover { opacity: .92; }

/* Ayarlar & Manuel Kontrol Merkezi */
.ayar-nav {
  display: flex; gap: 4px; margin: 16px 0 22px;
  border-block-end: 1px solid var(--line);
  overflow-x: auto; white-space: nowrap; scrollbar-width: none;
}
.ayar-nav::-webkit-scrollbar { display: none; }
.ayar-nav a {
  position: relative; flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 15px; min-block-size: 40px; border-radius: 8px 8px 0 0;
  color: var(--ink-3); font-weight: 600; font-size: 14px; text-decoration: none;
}
.ayar-nav a:hover { color: var(--ink); background: var(--surface-2); }
.ayar-nav a[aria-current="page"] { color: var(--ink); }
.ayar-nav a[aria-current="page"]::after {
  content: ""; position: absolute; inset: auto 0 0;
  border-block-end: 3px solid var(--accent);
}
.ayar-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));

}
.ayar-alan { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

.ayar-ipucu { font-size: 12.5px; color: var(--ink-3); margin: 0; line-height: 1.4; }

}

.radyo-satir { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-top: 4px; }
.radyo-eleman { display: inline-flex; align-items: center; gap: 7px; }
.radyo-eleman input[type="radio"] { inline-size: 17px; block-size: 17px; margin: 0; cursor: pointer; flex-shrink: 0; }
.radyo-eleman label { margin: 0; font-weight: 500; font-size: 14px; color: var(--ink); cursor: pointer; }
.anahtar-liste { display: grid; gap: 10px; margin-bottom: 18px; }
.anahtar-satir {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 12px 14px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--line);
}
.ak-etiket {
  display: inline-flex; align-items: flex-start; gap: 10px;
  margin: 0; font-weight: 600; font-size: 14px; color: var(--ink); cursor: pointer; line-height: 1.35;
}
.ak-etiket input[type="checkbox"] { inline-size: 18px; block-size: 18px; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
.ak-aciklama { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.durum-satir { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; }
.kayit-durum { font-size: 13.5px; font-weight: 600; color: var(--ok); }
.kayit-durum.hata { color: var(--danger); }

.pay-satir-liste { display: grid; gap: 10px; margin: 12px 0 16px; }
.pay-satir {
  display: grid; grid-template-columns: minmax(120px, 1fr) 120px minmax(110px, auto);
  gap: 12px; align-items: center; padding: 10px 14px;
  border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
}
.pay-satir b { overflow-wrap: anywhere; }
.pay-onizleme { text-align: right; font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--ink-2); }

.karakter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; margin-bottom: 16px; }
.karakter-kart {
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start;
  padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line);
}
.karakter-onizleme {
  color-scheme: only dark;
  color: #f2f5f9;
  accent-color: var(--accent);
  background: radial-gradient(circle at 50% 35%, #24333b 0%, #12181c 100%);
  border: 1px solid #2b3a42; border-radius: 10px;

}

.karakter-onizleme .k-arka, .karakter-onizleme .k-otur, .karakter-onizleme .k-uyu { display: none; }
.karakter-alanlar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.karakter-alanlar label { font-size: 12px; margin-bottom: 3px; color: var(--ink-3); }
.karakter-alanlar select { padding: 6px 8px; min-block-size: 34px; font-size: 13px; }
.karakter-ust { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }

.disa-aktar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
.disa-kart {
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line);
}
.disa-kart p { margin: 0; font-size: 13px; color: var(--ink-3); }
.satir-ici-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.satir-ici-form input, .satir-ici-form select { width: auto; flex: 1 1 150px; min-width: 120px; }

/* Dar kapsayıcılarda yığınlanan duyarlı yönetim tabloları (responsive-table rehberiyle uyumlu) */
@container (max-width: 580px) {
  table.yigin-tablo, table.yigin-tablo thead, table.yigin-tablo tbody, table.yigin-tablo tr, table.yigin-tablo th, table.yigin-tablo td {
    display: block; width: 100%; white-space: normal; text-align: left;
  }
  table.yigin-tablo thead { display: none; }
  table.yigin-tablo tbody tr {
    margin-block-end: 12px; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; background: var(--surface-2);
  }
  table.yigin-tablo tbody th {
    position: sticky; inset-block-start: 0; inset-inline-start: auto; z-index: 2;
    background: var(--surface-3); border-inline-end: 0; border-block-end: 1px solid var(--line);
    font-weight: 700; color: var(--ink);
  }
  table.yigin-tablo tbody td {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px;
    padding: 9px 12px;
  }
  table.yigin-tablo td:nth-child(2)::before { content: var(--l2) ": "; color: var(--ink-3); font-weight: 600; }
  table.yigin-tablo td:nth-child(3)::before { content: var(--l3) ": "; color: var(--ink-3); font-weight: 600; }
  table.yigin-tablo td:nth-child(4)::before { content: var(--l4) ": "; color: var(--ink-3); font-weight: 600; }
  table.yigin-tablo td:nth-child(5)::before { content: var(--l5) ": "; color: var(--ink-3); font-weight: 600; }
  table.yigin-tablo td:nth-child(6)::before { content: var(--l6) ": "; color: var(--ink-3); font-weight: 600; }
}

/* accent-color desteklemeyen tarayıcılar için kademeli geri dönüş (brand-consistent-forms rehberi) */
@supports not (accent-color: var(--accent)) {
  input[type="checkbox"].ak-kutu {
    position: absolute !important; clip-path: inset(50%) !important; overflow: hidden !important;
    width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; border: 0 !important; white-space: nowrap !important;
  }
  .ak-etiket { position: relative; padding-inline-start: 1.9rem; }
  input[type="checkbox"].ak-kutu + span::before {
    content: ""; position: absolute; inset-inline-start: 0; top: 0.15rem;
    width: 1.2rem; height: 1.2rem; border: 2px solid var(--line-strong);
    background: var(--surface); border-radius: 4px; box-sizing: border-box;
  }
  input[type="checkbox"].ak-kutu:focus-visible + span::before { outline: 2px solid var(--focus); outline-offset: 2px; }
  input[type="checkbox"].ak-kutu:checked + span::before { background-color: var(--accent); border-color: var(--accent); }
  input[type="checkbox"].ak-kutu:checked + span::after {
    content: "✓"; position: absolute; inset-inline-start: 0.24rem; top: 0.1rem;
    color: #fff; font-weight: 700; font-size: 0.88rem; line-height: 1.2;
  }
  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: linear-gradient(to right, var(--accent) var(--progress, 0%), var(--surface-3) var(--progress, 0%)); border-radius: 4px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); margin-top: -4px; cursor: pointer; }
  input[type="range"]::-moz-range-track { width: 100%; height: 8px; background: var(--surface-3); border-radius: 4px; }
  input[type="range"]::-moz-range-progress { background-color: var(--accent); height: 8px; border-radius: 4px; }
  input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
}

/* Açık kaynak ürün vitrini (/), canlı simülasyon kumandası ve sağlayıcıya özel telemetri */
.landing-hero {
  position: relative;
  padding: clamp(22px, 3.5vw, 38px) clamp(20px, 3.5vw, 38px);
  border-radius: 20px;
  border: 1px solid color-mix(in oklab, var(--accent) 28%, var(--line));
  background:
    radial-gradient(90% 120% at 100% 0%, var(--accent-soft) 0%, transparent 62%),
    linear-gradient(180deg, var(--surface) 0%, color-mix(in oklab, var(--surface) 82%, var(--surface-2)) 100%);
  box-shadow: var(--shadow-card);
}
.hero-rozetler { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.landing-hero h1 {
  font-size: clamp(28px, 4.1vw, 48px);

  letter-spacing: -0.03em;

  margin-bottom: 14px;
}
.landing-hero .lead { font-size: clamp(15.5px, 1.4vw, 18px); line-height: 1.58; max-width: 66ch; margin-bottom: 22px; }
.hero-aksiyonlar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hero-aksiyonlar .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.hero-hizli-kur {
  margin-top: 22px; padding-top: 18px;

  display: grid; gap: 8px;
}
.hero-hizli-kur .ayar-ipucu { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.ozet-serit {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px; margin-top: 18px;
}
.ozet-kutu {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 15px 17px; box-shadow: var(--shadow-card);

.bolum-baslik { margin-bottom: 16px; }

.demo-kumanda {

}

const sistemTemaMedya = matchMedia("(prefers-color-scheme: dark)");
function temaUygula(m) {
  const gecerli = m === "light" || m === "dark" ? m : "light dark";
  const cs = $('meta[name="color-scheme"]');
  const tc = $('meta[name="theme-color"]');
  if (cs) cs.content = gecerli;
  const koyu = gecerli === "dark" || (gecerli === "light dark" && sistemTemaMedya.matches);
  if (tc) tc.content = koyu ? "#090c11" : "#f4f6fa";
}
sistemTemaMedya.addEventListener("change", () => {
  const cs = $('meta[name="color-scheme"]');
  if (!cs || cs.content === "light dark") temaUygula("light dark");
});
function temaDegistir() {
  const cs = $('meta[name="color-scheme"]');
  const ham = cs ? cs.content : "light dark";
  const cur = ham === "light" || ham === "dark" ? ham : (sistemTemaMedya.matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  const sys = sistemTemaMedya.matches ? "dark" : "light";
  if (next === sys) {
    try { localStorage.removeItem("tp_tema"); } catch {}
    temaUygula("light dark");
  } else {
    try { localStorage.setItem("tp_tema", next); } catch {}
    temaUygula(next);
  }
}

  catch { throw new Error("Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene."); }

// Erişilebilir sekme bağlayıcı: hidden="until-found" + beforematch + ok tuşlarıyla odak takibi
function sekmeBagla(kokEl, secimCb) {
  if (!kokEl) return;
  const tablist = kokEl.querySelector('[role="tablist"]');
  if (!tablist) return;
  const tabs = [...tablist.querySelectorAll('[role="tab"]')];
  const panels = tabs.map((t) => kokEl.querySelector(`[role="tabpanel"][aria-labelledby="${CSS.escape(t.id)}"]`));
  const odaklanabilirVar = (el) => !!el?.querySelector('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex="0"]');
  const uygula = (seciliTab, { odakla = false, kaydir = true } = {}) => {
    tabs.forEach((t, i) => {
      const secili = t === seciliTab;
      t.setAttribute("aria-selected", String(secili));
      t.tabIndex = secili ? 0 : -1;
      const p = panels[i];
      if (!p) return;
      if (secili) {
        p.removeAttribute("hidden");
        if (!odaklanabilirVar(p)) p.tabIndex = 0; else p.removeAttribute("tabindex");
      } else {
        p.setAttribute("hidden", "until-found");
        p.removeAttribute("tabindex");
      }
    });
    if (kaydir) {
      try { seciliTab.scrollIntoView({ block: "nearest", inline: "nearest", container: "nearest" }); }
      catch { seciliTab.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    }
    if (odakla) seciliTab.focus({ preventScroll: true });
    if (secimCb) secimCb(seciliTab.dataset.sekme || seciliTab.id);
  };
  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => uygula(tab, { odakla: false }));
    tab.addEventListener("keydown", (ev) => {
      if (!["ArrowRight", "ArrowLeft", "Home", "End"].includes(ev.key)) return;
      ev.preventDefault();
      const n = tabs.length;
      const hedef = ev.key === "Home" ? 0 : ev.key === "End" ? n - 1 : (i + (ev.key === "ArrowRight" ? 1 : -1) + n) % n;
      uygula(tabs[hedef], { odakla: true });
    });
    const panel = panels[i];
    if (panel) {
      panel.addEventListener("beforematch", () => uygula(tab, { odakla: false }));
    }
  });
  if (tabs.length >= 2 && typeof IntersectionObserver !== "undefined" && (typeof CSS === "undefined" || !CSS.supports("animation-timeline", "scroll()"))) {
    const first = tabs[0], last = tabs[tabs.length - 1];
    const io = new IntersectionObserver((entries) => {
      for (const { target, intersectionRatio } of entries) {
        tablist.classList.toggle(target === first ? "more-start" : "more-end", intersectionRatio < 1);
      }
    }, { root: tablist, threshold: 1, rootMargin: "1px" });
    io.observe(first);
    io.observe(last);
  }
}

      if (!byModel.has(r.model)) byModel.set(r.model, sumZero());
      add(byModel.get(r.model), r);
    }
    const liveSet = liveSetOf(d);
    const groups = gruplar(d, perDev);
    const maxUsd = Math.max(...groups.map((g) => g.usd), 0);
    const asanlar = payAsanlar(d, groups);
    const payMap = grupPaylari(groups, d.ayar);
    const pct = d.limit.pct;
    const cachePayda = total.input + total.cw + total.cr;
    const cacheOran = cachePayda > 0 ? Math.round((total.cr / cachePayda) * 1000) / 10 : 0;
    const uyeSatirlar = [...groups].sort((a, b) => b.usd - a.usd).map((g) => {
      const hak = payMap.get(g.id) || 20;
      const used = total.usd > 0 ? pct * (g.usd / total.usd) : 0;
      const bar = Math.min(100, (used / hak) * 100);
      const over = used >= hak - 0.005;
      return `<li class="lrow"><span class="ln">${esc(g.ad)}${g.devs.length > 1 ? `<small class="ldv">${g.devs.length} bilgisayar birleşik</small>` : ""}</span>
        <span class="lmid"><span class="lbar" role="img" aria-label="${esc(g.ad)} kota kullanımı"><i style="width:${bar.toFixed(1)}%" class="${over ? "over" : ""}"></i></span></span>
        <span class="lv"><b class="${over ? "bad" : ""}">%${pctFmt(used)}</b><small>hakkı %${pctFmt(hak)} · ${money(g.usd)}</small></span></li>`;
    }).join("");

    kutu.innerHTML = `
      <div class="demo-senaryo-aciklama">
        <span><b>${esc(ofisTema(d.saglayici).ad)} · ${esc(DEMO_SENARYOLAR[demoDurum.senaryo].ad)}:</b> ${esc(DEMO_SENARYOLAR[demoDurum.senaryo].aciklama)}</span>

      </div>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-etiket"><span>Örnek haftalık API karşılığı</span><span class="pill pill-accent">${esc(sb.apiAd)}</span></div>
          <div class="kpi-deger">${money(total.usd)}</div>
          <div class="kpi-alt">${byModel.size} aktif model · ${groups.length} masa (${d.devices.length} cihaz)</div>
        </div>
        <div class="kpi">
          <div class="kpi-etiket"><span>Önbellek (Cache) isabeti</span><span class="pill pill-ok">%${pctFmt(cacheOran)}</span></div>
          <div class="kpi-deger">${short(total.cr)}</div>
          <div class="kpi-alt">Toplam ${short(total.tok)} token içinde bağlam okuması</div>
        </div>
        <div class="kpi">
          <div class="kpi-etiket"><span>Ortak abonelik kotası</span><span class="pill ${asanlar.size ? "pill-bad" : "pill-ok"}">${asanlar.size ? `${asanlar.size} aşım var` : "Dengeli"}</span></div>
          <div class="kpi-deger">%${pctFmt(pct)}</div>
          <div class="kpi-alt">${d.saglayici === "gemini" ? "Antigravity Claude %61,8 · Gemini %39,2" : `5 saatlik pencere: %${pctFmt(d.limit.h || 0)}`}</div>
        </div>
        <div class="kpi">
          <div class="kpi-etiket"><span>Ortak hesap kilidi</span><span class="pill pill-ok">Kilitli</span></div>
          <div class="kpi-deger kpi-eposta">ekip@ornek-studyo.dev</div>
          <div class="kpi-alt">Yalnızca doğrulanan ekip hesabı kotaya dahil</div>
        </div>
      </div>
      ${saglayiciTelemetriKarti(d, total, byModel)}
      ${officeScene(d, groups, perDev, liveSet, maxUsd, asanlar, { demo: true })}
      <section class="card limit-card" aria-labelledby="h-demo-lim">
        <div class="card-head"><h2 id="h-demo-lim">${ICON[sb.id]}<span>${esc(ofisTema(d.saglayici).ad)} — Kişi Başı Adil Kota Dağılımı Önizlemesi</span></h2><span class="pill">${asanlar.size ? "Aşım müdahalesi aktif" : "Eşit %20 pay"}</span></div>
        <ul class="llist" role="list" style="margin-top:8px">${uyeSatirlar}</ul>
      </section>`;

    OFIS.kisiler.clear();
    OFIS.anahtar = "";
    OFIS.yenidenCiz = demoCiz;
    ofisBaslat();
    kutu.querySelectorAll("[data-demo-grp]").forEach((el) => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        if (typeof OFIS.kisiTepki === "function") OFIS.kisiTepki(el.dataset.demoGrp);
      };
    });
    kutu.querySelectorAll(".desk-hit[data-demo-grp]").forEach((el) => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        if (typeof OFIS.kisiTepki === "function") OFIS.kisiTepki(el.dataset.demoGrp);

  };

  document.querySelectorAll("[data-demo-sgl]").forEach((btn) => {

      document.querySelectorAll("[data-demo-sgl]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));

  document.querySelectorAll("[data-demo-senaryo]").forEach((btn) => {

function sifreGosterDugmesi(inputId) {
  return `<button type="button" class="btn btn-plain btn-sm sifre-goster" data-goster="${inputId}" aria-pressed="false" aria-controls="${inputId}" aria-describedby="${inputId}-uyari">Göster</button><span id="${inputId}-uyari" class="visually-hidden">Dikkat: şifren ekranda düz metin olarak görünür.</span>`;
}
function sifreGosterBagla() {
  document.querySelectorAll("[data-goster]").forEach((b) => {
    b.onclick = () => {
      const i = document.getElementById(b.dataset.goster);
      if (!i) return;
      const ac = i.type === "password";
      i.type = ac ? "text" : "password";
      b.setAttribute("aria-pressed", String(ac));
      b.textContent = ac ? "Gizle" : "Göster";
    };
  });
}

async function pageLogin() {
  if (await isAuthed()) return go(urlKur("/pano"));

  let acilMod = false;
  const ciz = () => {
    shell("", `<div class="login">
      <h1>Giriş</h1>
      <p class="muted">${acilMod ? "Acil durum girişi: kurulumda belirlenen anahtar (VIEW_KEY) ile süper yönetici olarak girersin." : "Kullanıcı adın ve şifrenle giriş yap."}</p>

      </form>
      <p class="giris-alt">${acilMod ? `<button type="button" class="link-btn" id="mod">← Kullanıcı adıyla giriş</button>` : `<span class="muted">Şifreni unuttuysan yöneticiden bağlantı iste.</span><button type="button" class="link-btn" id="mod">Acil durum girişi</button>`}</p>
    </div>`, { authed: false });
    sifreGosterBagla();
  onarKopyalaBagla();
    $("#mod").onclick = () => { acilMod = !acilMod; ciz(); };
    $("#f").onsubmit = async (ev) => {
      ev.preventDefault();
      const b = ev.submitter || $("#f button[type=submit]");
      const ka = $("#ka"), s = $("#s");
      if (ka && !ka.value.trim()) { $("#e").textContent = "Kullanıcı adını yaz."; ka.focus(); return; }
      if (!s.value) { $("#e").textContent = acilMod ? "Kurulum anahtarını yaz." : "Şifreni yaz."; s.focus(); return; }
      b.disabled = true; $("#e").textContent = "";
      try {
        await api("/api/giris", { method: "POST", body: JSON.stringify(acilMod ? { sifre: s.value } : { kullanici_adi: ka.value.trim(), sifre: s.value }) });
        authedCache = null; await isAuthed(); go(urlKur("/pano"));
      } catch (e) { $("#e").textContent = e.message; b.disabled = false; s.select(); }
    };
  };
  ciz();
}

// ---------------- kullanıcılar (süper yönetici) ----------------
const OFIS_ROL_AD = { "": "Erişim yok", uye: "Üye (görür)", yonetici: "Ofis yöneticisi" };
function kullaniciAdiOner(ad) {
  return String(ad || "")
    .toLocaleLowerCase("tr-TR")
    .replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c")
    .replace(/[^a-z0-9._-]+/g, "")
    .slice(0, 32);
}
function kullaniciFormAlanlari(onek, k, uyeler) {
  const of = (k && k.ofisler) || {};
  return `
    <div class="ayar-grid">
      <div class="ayar-alan"><label for="${onek}-masa">Masa (ofislerdeki kişi)</label><select id="${onek}-masa" name="uye_id">
        <option value="">Masası yok</option>
        ${uyeler.map((u) => `<option value="${esc(u.id)}"${k && k.uye_id === u.id ? " selected" : ""}>${esc(u.ad)}</option>`).join("")}
        <option value="yeni">+ Kendi adıyla yeni masa aç</option></select>
        <p class="ayar-ipucu">Geçmiş kullanım verileri masaya bağlıdır; mevcut bir kişiyi seçersen verileri bu hesaba geçer.</p></div>
      <div class="ayar-alan"><label for="${onek}-ka">Kullanıcı adı</label><input id="${onek}-ka" name="kullanici_adi" type="text" autocorrect="off" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="Örn. alper" required value="${esc((k && k.kullanici_adi) || "")}"><p class="ayar-ipucu">Girişte kullanılır (küçük harf, boşluksuz).</p></div>
      <div class="ayar-alan"><label for="${onek}-ad">Görünen ad</label><input id="${onek}-ad" name="ad" type="text" maxlength="60" placeholder="Örn. Alper" required value="${esc((k && k.ad) || "")}"></div>
      <div class="ayar-alan"><label for="${onek}-rol">Rol</label><select id="${onek}-rol" name="rol">
        <option value="uye"${!k || k.rol !== "super" ? " selected" : ""}>Üye</option>
        <option value="super"${k && k.rol === "super" ? " selected" : ""}>Süper yönetici (her şey)</option></select></div>
    </div>
    <fieldset class="ayar-kutu-grup" data-ofis-rolleri>
      <legend>Ofis erişimi</legend>
      <div class="ayar-grid">${SAGLAYICILAR.map((p) => `<div class="ayar-alan"><label for="${onek}-of-${p.id}">${ICON[p.id]} ${esc(ofisTema(p.id).ad)}</label>
        <select id="${onek}-of-${p.id}" name="of_${p.id}">${Object.entries(OFIS_ROL_AD).map(([v, ad]) => `<option value="${v}"${(of[p.id] || "") === v ? " selected" : ""}>${ad}</option>`).join("")}</select></div>`).join("")}</div>
      <p class="ayar-ipucu">Süper yönetici tüm ofisleri zaten görür ve yönetir.</p>
    </fieldset>`;
}
function kullaniciFormOku(f) {
  const v = (n) => (f.elements[n] ? f.elements[n].value : "");
  const ofisler = {};
  for (const p of SAGLAYICILAR) if (v("of_" + p.id)) ofisler[p.id] = v("of_" + p.id);
  return { kullanici_adi: v("kullanici_adi").trim(), ad: v("ad").trim(), rol: v("rol"), uye_id: v("uye_id"), ofisler };
}
function baglantiKutusu(sonuc, kullaniciAdi) {
  if (!sonuc || !sonuc.link) return "";
  const sure = sonuc.tur === "davet" ? "7 gün" : "24 saat";
  return `<div class="link-kutu"><p style="margin:0 0 6px;font-size:13.5px"><b>@${esc(kullaniciAdi)}</b> için tek kullanımlık ${sonuc.tur === "davet" ? "şifre oluşturma" : "şifre sıfırlama"} bağlantısı (${sure} geçerli, ${dTime(sonuc.son)} tarihine kadar):</p>${cmdBlock(sonuc.link, "Bağlantıyı kopyala")}<p class="ayar-ipucu" style="margin-top:6px">Bu bağlantıyı üyeye gönder; açıp kendi şifresini belirlediğinde bağlantı kendiliğinden kapanır.</p></div>`;
}

async function pageKullanicilar(sonEklenen = null) {
  let veri, hafta;
  try { [veri, hafta] = await Promise.all([api("/api/yonetim/kullanicilar"), api("/api/hafta")]); }
  catch (e) { if (e.message !== "giriş") showError("ayarlar", offlineMsg(e), () => pageKullanicilar()); return; }
  const uyeler = hafta.uyeler || [];
  const uyeAd = new Map(uyeler.map((u) => [u.id, u.ad]));
  const durumPill = (k) => k.durum === "aktif" ? `<span class="pill pill-ok">Aktif</span>` : k.durum === "pasif" ? `<span class="pill pill-bad">Devre dışı</span>` : `<span class="pill">Şifre bekliyor</span>`;
  shell("ayarlar", `
    ${ayarUstBolum("kullanicilar")}
    <section class="card" aria-labelledby="h-yeni-k">
      <h2 id="h-yeni-k">Yeni üye ekle</h2>
      <p class="card-sub">Kullanıcı adını ve ofis yetkilerini seçip oluşturduğunda ekranda <b>tek kullanımlık şifre oluşturma bağlantısı</b> üretilir (7 gün geçerli). Bağlantıyı kopyalayıp o kişiye iletmen yeterli; haricî e-posta servisi gerekmez.</p>
      <form id="f-yeni-k" method="POST" action="/api/yonetim/kullanici" aria-labelledby="h-yeni-k">
        ${kullaniciFormAlanlari("yk", null, uyeler)}
        <div class="durum-satir"><button class="btn btn-ink" type="submit">Üyeyi ekle ve bağlantı üret</button><span class="kayit-durum" id="yk-durum" role="status" aria-live="polite">${sonEklenen ? `✓ @${esc(sonEklenen.ka)} eklendi.` : ""}</span></div>
        <div id="yk-sonuc">${sonEklenen ? baglantiKutusu(sonEklenen.baglanti, sonEklenen.ka) : ""}</div>
      </form>
    </section>

    <section class="card" aria-labelledby="h-kullanicilar">
      <h2 id="h-kullanicilar">Kullanıcılar (${veri.kullanicilar.length})</h2>
      <p class="card-sub">Her kullanıcı kendi kullanıcı adı ve şifresiyle girer; profilini, şifresini ve kendi bilgisayarlarını Hesabım sayfasından yönetir. Ofis erişimi o ofisi görmesini, ofis yöneticiliği ise o ofisin kadrosunu, paylarını ve simülasyonunu yönetmesini sağlar.</p>
      ${veri.kullanicilar.length ? `<div class="table-wrap" tabindex="0" role="region" aria-labelledby="h-kullanicilar"><table class="yigin-tablo kullanici-tablo" style="--l2:'Erişim';--l3:'Durum';--l4:'İşlem'">
        <thead><tr><th scope="col">Kullanıcı</th><th scope="col">Erişim</th><th scope="col">Durum</th><th scope="col">İşlem</th></tr></thead>
        <tbody>${veri.kullanicilar.map((k) => `<tr>
          <th scope="row"><b>${esc(k.ad || "—")}</b>${k.id === veri.ben ? ` <span class="pill rol-pill">sen</span>` : ""}<br><small class="muted">@${esc(k.kullanici_adi)}</small>${k.uye_id ? `<br><small class="muted">Masa: ${esc(uyeAd.get(k.uye_id) || "silinmiş")}</small>` : ""}</th>
          <td>${k.rol === "super" ? `<span class="pill pill-accent rol-pill">${ICON.shield}<span>Süper yönetici</span></span>` : `<div class="ofis-rolleri">${SAGLAYICILAR.filter((p) => k.ofisler[p.id]).map((p) => `<span class="pill rol-pill ${k.ofisler[p.id] === "yonetici" ? "pill-accent" : ""}">${ICON[p.id]}<span>${esc(p.ad)}${k.ofisler[p.id] === "yonetici" ? " · yönetici" : ""}</span></span>`).join("") || `<span class="muted">Ofis erişimi yok</span>`}</div>`}</td>
          <td>${durumPill(k)}${k.son_giris ? `<br><small class="muted">Son giriş ${dTime(k.son_giris)}</small>` : ""}${k.bekleyen ? `<br><small class="muted">${k.bekleyen.tur === "davet" ? "Davet" : "Sıfırlama"} bağlantısı ${dTime(k.bekleyen.son)} tarihine kadar geçerli</small>` : ""}</td>
          <td><div style="display:flex;flex-wrap:wrap;gap:6px">
            <button type="button" class="btn btn-plain btn-sm" data-k-duzenle="${esc(k.id)}">Düzenle</button>
            ${k.durum !== "pasif" ? `<button type="button" class="btn btn-plain btn-sm" data-k-baglanti="${esc(k.id)}">${k.durum === "davetli" ? "Davet bağlantısı üret" : "Şifre sıfırlama bağlantısı"}</button>` : ""}
            ${k.durum === "aktif" ? `<button type="button" class="btn btn-plain btn-sm" data-k-oturum="${esc(k.id)}">Oturumlarını kapat</button>` : ""}
            ${k.id !== veri.ben ? `<button type="button" class="btn btn-danger btn-sm" data-k-sil="${esc(k.id)}">Sil</button>` : ""}
          </div><div data-k-sonuc="${esc(k.id)}" role="status" aria-live="polite"></div></td>
        </tr>`).join("")}</tbody></table></div>` : `<p class="muted">Henüz kullanıcı yok.</p>`}
    </section>`, { authed: true });

  const masaSec = $("#yk-masa"), kaGirdi = $("#yk-ka"), adGirdi = $("#yk-ad");
  let otoAd = "", otoKa = "";
  masaSec.onchange = () => {
    const ad = uyeAd.get(masaSec.value);
    if (!ad) return;
    if (!adGirdi.value.trim() || adGirdi.value === otoAd) { adGirdi.value = ad; otoAd = ad; }
    const oner = kullaniciAdiOner(ad);
    if (oner && (!kaGirdi.value.trim() || kaGirdi.value === otoKa)) { kaGirdi.value = oner; otoKa = oner; }

  $("#f-yeni-k").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, dr = $("#yk-durum"), b = e.submitter || $("button[type=submit]", f);
    const v = kullaniciFormOku(f);
    if (!v.kullanici_adi || v.kullanici_adi.length < 2) { durumYaz(dr, "En az 2 karakterlik bir kullanıcı adı yaz.", true); f.elements.kullanici_adi.focus(); return; }
    if (!v.ad) { durumYaz(dr, "Görünen adı yaz.", true); f.elements.ad.focus(); return; }
    b.disabled = true; durumYaz(dr, "Oluşturuluyor…");
    try {
      const r = await api("/api/yonetim/kullanici", { method: "POST", body: JSON.stringify(v) });
      pageKullanicilar({ ka: r.kullanici_adi, baglanti: r.baglanti });
    } catch (er) { durumYaz(dr, er.message, true); b.disabled = false; }
  };
  const kul = (id) => veri.kullanicilar.find((x) => x.id === id);

    b.onclick = async () => {
      const k = kul(b.dataset.kBaglanti), kutu = $(`[data-k-sonuc="${CSS.escape(k.id)}"]`);
      b.disabled = true;
      try { const r = await api("/api/yonetim/kullanici-baglanti", { method: "POST", body: JSON.stringify({ id: k.id }) }); kutu.innerHTML = baglantiKutusu(r, k.kullanici_adi); }
      catch (er) { kutu.innerHTML = `<p class="err">${esc(er.message)}</p>`; }
      b.disabled = false;
    };
  });
  document.querySelectorAll("[data-k-oturum]").forEach((b) => {
    b.onclick = async () => {
      const kutu = $(`[data-k-sonuc="${CSS.escape(b.dataset.kOturum)}"]`);
      b.disabled = true;
      try { await api("/api/yonetim/kullanici-oturum-kapat", { method: "POST", body: JSON.stringify({ id: b.dataset.kOturum }) }); kutu.innerHTML = `<p class="ok" style="margin:6px 0 0">Tüm oturumları kapatıldı.</p>`; }
      catch (er) { kutu.innerHTML = `<p class="err">${esc(er.message)}</p>`; }
      b.disabled = false;
    };
  });
  document.querySelectorAll("[data-k-sil]").forEach((b) => {
    b.onclick = () => {
      const k = kul(b.dataset.kSil);
      const dlg = document.createElement("dialog");
      dlg.setAttribute("aria-labelledby", "ks-b");
      dlg.innerHTML = `<h2 id="ks-b">${esc(k.ad || "@" + k.kullanici_adi)} silinsin mi?</h2><p>Hesap ve girişleri kaldırılır. Masası, bilgisayarları ve geçmiş kullanım verileri <b>silinmez</b>; istersen daha sonra yeni bir hesaba bağlayabilirsin.</p>
        <p class="err" id="ks-e" role="alert"></p><div class="actions"><button type="button" class="btn btn-plain" id="ks-v" autofocus>Vazgeç</button><button type="button" class="btn btn-solid-danger" id="ks-o">Hesabı sil</button></div>`;
      document.body.appendChild(dlg);
      dlg.addEventListener("close", () => dlg.remove());
      $("#ks-v", dlg).onclick = () => dlg.close();
      $("#ks-o", dlg).onclick = async (ev) => {
        ev.target.disabled = true;
        try { await api("/api/yonetim/kullanici-sil", { method: "POST", body: JSON.stringify({ id: k.id }) }); dlg.close(); pageKullanicilar(); }
        catch (er) { $("#ks-e", dlg).textContent = er.message; ev.target.disabled = false; }
      };
      dlg.showModal();
    };
  });
  document.querySelectorAll("[data-k-duzenle]").forEach((b) => {
    b.onclick = () => {
      const k = kul(b.dataset.kDuzenle);
      const dlg = document.createElement("dialog");
      dlg.setAttribute("aria-labelledby", "kd-b");
      dlg.style.maxWidth = "720px";
      dlg.innerHTML = `<h2 id="kd-b">${esc(k.ad || "@" + k.kullanici_adi)} düzenle</h2>
        <form id="f-kd" method="POST" action="/api/yonetim/kullanici">
          ${kullaniciFormAlanlari("kd", k, uyeler)}
          ${k.id !== veri.ben ? `<label class="ak-etiket" for="kd-pasif"><input type="checkbox" id="kd-pasif" class="ak-kutu"${k.durum === "pasif" ? " checked" : ""}><span>Hesabı devre dışı bırak<span class="ak-aciklama">Giriş yapamaz, açık oturumları kapanır. Verileri silinmez.</span></span></label>` : ""}
          <p class="err" id="kd-e" role="alert"></p>
          <div class="actions"><button type="button" class="btn btn-plain" id="kd-v">Vazgeç</button><button type="submit" class="btn btn-ink">Kaydet</button></div>
        </form>`;
      document.body.appendChild(dlg);
      dlg.addEventListener("close", () => dlg.remove());
      const ilkAlan = $("#kd-ka", dlg); if (ilkAlan) ilkAlan.setAttribute("autofocus", "");
      $("#kd-v", dlg).onclick = () => dlg.close();
      $("#f-kd", dlg).onsubmit = async (ev) => {
        ev.preventDefault();
        const v = kullaniciFormOku(ev.target);
        const pasif = $("#kd-pasif", dlg);
        const govde = { id: k.id, ...v };
        if (pasif) govde.durum = pasif.checked ? "pasif" : (k.durum === "pasif" ? "aktif" : k.durum);
        const sb = ev.submitter || $("button[type=submit]", dlg); sb.disabled = true;
        try { await api("/api/yonetim/kullanici", { method: "POST", body: JSON.stringify(govde) }); dlg.close(); if (k.id === veri.ben) { authedCache = null; await isAuthed(); } pageKullanicilar(); }
        catch (er) { $("#kd-e", dlg).textContent = er.message; sb.disabled = false; }
      };
      dlg.showModal();
    };
  });
}

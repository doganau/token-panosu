      <b><i class="dot ${state}"></i><span class="dl-ad">${esc(grp.ad)}</span></b><span class="dl-alt"><span class="amt">${money(grp.usd)}</span>${uyariHtml}</span>${uyariHtml ? "" : durumHtml}</a>`;
    }
    const gosterDevs = devs.slice(0, 3);
    const kalanDev = devs.length - gosterDevs.length;
    if (demoMu) {
      return `<button type="button" class="desk-label multi" data-demo-grp="${esc(grp.id)}" ${veriAttr} aria-label="${esc(grp.ad)}, ${money(grp.usd)}, ${devs.length} bilgisayar" style="${pos}">
      <b><i class="dot ${state}"></i><span class="dl-ad">${esc(grp.ad)}</span></b><span class="dl-alt"><span class="amt">${money(grp.usd)}</span>${uyariHtml}</span>${uyariHtml ? "" : durumHtml}
      <span class="dvs">${gosterDevs.map((dev, i) => `<span><i class="dot ${ds[i].state}"></i><span>${esc(dev.label)}</span></span>`).join("")}${kalanDev > 0 ? `<small>+${kalanDev}</small>` : ""}</span></button>`;
    }
    return `<div class="desk-label multi" data-dev="${devs[0].id}" ${veriAttr} role="link" tabindex="0" aria-label="${esc(grp.ad)}, ${money(grp.usd)}, ${devs.length} bilgisayar" style="${pos}">
      <b><i class="dot ${state}"></i><span class="dl-ad">${esc(grp.ad)}</span></b><span class="dl-alt"><span class="amt">${money(grp.usd)}</span>${uyariHtml}</span>${uyariHtml ? "" : durumHtml}
      <span class="dvs">${gosterDevs.map((dev, i) => `<a href="/pano/bilgisayar/${dev.id}${location.search}" data-link aria-label="${esc(dev.label)}, ${money(perDev.get(dev.id)?.usd || 0)}"><i class="dot ${ds[i].state}"></i><span>${esc(dev.label)}</span></a>`).join("")}${kalanDev > 0 ? `<small>+${kalanDev}</small>` : ""}</span></div>`;
  }).join("");
  const sb = saglayiciBilgi(sglOfis);
  const molaYazi = vakit.uykuVakti ? "Oturan: çalışıyor · Diğerleri: uykuda" : "Oturan: çalışıyor · Gezen: mola";
  const dayakYazi = asanlar.size && ofisAyar.dayakAktif !== false ? `<span>Payı aşana müdahale var</span>` : "";
  const ayarDugme = demoMu ? "" : `<a href="${urlKur("/pano/ayarlar/ofis")}" data-link class="ofis-duraklat" style="text-decoration:none">Ayarlar</a>`;
  const altIpucu = demoMu
    ? `<span class="hide-sm">Masaya veya kişiye${ofisAyar.kediAktif === false ? "" : "/kediye"} tıkla: canlı tepki · Senaryoyu üstten değiştir</span>`
    : `<span class="hide-sm">Masaya tıkla: detay · Kişiye${ofisAyar.kediAktif === false ? "" : "/kediye"} tıkla: tepki</span>`;
  return `<section class="office-stage${OFIS.duraklatildi ? " duraklatildi" : ""}" data-ofis="${esc(sglOfis)}" aria-labelledby="h-ofis">
    <div class="office-topbar"><h2 id="h-ofis"><i class="ofis-rozet" aria-hidden="true"></i><span>${esc(tema.ad)}</span><span class="hide-xs"> · Canlı Simülasyon</span></h2><div class="office-topbar-sag"><small>${groups.length} masa · ${groups.reduce((a, g) => a + g.devs.length, 0)} bilgisayar</small><span class="ofis-aksiyonlar"><button type="button" class="ofis-duraklat ofis-yakin-btn" id="ofis-yakin" aria-pressed="${OFIS.yakin ? "true" : "false"}">${OFIS.yakin ? "Sığdır" : "Yakınlaştır"}</button>${ayarDugme}<button type="button" class="ofis-duraklat" id="ofis-duraklat">${OFIS.duraklatildi ? "Oynat" : "Duraklat"}</button></span></div></div>
    <div class="office-cerceve${OFIS.yakin ? " yakin" : ""}" id="ofis-cerceve"><div class="office${groups.length > 5 ? " many" : ""}">${svg}${lbl}<div class="ofis-balonlar" aria-hidden="true"></div></div></div>
    <div class="legend"><span><i style="background:var(--screen-on)"></i>Ekran açık (son 15 dk)</span><span><i style="background:#fff;box-shadow:inset 0 0 0 1px var(--line)"></i>Kâğıt yığını: harcama</span><span>${molaYazi}</span>${dayakYazi}<span class="only-sm"><i class="dot stale"></i>Veri gelmiyor</span>${d.devices.some((x) => isSus(x, sglOfis)) ? `<span><i class="dot bad"></i>Şüpheli uyarı</span>` : ""}${altIpucu}</div>
  </section>`;
}

// Limit payını aşan gruplar (bu hafta, en güncel okumaya göre): panodaki çubukların hesabıyla aynı.
// Dönüş: grup kimliği -> payını yüzde kaç puan aştığı (haftalık ve Fable'dan büyük olanı) = dayak seviyesi
function payAsanlar(d, groups) {
  const out = new Map();
  const L = d.limit;
  if (d.start !== d.current || !L || !groups.length) return out;
  const ayar = d.ayar || SON_AYAR;
  const payMap = grupPaylari(groups, ayar);
  const tolerans = ayar && ayar.ofis && Number.isFinite(ayar.ofis.asimEsik) ? ayar.ofis.asimEsik : 0;
  const grupOf = new Map();
  for (const g of groups) { g._f = 0; for (const x of g.devs) grupOf.set(x.id, g); }
  for (const r of d.usage || []) if (FABLE_RE.test(r.model) && grupOf.has(r.device_id)) grupOf.get(r.device_id)._f += r.usd;
  const toplam = groups.reduce((a, g) => a + g.usd, 0), toplamF = groups.reduce((a, g) => a + g._f, 0);
  const ham = L.ham || {};
  const fk = Object.keys(ham).find((k) => FABLE_RE.test(k) && k.endsWith("used_percentage") && Number.isFinite(ham[k]));
  const ekle = (id, kullanilan, hak) => {
    const sinir = hak + tolerans;
    if (kullanilan >= sinir - 0.005) out.set(id, Math.max(out.get(id) || 0, kullanilan - hak));
  };
  for (const g of groups) {
    const hak = payMap.get(g.id) || 0;
    if (hak <= 0 && (g.usd > 0 || g._f > 0)) {
      if (L.pct !== null && L.pct !== undefined && toplam > 0 && g.usd > 0) ekle(g.id, L.pct * (g.usd / toplam), 0);
      if (fk && toplamF > 0 && g._f > 0) ekle(g.id, ham[fk] * (g._f / toplamF), 0);
      continue;
    }
    if (L.pct !== null && L.pct !== undefined && toplam > 0) ekle(g.id, L.pct * (g.usd / toplam), hak);
    if (fk && toplamF > 0) ekle(g.id, ham[fk] * (g._f / toplamF), hak);
  }
  return out;
}

// İzometrik kutular için döngüsüz topolojik derinlik sıralaması (A, B'nin arkasındaysa önce çizilir)
function izoSirala(kutular) {
  const n = kutular.length;
  const ileri = Array.from({ length: n }, () => []);
  const derece = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const A = kutular[i];
    for (let j = i + 1; j < n; j++) {
      const B = kutular[j];
      // Ekran yatay izdüşümleri ayrık olan çapraz çeyrekleri atla (döngü oluşmasını kesin olarak önler)
      if ((A.x2 <= B.x1 && B.y2 <= A.y1) || (B.x2 <= A.x1 && A.y2 <= B.y1)) continue;
      const aArkada = A.x2 <= B.x1 + 0.02 || A.y2 <= B.y1 + 0.02;
      const bArkada = B.x2 <= A.x1 + 0.02 || B.y2 <= A.y1 + 0.02;
      let iOnce;
      if (aArkada && !bArkada) iOnce = true;
      else if (bArkada && !aArkada) iOnce = false;
      else iOnce = (A.x1 + A.x2 + A.y1 + A.y2) <= (B.x1 + B.x2 + B.y1 + B.y2);
      if (iOnce) { ileri[i].push(j); derece[j]++; }
      else { ileri[j].push(i); derece[i]++; }
    }
  }
  const hazir = [];
  for (let i = 0; i < n; i++) if (derece[i] === 0) hazir.push(i);
  const sonuc = [];
  while (hazir.length) {
    hazir.sort((a, b) => (kutular[a].x1 + kutular[a].y1) - (kutular[b].x1 + kutular[b].y1));
    const u = hazir.shift();
    sonuc.push(kutular[u]);
    for (const v of ileri[u]) if (--derece[v] === 0) hazir.push(v);
  }
  if (sonuc.length < n) {
    for (let i = 0; i < n; i++) if (!sonuc.includes(kutular[i])) sonuc.push(kutular[i]);
  }
  return sonuc;
}

// Kişinin eklemli kol, bacak, gövde, kafa ve yüz ifadelerini o anki duruma göre hesaplar
function kisiPozGuncelle(s, t) {
  const P = s.parca;
  const masaOtur = s.mod === "otur";
  const kanepeOtur = s.mod === "kanepeOtur";
  const yatakGorunum = s.mod === "yatakUyu" || ((s.mod === "yatakYerles" || s.mod === "yatakKalkis") && (s.gecisOran || 0) >= 0.55);

  if (yatakGorunum) {
    const nefes = Math.sin(t * 1.35 + s.faz0) * 0.46;
    if (P.uyuGovde) P.uyuGovde.setAttribute("transform", `translate(0 ${nefes.toFixed(2)})`);
    return;
  }

  if (masaOtur) {
    const dayak = s.dayakYiyor;
    const hiz = dayak ? 18 : 11;
    const mola = !dayak && Math.sin(t * 0.7 + s.faz0) > 0.72; // ara sıra ekrandan okuma molası
    const farede = !dayak && !mola && Math.sin(t * 0.45 + s.faz0 * 2) > 0.65;
    const t1 = mola ? 0 : Math.sin(t * hiz + s.faz0) * (dayak ? 3.5 : 1.5);
    const t2 = mola ? 0 : Math.cos(t * hiz * 1.13 + s.faz0) * (dayak ? 3.5 : 1.5);

    if (dayak) {
      // Başını koruyarak sağa sola titreme
      const tit = Math.sin(t * 38) * 1.6;
      P.ogovde.setAttribute("transform", `translate(${tit.toFixed(1)} 1.5) rotate(-5)`);
      P.otUk1.setAttribute("d", uzuv(-4.2, -21, 3.5, -31 + t1 * 0.5, 2.2, 1.9));
      P.otAk1.setAttribute("d", uzuv(3.5, -31 + t1 * 0.5, 2.2, -39, 1.9, 1.5));
      P.otEl1.setAttribute("cx", "2.2"); P.otEl1.setAttribute("cy", "-39");
      P.otUk2.setAttribute("d", uzuv(4.6, -20, 10.2, -29 + t2 * 0.5, 2.3, 1.9));
      P.otAk2.setAttribute("d", uzuv(10.2, -29 + t2 * 0.5, 6.2, -37.5, 1.9, 1.55));
      P.otEl2.setAttribute("cx", "6.2"); P.otEl2.setAttribute("cy", "-37.5");
      P.obas.setAttribute("transform", `translate(1.2 2.2) rotate(-8)`);
    } else {
      const nefes = Math.sin(t * 2.1 + s.faz0) * 0.45;
      P.ogovde.setAttribute("transform", `translate(0 ${nefes.toFixed(2)})`);
      // Sol kol (arka, klavyenin sol tarafında)
      const s1x = -2.5, s1y = -22, e1x = 5.5, e1y = -24.5, h1x = 13.8, h1y = -26.2 + t1;
      P.otUk1.setAttribute("d", uzuv(s1x, s1y, e1x, e1y, 2.15, 1.85));
      P.otAk1.setAttribute("d", uzuv(e1x, e1y, h1x, h1y, 1.85, 1.45));
      P.otEl1.setAttribute("cx", h1x.toFixed(1)); P.otEl1.setAttribute("cy", h1y.toFixed(1));
      // Sağ kol (ön, klavyede ya da fareye uzanmış)
      const s2x = 4.6, s2y = -19.5;
      const e2x = farede ? 12.2 : 11.2, e2y = farede ? -17.2 : -19.2;
      const h2x = farede ? 20.6 + Math.sin(t * 3) * 0.9 : 18.2, h2y = farede ? -17.6 : -20.8 + t2;
      P.otUk2.setAttribute("d", uzuv(s2x, s2y, e2x, e2y, 2.3, 1.95));
      P.otAk2.setAttribute("d", uzuv(e2x, e2y, h2x, h2y, 1.95, 1.5));
      P.otEl2.setAttribute("cx", h2x.toFixed(1)); P.otEl2.setAttribute("cy", h2y.toFixed(1));
      const bak = Math.sin(t * 0.85 + s.faz0) * 3.2;
      P.obas.setAttribute("transform", `rotate(${bak.toFixed(1)} 0.5 -29)`);
    }
    return;
  }

  // Ayakta / yürürken / kanepede otururken / döverken eklem kinematiği
  const yuru = s.yuruAgirlik || 0;
  const faz = s.adimFaz || 0;
  const dov = s.mod === "dov";
  const konusuyor = !!s.balonMetin;
  const bardakli = s.bardakBit > t && !dov;
  const tahtada = s.tahtaBit > t && yuru < 0.2 && !dov;

  let bob = -Math.abs(Math.sin(faz)) * 1.85 * yuru + Math.sin(t * 2.2 + s.faz0) * 0.38 * (1 - yuru);
  if (dov) bob = -Math.abs(Math.sin(t * 11 + s.faz0)) * 2.2;
  if (kanepeOtur) bob = 10.8 + Math.sin(t * 1.8 + s.faz0) * 0.25;

  // Bacak eklemleri: (kalça -> diz -> bilek)
  let h1x = -2.5, h1y = -25.6 + bob, k1x, k1y, a1x, a1y, aci1 = 0;
  let h2x = 2.3, h2y = -25.8 + bob, k2x, k2y, a2x, a2y, aci2 = 0;

  if (kanepeOtur) {
    // Kanepede öne-sağa uzanan bacaklar
    k1x = 6.2; k1y = -13.2; a1x = 7.4; a1y = -1.6;
    k2x = 9.4; k2y = -14.2; a2x = 10.6; a2y = -2.4;
  } else {
    const adim1 = Math.sin(faz) * yuru + (dov ? Math.sin(t * 11 + s.faz0) * 0.35 : 0);
    const adim2 = -adim1;
    const kal1 = Math.max(0, Math.cos(faz)) * yuru;
    const kal2 = Math.max(0, -Math.cos(faz)) * yuru;
    a1x = h1x + adim1 * 6.8; a1y = -2.2 - kal1 * 3.4;
    a2x = h2x + adim2 * 6.8; a2y = -2.5 - kal2 * 3.4;
    k1x = (h1x + a1x) * 0.5 + (1.3 + kal1 * 2.4) * yuru; k1y = (h1y + a1y) * 0.5 - 0.6 * kal1;
    k2x = (h2x + a2x) * 0.5 + (1.3 + kal2 * 2.4) * yuru; k2y = (h2y + a2y) * 0.5 - 0.6 * kal2;
    aci1 = -adim1 * 14; aci2 = -adim2 * 14;
  }

  // Kol eklemleri: (omuz -> dirsek -> el bileği)
  const s1x = -5.4, s1y = -44.2 + bob, s2x = 5.2, s2y = -44.2 + bob;
  let e1x, e1y, w1x, w1y, e2x, e2y, w2x, w2y;
  const kolSal = -Math.sin(faz) * 5.4 * yuru;

  if (dov) {
    // Enerjik yumruk ve kol sallama
    const p1 = Math.sin(t * 15 + s.faz0), p2 = Math.cos(t * 15 + s.faz0);
    e1x = s1x + 4.5 + p1 * 2.5; e1y = s1y - 2 - p1 * 3;
    w1x = s1x + 11.5 + p1 * 5.2; w1y = s1y - 5.5 - p1 * 5.5;
    e2x = s2x + 4.2 + p2 * 2.5; e2y = s2y - 2.5 - p2 * 3;
    w2x = s2x + 11.2 + p2 * 5.2; w2y = s2y - 6 - p2 * 5.5;
  } else if (tahtada) {
    // Beyaz tahtada şemayı işaret etme
    const isaret = Math.sin(t * 3.4 + s.faz0) * 2.4;
    e1x = s1x + 2.5; e1y = s1y + 6.5; w1x = s1x + 4.2; w1y = s1y + 12.5;
    e2x = s2x + 4.2; e2y = s2y - 2.5; w2x = s2x + 9.4; w2y = s2y - 9.2 + isaret;
  } else {
    // Normal kol salınımı + kahve bardağı tutma / yudumlama + konuşurken doğal el jesti
    e1x = s1x - 0.8 + kolSal * 0.45; e1y = s1y + 7.6;
    w1x = s1x + 0.8 + kolSal; w1y = s1y + 14.8 - Math.abs(kolSal) * 0.18;
    e2x = s2x - 0.4 - kolSal * 0.45; e2y = s2y + 7.5;
    w2x = s2x + 1.1 - kolSal; w2y = s2y + 14.6 - Math.abs(kolSal) * 0.18;

    if (kanepeOtur) {
      e1x = s1x + 1.2; e1y = s1y + 7.2; w1x = s1x + 5.8; w1y = s1y + 11.5;
      e2x = s2x + 1.8; e2y = s2y + 6.8; w2x = s2x + 6.5; w2y = s2y + 10.8;
    }
    if (bardakli) {
      const yudum = Math.max(0, Math.sin(t * 0.95 + s.faz0) - 0.55) * 2.2; // ara sıra ağza götürür
      e1x = s1x + 1.6; e1y = s1y + 6.8 - yudum * 1.8;
      w1x = s1x + 6.8; w1y = s1y + 3.2 - yudum * 8.5;
    } else if (konusuyor && yuru < 0.25) {
      const jest = Math.sin(t * 5.2 + s.faz0);
      e1x = s1x + 1.5; e1y = s1y + 6.6;
      w1x = s1x + 6.6 + jest * 1.8; w1y = s1y + 5.5 - Math.abs(jest) * 2.6;
    }
  }

  if (!s.arka) {
    P.govde.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
    P.ub1.setAttribute("d", uzuv(h1x, h1y, k1x, k1y, 2.75, 2.2));
    P.ab1.setAttribute("d", uzuv(k1x, k1y, a1x, a1y, 2.2, 1.65));
    P.pb1.setAttribute("transform", ayakkabiYol(a1x, a1y, aci1));
    P.ub2.setAttribute("d", uzuv(h2x, h2y, k2x, k2y, 2.65, 2.1));
    P.ab2.setAttribute("d", uzuv(k2x, k2y, a2x, a2y, 2.1, 1.6));
    P.pb2.setAttribute("transform", ayakkabiYol(a2x, a2y, aci2));

    P.uk1.setAttribute("d", uzuv(s1x, s1y, e1x, e1y, 2.35, 1.9));
    P.ak1.setAttribute("d", uzuv(e1x, e1y, w1x, w1y, 1.9, 1.45));
    P.el1.setAttribute("cx", w1x.toFixed(1)); P.el1.setAttribute("cy", w1y.toFixed(1));
    P.uk2.setAttribute("d", uzuv(s2x, s2y, e2x, e2y, 2.2, 1.8));
    P.ak2.setAttribute("d", uzuv(e2x, e2y, w2x, w2y, 1.8, 1.4));
    P.el2.setAttribute("cx", w2x.toFixed(1)); P.el2.setAttribute("cy", w2y.toFixed(1));

    if (bardakli) {
      P.bardak.style.display = "inline";
      P.bardak.setAttribute("transform", `translate(${(w1x + 1.2).toFixed(1)} ${(w1y - 0.6).toFixed(1)})`);
    } else {
      P.bardak.style.display = "none";
    }

    // Yüz ifadeleri: göz kırpma, konuşurken ağız hareketi, kızgın/normal kaş ve hafif kafa salınımı
    const kirp = (t + s.faz0 * 1.7) % 4.6 < 0.13;
    P.gozler.setAttribute("transform", kirp ? "translate(0 -56.3) scale(1 0.12) translate(0 56.3)" : "");
    if (dov) {
      P.kas.setAttribute("d", "M0.6 -58.9 l2.4 0.9 M6.2 -58.9 l-2.2 0.9");
      P.agiz.setAttribute("d", Math.sin(t * 12) > 0 ? "M2.0 -52.3 h3.0 v1.5 h-3.0z" : "M2.1 -51.6 q1.5 -1 2.9 0");
    } else if (konusuyor) {
      P.kas.setAttribute("d", "M0.7 -58.7 q1.2 -0.8 2.3 -0.2 M4.0 -58.7 q1.1 -0.8 2.1 -0.2");
      const acik = Math.abs(Math.sin(t * 8.5 + s.faz0)) > 0.45;
      P.agiz.setAttribute("d", acik ? "M2.2 -52.2 q1.4 1.9 2.7 0 q-1.3 -0.5 -2.7 0z" : "M2.1 -52.0 q1.5 0.9 2.9 0");
    } else {
      P.kas.setAttribute("d", "M0.7 -58.4 q1.2 -0.6 2.3 -0.1 M4.0 -58.4 q1.1 -0.6 2.1 -0.1");
      P.agiz.setAttribute("d", "M2.1 -52.1 q1.5 1.1 2.9 0");
    }
    const kafaEg = konusuyor ? Math.sin(t * 3.1 + s.faz0) * 2.4 : Math.sin(t * 1.2 + s.faz0) * 1.1;
    P.kafa.setAttribute("transform", `rotate(${kafaEg.toFixed(1)} 0 -50)`);
  } else {
    P.govdeB.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
    P.ub1b.setAttribute("d", uzuv(h1x, h1y, k1x, k1y, 2.65, 2.1));
    P.ab1b.setAttribute("d", uzuv(k1x, k1y, a1x, a1y, 2.1, 1.6));
    P.pb1b.setAttribute("transform", ayakkabiYol(a1x, a1y, aci1));
    P.ub2b.setAttribute("d", uzuv(h2x, h2y, k2x, k2y, 2.75, 2.2));
    P.ab2b.setAttribute("d", uzuv(k2x, k2y, a2x, a2y, 2.2, 1.65));
    P.pb2b.setAttribute("transform", ayakkabiYol(a2x, a2y, aci2));

    P.uk1b.setAttribute("d", uzuv(s1x, s1y, e1x, e1y, 2.2, 1.8));
    P.ak1b.setAttribute("d", uzuv(e1x, e1y, w1x, w1y, 1.8, 1.4));
    P.el1b.setAttribute("cx", w1x.toFixed(1)); P.el1b.setAttribute("cy", w1y.toFixed(1));
    P.uk2b.setAttribute("d", uzuv(s2x, s2y, e2x, e2y, 2.35, 1.9));
    P.ak2b.setAttribute("d", uzuv(e2x, e2y, w2x, w2y, 1.9, 1.45));
    P.el2b.setAttribute("cx", w2x.toFixed(1)); P.el2b.setAttribute("cy", w2y.toFixed(1));
    const kafaEg = tahtada ? Math.sin(t * 2.6) * 3 : Math.sin(t * 1.2 + s.faz0) * 1.2;
    P.kafaB.setAttribute("transform", `rotate(${kafaEg.toFixed(1)} 0 -50)`);
  }
}

// Masa üstü HTML kartlarını sahne sınırları içinde tutar ve birbirine değenleri yumuşakça ayırır
function masaEtiketYerlestir(offEl) {
  if (!offEl) return [];
  const offW = offEl.clientWidth || 0, offH = offEl.clientHeight || 0;
  if (offW < 40 || offH < 40) return [];
  const kartlar = [...offEl.querySelectorAll(".desk-label")].map((dl) => {
    const w = dl.offsetWidth || 72, h = dl.offsetHeight || 32;
    const ax = (parseFloat(dl.dataset.ax || "50") / 100) * offW;
    const ay = (parseFloat(dl.dataset.ay || "50") / 100) * offH;
    const minCx = Math.min(offW * 0.5, w * 0.5 + 3), maxCx = Math.max(offW * 0.5, offW - w * 0.5 - 3);
    const minAltY = Math.min(offH - 4, h + 3), maxAltY = Math.max(minAltY, offH - 5);
    return {
      dl, w, h, ax, ay, minCx, maxCx, minAltY, maxAltY,
      cx: Math.max(minCx, Math.min(maxCx, ax)),
      altY: Math.max(minAltY, Math.min(maxAltY, ay)),
    };
  });
  const padX = offW < 480 ? 4 : 6, padY = offW < 480 ? 3 : 5;
  const yatayKaydir = (A, B, yon, miktar) => {
    const hedefA = A.cx - yon * miktar * 0.52, yeniA = Math.max(A.minCx, Math.min(A.maxCx, hedefA));
    const tasindiA = Math.abs(yeniA - A.cx);
    A.cx = yeniA;
    const kalan = Math.max(0, miktar - tasindiA);
    const yeniB = Math.max(B.minCx, Math.min(B.maxCx, B.cx + yon * kalan));
    const tasindiB = Math.abs(yeniB - B.cx);
    B.cx = yeniB;
    if (tasindiA + tasindiB < miktar - 0.1) {
      A.cx = Math.max(A.minCx, Math.min(A.maxCx, A.cx - yon * (miktar - tasindiA - tasindiB)));
    }
    return Math.abs(A.cx - yeniA) + tasindiA + tasindiB;
  };
  const dikeyKaydir = (A, B, vYon, miktar) => {
    const hedefA = A.altY - vYon * miktar * 0.52, yeniA = Math.max(A.minAltY, Math.min(A.maxAltY, hedefA));
    const tasindiA = Math.abs(yeniA - A.altY);
    A.altY = yeniA;
    const kalan = Math.max(0, miktar - tasindiA);
    const yeniB = Math.max(B.minAltY, Math.min(B.maxAltY, B.altY + vYon * kalan));
    const tasindiB = Math.abs(yeniB - B.altY);
    B.altY = yeniB;
    if (tasindiA + tasindiB < miktar - 0.1) {
      A.altY = Math.max(A.minAltY, Math.min(A.maxAltY, A.altY - vYon * (miktar - tasindiA - tasindiB)));
    }
    return tasindiA + tasindiB;
  };
  for (let tur = 0; tur < 32; tur++) {
    let degisti = false;
    for (let i = 0; i < kartlar.length; i++) {
      const A = kartlar[i];
      for (let j = i + 1; j < kartlar.length; j++) {
        const B = kartlar[j];
        const dx = B.cx - A.cx, minDx = (A.w + B.w) * 0.5 + padX;
        const ox = minDx - Math.abs(dx);
        if (ox <= 0.1) continue;
        const dy = (B.altY - B.h * 0.5) - (A.altY - A.h * 0.5), minDy = (A.h + B.h) * 0.5 + padY;
        const oy = minDy - Math.abs(dy);
        if (oy <= 0.1) continue;
        degisti = true;
        const yon = Math.abs(dx) > 0.2 ? Math.sign(dx) : (A.ax <= B.ax ? 1 : -1);
        const vYon = Math.abs(dy) > 0.2 ? Math.sign(dy) : (A.ay <= B.ay ? 1 : -1);
        if (ox <= oy * 1.15) {
          if (yatayKaydir(A, B, yon, ox + 0.3) < ox * 0.65) dikeyKaydir(A, B, vYon, oy + 0.3);
        } else {
          if (dikeyKaydir(A, B, vYon, oy + 0.3) < oy * 0.65) yatayKaydir(A, B, yon, ox + 0.3);
        }
      }
    }
    if (!degisti) break;
  }
  return kartlar.map((k) => {
    k.dl.style.left = `${k.cx.toFixed(1)}px`;
    k.dl.style.top = `${k.altY.toFixed(1)}px`;
    const okSinir = Math.max(0, k.w * 0.5 - 8);
    const okX = Math.max(-okSinir, Math.min(okSinir, k.ax - k.cx));
    k.dl.style.setProperty("--ok-x", `${okX.toFixed(1)}px`);
    return { sol: k.cx - k.w * 0.5, sag: k.cx + k.w * 0.5, ust: k.altY - k.h, alt: k.altY };
  });
}

// ---------- canlandırma ----------
function ofisBaslat() {
  if (OFIS.ro) { OFIS.ro.disconnect(); OFIS.ro = null; }
  const S0 = OFIS.sahne, svg = document.querySelector(".office svg.scene");
  if (!S0 || !svg) return;
  const nesil = ++OFIS.nesil;
  const azHareket = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ilkAcilis = OFIS.anahtar !== S0.anahtar;
  if (ilkAcilis) { OFIS.kisiler.clear(); OFIS.kedi = null; OFIS.anahtar = S0.anahtar; }
  const katman = svg.querySelector(".kisiler"), ust = svg.querySelector(".ust-katman"), ogeG = svg.querySelector(".ogeler");
  const offEl = svg.parentElement, balonKatman = offEl.querySelector(".ofis-balonlar");
  const kanepeYuva = svg.querySelector(".kanepe-yuva");
  const ogeEl = [...ogeG.children];
  const ozelCumleler = canliCumleler(S0);
  let sahneGen = offEl.clientWidth || 800, sahneYuk = offEl.clientHeight || 450, sonBalonOffW = 0;
  OFIS.masaKutulari = masaEtiketYerlestir(offEl);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      if (nesil === OFIS.nesil && offEl.isConnected) {
        OFIS.masaKutulari = masaEtiketYerlestir(offEl);
        sonBalonOffW = 0;
      }
    }).catch(() => {});
  }

  // Yürünebilir ızgara (0.25 birim)
  const H = 0.25, GX = Math.ceil(S0.W / H), GY = Math.ceil(S0.D / H);
  const dolu = new Uint8Array(GX * GY);
  for (let i = 0; i < GX; i++) for (let j = 0; j < GY; j++) {
    const x = (i + 0.5) * H, y = (j + 0.5) * H;
    let b = x < 0.48 || y < 0.48 || x > S0.W - 0.45 || y > S0.D - 0.45;
    for (const o of S0.ogeler) if (!b && x > o.x1 - 0.12 && x < o.x2 + 0.12 && y > o.y1 - 0.12 && y < o.y2 + 0.12) b = true;
    dolu[j * GX + i] = b ? 1 : 0;
  }
  const hucre = (x, y) => [Math.max(0, Math.min(GX - 1, Math.floor(x / H))), Math.max(0, Math.min(GY - 1, Math.floor(y / H)))];
  const bos = (i, j) => i >= 0 && j >= 0 && i < GX && j < GY && !dolu[j * GX + i];
  const gorunurMu = (x, y) => { const [sx, sy] = iso(x, y, 0); const v = S0.gorunur; return sx > v.minX && sx < v.maxX && sy > v.minY && sy < v.maxY; };
  const enYakinBos = (x, y) => {
    let [i, j] = hucre(x, y);
    if (bos(i, j)) return [i, j];
    for (let r = 1; r < 14; r++) for (let di = -r; di <= r; di++) for (let dj = -r; dj <= r; dj++) if (Math.max(Math.abs(di), Math.abs(dj)) === r && bos(i + di, j + dj)) return [i + di, j + dj];
    return [i, j];
  };
  function yolBul(x1, y1, x2, y2) {
    const [si, sj] = enYakinBos(x1, y1), [ti, tj] = enYakinBos(x2, y2);
    const N = GX * GY, g = new Float32Array(N).fill(Infinity), once = new Int32Array(N).fill(-1), kapali = new Uint8Array(N);
    const acik = [[0, sj * GX + si]];
    g[sj * GX + si] = 0;
    const hh = (k) => Math.hypot((k % GX) - ti, Math.floor(k / GX) - tj);
    let bulundu = false, adim = 0;
    while (acik.length && adim++ < 20000) {
      let mi = 0;
      for (let q = 1; q < acik.length; q++) if (acik[q][0] < acik[mi][0]) mi = q;
      const [, k] = acik.splice(mi, 1)[0];
      if (kapali[k]) continue;
      kapali[k] = 1;
      const i = k % GX, j = Math.floor(k / GX);
      if (i === ti && j === tj) { bulundu = true; break; }
      for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
        if (!di && !dj) continue;
        const ni = i + di, nj = j + dj;
        if (!bos(ni, nj) || (di && dj && (!bos(i + di, j) || !bos(i, j + dj)))) continue;
        const nk = nj * GX + ni, ng = g[k] + (di && dj ? 1.414 : 1);
        if (ng < g[nk]) { g[nk] = ng; once[nk] = k; acik.push([ng + hh(nk), nk]); }
      }
    }
    if (!bulundu) return [[((ti) + 0.5) * H, ((tj) + 0.5) * H]];
    const yol = [];
    for (let k = tj * GX + ti; k !== -1 && k !== sj * GX + si; k = once[k]) yol.push([((k % GX) + 0.5) * H, (Math.floor(k / GX) + 0.5) * H]);
    yol.reverse();
    const gorus = (a, b) => { const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / (H / 2)); for (let s = 1; s < n; s++) { const [i, j] = hucre(a[0] + ((b[0] - a[0]) * s) / n, a[1] + ((b[1] - a[1]) * s) / n); if (!bos(i, j)) return false; } return true; };
    const sade = [];
    let a = [x1, y1];
    for (let q = 0; q < yol.length; q++) { if (q === yol.length - 1 || !gorus(a, yol[q + 1])) { sade.push(yol[q]); a = yol[q]; } }
    if (sade.length && bos(...hucre(x2, y2))) sade[sade.length - 1] = [x2, y2];
    return sade;
  }
  const rastgeleHedef = () => {
    for (let t = 0; t < 70; t++) {
      const x = 0.8 + Math.random() * (S0.W - 1.6), y = 0.8 + Math.random() * (S0.D - 1.6);
      const [i, j] = hucre(x, y);
      if (bos(i, j) && gorunurMu(x, y)) return [x, y];
    }
    return null;
  };

  const simdi = () => Date.now() / 1000;
  const tBas = simdi();
  const ofisAyar = S0.ofisAyar || {};
  const dayakAktif = ofisAyar.dayakAktif !== false;
  const kediAktif = ofisAyar.kediAktif !== false;
  const kediAd = String(ofisAyar.kediAd || "Tekir").trim() || "Tekir";
  const sohbetAktif = ofisAyar.sohbetAktif !== false;
  const sohbetCarpan = ofisAyar.sohbetSiklik === "az" ? 1.9 : ofisAyar.sohbetSiklik === "sik" ? 0.55 : 1;
  const geceAktif = () => !!istanbulVakit(simdi(), ofisAyar).uykuVakti;
  const basAsimVar = dayakAktif && S0.kisiler.some((x) => x.asim && x.canli);

  // Kişilerin oluşturulması ve önceki durumlarının korunması
  const kisiler = S0.kisiler.map((k, idx) => {
    let s = OFIS.kisiler.get(k.id);
    if (!s) {
      const geceUyu = geceAktif() && !k.canli && !basAsimVar;
      const h = k.canli ? null : rastgeleHedef();
      s = {
        x: h ? h[0] : k.yanasma[0], y: h ? h[1] : k.yanasma[1],
        mod: k.canli ? "otur" : "bekle", yol: [],
        bekle: geceUyu ? tBas + 0.22 + idx * 0.42 : tBas + 0.4 + (idx % 3) * 0.9,
        soz: geceUyu ? tBas + 24 + idx * 9 : tBas + (1.2 + idx * 2.8) * sohbetCarpan,
        balonBas: 0, balonBit: 0, balonMetin: "", balonGen: 0, balonYuk: 0,
        yon: 1, arka: false, adimFaz: idx * 1.7, yuruAgirlik: 0, faz0: idx * 2.1 + 0.5,
        bardakBit: 0, tahtaBit: 0, kanepeSlot: -1, yatakSlot: -1, diyalog: null,
      };
      if (k.canli) { s.x = k.koltuk[0]; s.y = k.koltuk[1]; }
      else if (geceUyu && azHareket) {
        const ys = S0.yatakSlotlar.findIndex((sl) => !sl.dolu);
        if (ys >= 0) {
          S0.yatakSlotlar[ys].dolu = k.id;
          s.yatakSlot = ys;
          s.mod = "yatakUyu";
          s.x = S0.yatakSlotlar[ys].yatak[0];
          s.y = S0.yatakSlotlar[ys].yatak[1];
        }
      }
      OFIS.kisiler.set(k.id, s);
    }
    Object.assign(s, k);
    if (s.kanepeSlot >= 0 && S0.kanepeKoltuklar[s.kanepeSlot]) S0.kanepeKoltuklar[s.kanepeSlot].dolu = s.id;
    else s.kanepeSlot = -1;
    if (s.yatakSlot >= 0 && S0.yatakSlotlar[s.yatakSlot]) S0.yatakSlotlar[s.yatakSlot].dolu = s.id;
    else s.yatakSlot = -1;

    const el = document.createElementNS("http://www.w3.org/2000/svg", "g");
    el.setAttribute("class", "kisi");
    el.innerHTML = `<title>${esc(k.ad)}</title>${kisiSvg(k.i, k.ad, k.gorunum)}`;
    const q = (sel) => el.querySelector(sel);
    s.parca = {
      yon: q(".k-yon"),
      govde: q(".k-govde"), kafa: q(".k-kafa"), gozler: q(".k-gozler"), kas: q(".k-kas"), agiz: q(".k-agiz"), bardak: q(".k-bardak"),
      uk1: q(".uz-uk1"), ak1: q(".uz-ak1"), el1: q(".uz-el1"), uk2: q(".uz-uk2"), ak2: q(".uz-ak2"), el2: q(".uz-el2"),
      ub1: q(".uz-ub1"), ab1: q(".uz-ab1"), pb1: q(".uz-pb1"), ub2: q(".uz-ub2"), ab2: q(".uz-ab2"), pb2: q(".uz-pb2"),
      govdeB: q(".k-govde-b"), kafaB: q(".k-kafa-b"),
      uk1b: q(".uz-uk1b"), ak1b: q(".uz-ak1b"), el1b: q(".uz-el1b"), uk2b: q(".uz-uk2b"), ak2b: q(".uz-ak2b"), el2b: q(".uz-el2b"),
      ub1b: q(".uz-ub1b"), ab1b: q(".uz-ab1b"), pb1b: q(".uz-pb1b"), ub2b: q(".uz-ub2b"), ab2b: q(".uz-ab2b"), pb2b: q(".uz-pb2b"),
      ogovde: q(".k-ogovde"), obas: q(".k-bas"),
      otUk1: q(".ot-uk1"), otAk1: q(".ot-ak1"), otEl1: q(".ot-el1"), otUk2: q(".ot-uk2"), otAk2: q(".ot-ak2"), otEl2: q(".ot-el2"),
      uyuGovde: q(".k-uyu-govde"),
    };

    const etiket = document.createElementNS("http://www.w3.org/2000/svg", "g");
    etiket.setAttribute("class", "kisi-ust");
    const t = kisaAd(k.ad), w = Math.max(20, t.length * 4.95 + 11);
    const dt = dayakAktif && k.asim ? `Dayak +%${pctFmt(Math.round(k.fazla * 10) / 10)}` : "";
    const dw = dt ? Math.max(28, dt.length * 4.2 + 10) : 0;
    etiket.innerHTML = `<g class="kisi-etiket"><rect x="${(-w / 2).toFixed(1)}" y="-11.5" width="${w.toFixed(1)}" height="12" rx="6"/><circle cx="${(-w / 2 + 5.2).toFixed(1)}" cy="-5.5" r="2" fill="${k.renk}"/><text x="2.6" y="-3" text-anchor="middle">${esc(t)}</text></g><g class="uyku-zz"></g>${dt ? `<g class="dayak-etiket"><title>Limit payını %${pctFmt(Math.round(k.fazla * 10) / 10)} aştı: o kadar pataklanıyor</title><rect x="${(-dw / 2).toFixed(1)}" y="-24" width="${dw.toFixed(1)}" height="11" rx="5.5"/><text x="0" y="-16.2" text-anchor="middle">${esc(dt)}</text></g>` : ""}`;
    ust.appendChild(etiket);
    const balonEl = document.createElement("div");
    balonEl.className = "ofis-balon";
    balonEl.dataset.acik = "0";
    balonEl.style.display = "none";
    balonKatman.appendChild(balonEl);
    s.el = el; s.etiket = etiket; s.kisiEtiketEl = etiket.querySelector(".kisi-etiket"); s.dayakEtiketEl = etiket.querySelector(".dayak-etiket"); s.zzEl = etiket.querySelector(".uyku-zz"); s.etiketYariW = w / 2; s.dayakYariW = dw / 2; s.balonEl = balonEl;

    // Ayaktaki veya yatakta uyuyan kişiye tıklayınca tepki verir
    el.addEventListener("click", (ev) => {
      if (s.mod === "otur" || s.mod === "yerles" || s.mod === "kalkis" || s.mod === "yatakYerles" || s.mod === "yatakKalkis") return;
      ev.stopPropagation();
      balonGoster(s, sec(s.mod === "yatakUyu" ? SOZ.uykuTikla : SOZ.tikla), s.mod === "yatakUyu" ? 10 : 12, "tik");
    });
    if (sohbetAktif && s.balonMetin && s.balonBit > tBas) balonCiz(s, s.balonMetin);
    else if (!sohbetAktif) { s.balonMetin = ""; s.balonBit = 0; }
    return s;
  });

  // Şirket kedisi
  const kediNoktalar = [
    [S0.kanepeKoltuklar[0].yanasma[0] + 0.35, S0.kanepeKoltuklar[1].yanasma[1] + 0.55],
    S0.esyalar.find((e) => e.ad === "sunucu").nokta,
    S0.esyalar.find((e) => e.ad === "kahve").nokta,
  ];
  if (S0.yatakSlotlar.length && S0.yatakSlotlar[0].y2 + 0.34 < S0.D - 0.5) {
    kediNoktalar.push([S0.yatakSlotlar[0].x1 + 0.35, S0.yatakSlotlar[0].y2 + 0.34]);
  }
  let kedi = OFIS.kedi;
  if (!kedi) {
    kedi = { x: kediNoktalar[0][0], y: kediNoktalar[0][1], mod: "uyu", yol: [], bekle: tBas + 9 + Math.random() * 10, yon: 1, faz: 0, balonBit: 0, balonBas: 0, balonW: 92, balonH: 24, zorunluBalon: false };
    OFIS.kedi = kedi;
  }
  const kediEl = document.createElementNS("http://www.w3.org/2000/svg", "g");
  kediEl.setAttribute("id", "ofis-kedi");
  kediEl.setAttribute("class", "kedi");
  kediEl.innerHTML = `<title>${esc(kediAd)} (Ofis Kedisi)</title>${kediSvg()}`;
  const kediUst = document.createElementNS("http://www.w3.org/2000/svg", "g");
  kediUst.setAttribute("class", "kisi-ust");
  kediUst.innerHTML = `<g class="balon"></g>`;
  if (!kediAktif) { kediEl.style.display = "none"; kediUst.style.display = "none"; }
  ust.appendChild(kediUst);
  const kediBalonEl = document.createElement("div");
  kediBalonEl.className = "ofis-balon";
  kediBalonEl.dataset.acik = "0";
  kediBalonEl.style.display = "none";
  balonKatman.appendChild(kediBalonEl);
  kedi.el = kediEl; kedi.ust = kediUst; kedi.balonEl = kediBalonEl;

  function balonOlc(hedef, bEl) {
    bEl.style.maxWidth = "";
    bEl.style.width = "max-content";
    const ustGen = Math.max(76, (offEl.clientWidth || 800) - 10);
    bEl.style.left = "0px";
    bEl.style.top = "0px";
    bEl.style.display = "block";
    let w = Math.ceil(bEl.getBoundingClientRect().width) || bEl.offsetWidth || 108;
    if (w > ustGen) {
      bEl.style.maxWidth = `${ustGen}px`;
      w = Math.ceil(bEl.getBoundingClientRect().width) || bEl.offsetWidth || ustGen;
    }
    const h = Math.ceil(bEl.getBoundingClientRect().height) || bEl.offsetHeight || 26;
    bEl.style.width = `${w}px`;
    hedef.balonW = w;
    hedef.balonH = h;
  }

  kediEl.addEventListener("click", (ev) => {
    if (!kediAktif) return;
    ev.stopPropagation();
    const tNow = simdi();
    kedi.mod = "bekle"; kedi.bekle = tNow + 6;
    kedi.balonBas = tNow; kedi.balonBit = tNow + 8.5; kedi.zorunluBalon = "tik";
    kediBalonEl.innerHTML = `<span class="ob-ad"><i style="background:#df8840"></i>${esc(kediAd)}:</span>Mırrr~ 🐾<span class="ob-ok"></span>`;
    balonOlc(kedi, kediBalonEl);
    if (OFIS.duraklatildi || azHareket) ciz(tNow);
  });

  const bulut = document.createElementNS("http://www.w3.org/2000/svg", "g");
  bulut.setAttribute("class", "kavga-bulutlari");
  ust.prepend(bulut);

  // Küçük, az yer kaplayan HTML konuşma balonu (etiketlerle ve diğer balonlarla çakışmaz)
  function balonCiz(s, metin) {
    const kavga = s.mod === "dov" || s.dayakYiyor;
    s.balonEl.className = "ofis-balon" + (kavga ? " kavga-b" : "");
    s.balonEl.innerHTML = `<span class="ob-ad"><i style="background:${s.renk}"></i>${esc(kisaAd(s.ad))}:</span>${esc(metin)}<span class="ob-ok"></span>`;
    balonOlc(s, s.balonEl);
  }

  function balonGoster(s, metin, ozelSure = 0, zorla = false) {
    if (!sohbetAktif && !zorla) return false;
    const t = simdi();
    const kavga = s.mod === "dov" || s.dayakYiyor;
    const darSahne = (offEl.clientWidth || 800) < 540;
    const ustSinir = !darSahne && kavga ? 2 : 1;
    const acik = kisiler.filter((x) => x !== s && x.balonBit > t);
    if (!zorla && !s.diyalog && (acik.length >= ustSinir || (darSahne && kedi.balonBit > t))) return false;
    if (acik.length >= ustSinir) {
      acik.sort((a, b) => (a.zorunluBalon ? 1 : 0) - (b.zorunluBalon ? 1 : 0) || (a.dayakYiyor ? 1 : 0) - (b.dayakYiyor ? 1 : 0) || a.balonBit - b.balonBit);
      while (acik.length >= ustSinir) {
        const eski = acik.shift();
        eski.balonBit = Math.min(eski.balonBit, t + 0.28);
      }
    }
    const sure = ozelSure || (kavga ? 8.5 + Math.random() * 2.5 : Math.min(14.5, 10 + metin.length * 0.055));
    s.balonMetin = metin;
    s.balonBas = t;
    s.balonBit = t + sure;
    s.zorunluBalon = zorla === "tik" ? "tik" : (!!zorla || !!s.diyalog);
    balonCiz(s, metin);
    if (OFIS.duraklatildi || azHareket) ciz(t);
    return true;
  }

  OFIS.kisiTepki = (grpId) => {
    const s = kisiler.find((x) => x.id === grpId);
    if (!s) return;
    const havuz = s.dayakYiyor || (dayakAktif && s.asim) ? SOZ.dayak : s.mod === "yatakUyu" ? SOZ.uykuTikla : s.mod === "otur" ? SOZ.otur : SOZ.tikla;
    balonGoster(s, sec(havuz), 10, "tik");
  };

  const asanlar = dayakAktif ? kisiler.filter((s) => s.asim && s.canli) : [];
  for (const s of kisiler) if (dayakAktif && s.asim) ust.appendChild(s.etiket);

  const dovusYeri = (h, sira) => {
    const [kx, ky] = h.koltuk;
    const yerler = [[kx - 1.02, ky + 0.28], [kx + 1.05, ky + 0.28], [kx, ky + 1.25], [kx - 0.88, ky + 1.18], [kx + 0.88, ky + 1.18]];
    return yerler[sira % yerler.length];
  };

  function hedefMod(s) {
    if (asanlar.includes(s)) return { mod: "otur" };
    if (asanlar.length) {
      const saldiranlar = kisiler.filter((x) => !asanlar.includes(x));
      const idx = saldiranlar.indexOf(s);
      const hedef = asanlar[idx % asanlar.length];
      const ayniHedef = saldiranlar.filter((_, j) => asanlar[j % asanlar.length] === hedef);
      return { mod: "dov", hedef, yer: dovusYeri(hedef, ayniHedef.indexOf(s)) };
    }
    if (s.canli) return { mod: "otur" };
    if (geceAktif()) return { mod: "uyu" };
    return { mod: "gez" };
  }

  const GECIS = 0.58, YATAK_GECIS = 0.68;
  const yuvaOf = (id) => svg.querySelector(`.koltuk-yuva[data-grp="${CSS.escape(id)}"]`);
  const yatakYuvaOf = (slot) => svg.querySelector(`.yatak-yuva[data-slot="${slot}"]`);
  const yatakGorunumOf = (s) => s.mod === "yatakUyu" || ((s.mod === "yatakYerles" || s.mod === "yatakKalkis") && (s.gecisOran || 0) >= 0.55);

  function kanepeBirak(s) {
    if (s.kanepeSlot >= 0 && S0.kanepeKoltuklar[s.kanepeSlot]) {
      if (S0.kanepeKoltuklar[s.kanepeSlot].dolu === s.id) S0.kanepeKoltuklar[s.kanepeSlot].dolu = null;
      s.kanepeSlot = -1;
    }
  }
  function yatakBirak(s) {
    if (s.yatakSlot >= 0 && S0.yatakSlotlar[s.yatakSlot]) {
      if (S0.yatakSlotlar[s.yatakSlot].dolu === s.id) S0.yatakSlotlar[s.yatakSlot].dolu = null;
      s.yatakSlot = -1;
    }
  }
  function diyalogBitir(s) {
    const d = s.diyalog;
    if (!d) return;
    d.bitti = true;
    for (const u of [d.a, d.b]) {
      if (!u) continue;
      u.diyalog = null;
      if (u.mod === "sohbetYuru" || u.mod === "sohbetBekle") { u.mod = "bekle"; u.yol = []; }
    }
  }

  function masaKalk(s) {
    if (s.mod !== "otur") return;
    s.mod = "kalkis"; s.gecis = simdi(); s.gecisOran = 1; s.yol = []; s.arka = false;
  }
  function masaYerles(s) {
    s.mod = "yerles"; s.gecis = simdi(); s.gecisOran = 0; s.yol = []; s.arka = true;
    const yuva = yuvaOf(s.id);
    if (yuva) yuva.appendChild(s.el);
  }
  function masaOtur(s) {
    s.mod = "otur"; s.x = s.koltuk[0]; s.y = s.koltuk[1]; s.gecisOran = 1; s.yol = [];
    const yuva = yuvaOf(s.id);
    if (yuva && s.el.parentNode !== yuva) yuva.appendChild(s.el);
  }
  function kanepeYerles(s) {
    s.mod = "kanepeYerles"; s.gecis = simdi(); s.gecisOran = 0; s.yol = []; s.yon = 1; s.arka = false;
    if (kanepeYuva) kanepeYuva.appendChild(s.el);
  }
  function kanepeOtur(s) {
    const sl = S0.kanepeKoltuklar[s.kanepeSlot];
    if (!sl) { s.mod = "bekle"; return; }
    s.mod = "kanepeOtur"; s.x = sl.koltuk[0]; s.y = sl.koltuk[1]; s.gecisOran = 1; s.yon = 1; s.arka = false; s.yol = [];
    if (kanepeYuva && s.el.parentNode !== kanepeYuva) kanepeYuva.appendChild(s.el);
  }
  function kanepeKalk(s) {
    s.mod = "kanepeKalkis"; s.gecis = simdi(); s.gecisOran = 1; s.yol = []; s.yon = 1; s.arka = false;
  }
  function yatakYerles(s) {
    const sl = S0.yatakSlotlar[s.yatakSlot];
    if (!sl) { s.mod = "bekle"; return; }
    const [ex, ey] = iso(sl.yatak[0] - sl.yanasma[0], sl.yatak[1] - sl.yanasma[1], 0);
    s.mod = "yatakYerles"; s.gecis = simdi(); s.gecisOran = 0; s.yol = [];
    s.yon = ex >= 0 ? 1 : -1; s.arka = ey < -0.02; s.bardakBit = 0; s.tahtaBit = 0;
  }
  function yatakUyu(s) {
    const sl = S0.yatakSlotlar[s.yatakSlot];
    if (!sl) { s.mod = "bekle"; return; }
    s.mod = "yatakUyu"; s.x = sl.yatak[0]; s.y = sl.yatak[1]; s.gecisOran = 1; s.yol = [];
    s.bardakBit = 0; s.tahtaBit = 0;
    const yuva = yatakYuvaOf(sl.slot);
    if (yuva && s.el.parentNode !== yuva) yuva.appendChild(s.el);
  }
  function yatakKalk(s) {
    const sl = S0.yatakSlotlar[s.yatakSlot];
    if (!sl) { yatakBirak(s); s.mod = "bekle"; return; }
    const [ex, ey] = iso(sl.yanasma[0] - sl.yatak[0], sl.yanasma[1] - sl.yatak[1], 0);
    s.mod = "yatakKalkis"; s.gecis = simdi(); s.gecisOran = 1; s.yol = [];
    s.yon = ex >= 0 ? 1 : -1; s.arka = ey < -0.02;
  }

  // İlk yerleşim
  for (const s of kisiler) {
    if (s.mod === "otur" || s.mod === "yerles") masaOtur(s);
    else if ((s.mod === "kanepeOtur" || s.mod === "kanepeYerles") && s.kanepeSlot >= 0) kanepeOtur(s);
    else if ((s.mod === "yatakUyu" || s.mod === "yatakYerles") && s.yatakSlot >= 0) yatakUyu(s);
    else {
      if (s.mod === "kalkis") { s.mod = "bekle"; s.x = s.yanasma[0]; s.y = s.yanasma[1]; }
      if (s.mod === "kanepeKalkis") { kanepeBirak(s); s.mod = "bekle"; }
      if (s.mod === "yatakKalkis") {
        const sl = S0.yatakSlotlar[s.yatakSlot];
        if (sl) { s.x = sl.yanasma[0]; s.y = sl.yanasma[1]; }
        yatakBirak(s); s.mod = "bekle";
      }
      ogeG.appendChild(s.el);
    }
  }
  if (kediAktif) ogeG.appendChild(kediEl);

  // İki boştaki kişiyi karşılıklı 3 adımlı gerçekçi sohbete başlatır
  function sohbetBaslat(a, b, t) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const [ci, cj] = enYakinBos(mx, my);
    const cx = (ci + 0.5) * H, cy = (cj + 0.5) * H;
    const [a1i, a1j] = enYakinBos(cx - 0.55, cy + 0.2);
    const [b1i, b1j] = enYakinBos(cx + 0.55, cy - 0.2);
    const hedefA = [(a1i + 0.5) * H, (a1j + 0.5) * H];
    const hedefB = [(b1i + 0.5) * H, (b1j + 0.5) * H];
    const replikHavuzu = kediAktif ? DIYALOG : DIYALOG.filter((r) => !r.some((c) => c.includes("Tekir")));
    const d = { a, b, replikler: sec(replikHavuzu).map((c) => c.replaceAll("Tekir", kediAd)), adim: 0, sonraki: 0, baslamaSinir: t + 8, bitti: false };
    a.diyalog = d; b.diyalog = d;
    a.hedefEylem = null; b.hedefEylem = null;
    a.yol = yolBul(a.x, a.y, hedefA[0], hedefA[1]); a.mod = "sohbetYuru";
    b.yol = yolBul(b.x, b.y, hedefB[0], hedefB[1]); b.mod = "sohbetYuru";
  }

  let sonSira = "";
  const statikKutular = S0.ogeler.map((o, i) => ({ tip: "oge", id: "o" + i, x1: o.x1, x2: o.x2, y1: o.y1, y2: o.y2, el: ogeEl[i] }));

  function ciz(t) {
    // 1) Derinlik sıralaması (mobilyalar + ayaktaki kişiler + kedi)
    const kutular = [...statikKutular];
    for (const s of kisiler) {
      const yatakGorunum = yatakGorunumOf(s);
      if (yatakGorunum) {
        const yuva = yatakYuvaOf(s.yatakSlot);
        if (yuva && s.el.parentNode !== yuva) yuva.appendChild(s.el);
      }
      const yuvada = s.mod === "otur" || s.mod === "yerles" || s.mod === "kalkis" || s.mod === "kanepeOtur" || s.mod === "kanepeYerles" || s.mod === "kanepeKalkis" || yatakGorunum;
      if (!yuvada) kutular.push({ tip: "kisi", id: "k:" + s.id, x1: s.x - 0.14, x2: s.x + 0.14, y1: s.y - 0.14, y2: s.y + 0.14, el: s.el });
    }
    if (kediAktif) kutular.push({ tip: "kedi", id: "kedi", x1: kedi.x - 0.12, x2: kedi.x + 0.12, y1: kedi.y - 0.12, y2: kedi.y + 0.12, el: kediEl });

    const sirali = izoSirala(kutular);
    const siraAnahtar = sirali.map((k) => k.id).join("|");
    if (siraAnahtar !== sonSira) {
      sonSira = siraAnahtar;
      for (const k of sirali) ogeG.appendChild(k.el);
    }

    // 2) Kişilerin konum, yön, poz ve etiketleri
    let bulutHtml = "";
    const acikBalonlar = [];

    for (const s of kisiler) {
      const masaOturuyor = s.mod === "otur";
      const kanepeOturuyor = s.mod === "kanepeOtur";
      const yatakGorunum = yatakGorunumOf(s);
      const yeniDayak = masaOturuyor && s.asim && asanlar.includes(s) && kisiler.some((o) => o.mod === "dov" && o.hedefKisi === s);
      if (yeniDayak && !s.dayakYiyor) {
        s.dayakYiyor = true;
        balonGoster(s, sec(SOZ.dayak), 10.5, true);
      }
      s.dayakYiyor = yeniDayak;
      if (s.dayakYiyor) {
        const [bsx, bsy] = iso(s.x, s.y, 0.42);
        bulutHtml += kavgaBulutu(bsx, bsy, t);
      }

      let z = 0;
      if (masaOturuyor) z = 0.42;
      else if (s.mod === "yerles" || s.mod === "kalkis") z = 0.42 * (s.gecisOran || 0);
      else if (kanepeOturuyor) z = 0.24;
      else if (s.mod === "kanepeYerles" || s.mod === "kanepeKalkis") z = 0.24 * (s.gecisOran || 0);
      else if (s.mod === "yatakUyu") z = 0.45;
      else if (s.mod === "yatakYerles" || s.mod === "yatakKalkis") z = 0.45 * (s.gecisOran || 0);

      const [sx, sy] = iso(s.x, s.y, z);
      s.sx = sx; s.sy = sy;
      s.el.setAttribute("transform", `translate(${sx.toFixed(1)} ${sy.toFixed(1)})`);
      s.parca.yon.setAttribute("transform", !masaOturuyor && !yatakGorunum && s.yon < 0 ? "scale(-1 1)" : "");

      const tiklanir = !masaOturuyor && s.mod !== "yerles" && s.mod !== "kalkis" && s.mod !== "yatakYerles" && s.mod !== "yatakKalkis";
      const cls = ["kisi", masaOturuyor ? "oturuyor" : yatakGorunum ? "uyuyor" : s.arka ? "arkadan" : "onden"];
      if (tiklanir) cls.push("tiklanir");
      s.el.setAttribute("class", cls.join(" "));

      kisiPozGuncelle(s, t);

      const basY = masaOturuyor ? sy - 43 : kanepeOturuyor ? sy - 56 : yatakGorunum ? sy - 22 : sy - 67;
      s.basY = basY;
      s.etiketX = sx;
      s.etiketY = basY;
      s.masaOturuyor = masaOturuyor;

      if (s.balonMetin) {
        if (t > s.balonBit) {
          s.balonMetin = ""; s.zorunluBalon = false; s.balonEl.dataset.acik = "0"; s.balonEl.style.display = "none";
        } else {
          acikBalonlar.push(s);
        }
      }
      // Masada otururken üstte zaten masa kartı var; konuşurken de balonun içinde isim yazıyor: çift etiketi gizle
      s.kisiEtiketAcik = !masaOturuyor && !s.balonMetin;
      if (s.kisiEtiketEl) s.kisiEtiketEl.style.display = s.kisiEtiketAcik ? "" : "none";

      if (s.zzEl) {
        if (s.mod === "yatakUyu" && !s.balonMetin) {
          const zFaz = (t * 0.62 + s.faz0 * 0.4) % 2.4;
          const op = azHareket ? 0.72 : Math.max(0.12, Math.min(0.78, Math.sin((zFaz / 2.4) * Math.PI) * 0.82));
          const zx = (s.etiketYariW + 4.2 + (azHareket ? 1.4 : zFaz * 1.35)).toFixed(1);
          const zy = (-2.2 - (azHareket ? 2.2 : zFaz * 3.1)).toFixed(1);
          s.zzEl.innerHTML = `<text x="${zx}" y="${zy}" fill="#bcd0e8" opacity="${op.toFixed(2)}" font-size="7.5" font-weight="700">zZ</text>`;
        } else if (s.zzEl.innerHTML) {
          s.zzEl.innerHTML = "";
        }
      }
    }

    // Görünür SVG kişi / dayak etiketlerinin birbirine binmesini önle
    const gorunurEtiketler = kisiler.filter((s) => s.kisiEtiketAcik || s.dayakEtiketEl);
    for (let tur = 0; tur < 4; tur++) {
      for (let i = 0; i < gorunurEtiketler.length; i++) {
        const A = gorunurEtiketler[i];
        const wA = A.dayakEtiketEl ? Math.max(A.etiketYariW, A.dayakYariW || 0) : A.etiketYariW;
        const hA = A.dayakEtiketEl ? 24.5 : 12.5;
        for (let j = i + 1; j < gorunurEtiketler.length; j++) {
          const B = gorunurEtiketler[j];
          const wB = B.dayakEtiketEl ? Math.max(B.etiketYariW, B.dayakYariW || 0) : B.etiketYariW;
          const hB = B.dayakEtiketEl ? 24.5 : 12.5;
          const dx = B.etiketX - A.etiketX, ox = wA + wB + 4 - Math.abs(dx);
          if (ox <= 0) continue;
          const dy = (B.etiketY - hB * 0.5) - (A.etiketY - hA * 0.5), oy = (hA + hB) * 0.5 + 2.5 - Math.abs(dy);
          if (oy <= 0) continue;
          if (oy <= ox) {
            const vYon = dy >= 0 ? 1 : -1;
            A.etiketY -= vYon * (oy * 0.6 + 0.4);
            B.etiketY += vYon * (oy * 0.4 + 0.4);
          } else {
            const hYon = dx >= 0 ? 1 : -1;
            A.etiketX -= hYon * (ox * 0.5 + 0.4);
            B.etiketX += hYon * (ox * 0.5 + 0.4);
          }
          A.etiketX = Math.max(S0.vb.minX + wA + 2, Math.min(S0.vb.minX + S0.vb.vw - wA - 2, A.etiketX));
          B.etiketX = Math.max(S0.vb.minX + wB + 2, Math.min(S0.vb.minX + S0.vb.vw - wB - 2, B.etiketX));
          A.etiketY = Math.max(S0.vb.minY + hA + 2, Math.min(S0.vb.minY + S0.vb.vh - 4, A.etiketY));
          B.etiketY = Math.max(S0.vb.minY + hB + 2, Math.min(S0.vb.minY + S0.vb.vh - 4, B.etiketY));
        }
      }
    }
    for (const s of kisiler) {
      s.etiket.setAttribute("transform", `translate(${s.etiketX.toFixed(1)} ${s.etiketY.toFixed(1)})`);
    }

    // 3) Konuşma balonlarını (kişiler + kedi) masa kartlarına ve birbirine değmeyecek en uygun noktaya yerleştir
    const kediKonusuyor = kediAktif && kedi.balonBit > t;
    if (acikBalonlar.length || kediKonusuyor) {
      const offW = sahneGen || offEl.clientWidth || 800;
      const offH = sahneYuk || offEl.clientHeight || 450;
      if (Math.abs(offW - sonBalonOffW) > 1) {
        sonBalonOffW = offW;
        for (const s of acikBalonlar) balonOlc(s, s.balonEl);
        if (kediKonusuyor) balonOlc(kedi, kediBalonEl);
      }
      const toPxX = (vx) => ((vx - S0.vb.minX) / S0.vb.vw) * offW;
      const toPxY = (vy) => ((vy - S0.vb.minY) / S0.vb.vh) * offH;
      const olcek = offW / S0.vb.vw;

      const engeller = [];
      for (const mk of OFIS.masaKutulari) {
        engeller.push({ sol: mk.sol - 4, sag: mk.sag + 4, ust: mk.ust - 3, alt: mk.alt + 5, agirlik: 320, sert: true, sahip: null });
      }
      for (const k of kisiler) {
        if (k.kisiEtiketAcik || k.dayakEtiketEl) {
          const yariSvg = k.dayakEtiketEl ? Math.max(k.etiketYariW, k.dayakYariW || 0) : k.etiketYariW;
          const yukSvg = k.dayakEtiketEl ? 24.5 : 12.5;
          const ex = toPxX(k.etiketX), ey = toPxY(k.etiketY);
          engeller.push({ sol: ex - yariSvg * olcek - 3, sag: ex + yariSvg * olcek + 3, ust: ey - yukSvg * olcek - 2, alt: ey + 2, agirlik: 110, sert: false, sahip: k });
        }
        const kx = toPxX(k.sx), kyUst = toPxY(k.basY), kyAlt = toPxY(k.sy);
        engeller.push({ sol: kx - 9 * olcek - 2, sag: kx + 9 * olcek + 2, ust: kyUst, alt: Math.max(kyUst + 8, kyAlt - 4 * olcek), agirlik: 44, sert: false, sahip: k });
      }

      const konusanlar = acikBalonlar.map((s) => ({
        ref: s, el: s.balonEl, bw: s.balonW || 108, bh: s.balonH || 26,
        px: toPxX(s.sx),
        py: toPxY(s.dayakEtiketEl ? s.etiketY - 24 : s.basY),
        ayakAlt: toPxY(s.sy) + 6,
        bas: s.balonBas, bit: s.balonBit,
        kavga: s.mod === "dov" || s.dayakYiyor,
        zorunlu: s.zorunluBalon,
        iptal: () => {
          s.balonMetin = ""; s.balonBit = 0; s.zorunluBalon = false; s.balonEl.dataset.acik = "0"; s.balonEl.style.display = "none";
          if (!s.masaOturuyor && s.kisiEtiketEl) { s.kisiEtiketAcik = true; s.kisiEtiketEl.style.display = ""; }
        },
      }));
      if (kediKonusuyor) {
        const [ksx, ksy] = iso(kedi.x, kedi.y, 0);
        konusanlar.push({
          ref: kedi, el: kediBalonEl, bw: kedi.balonW || 92, bh: kedi.balonH || 24,
          px: toPxX(ksx), py: toPxY(ksy - 13), ayakAlt: toPxY(ksy) + 5,
          bas: kedi.balonBas, bit: kedi.balonBit, kavga: false, zorunlu: kedi.zorunluBalon || "tik",
          iptal: () => { kedi.balonBit = 0; kedi.zorunluBalon = false; kediBalonEl.dataset.acik = "0"; kediBalonEl.style.display = "none"; },
        });
      }
      const oncelik = (z) => (z === "tik" ? 0 : z ? 1 : 2);
      konusanlar.sort((a, b) => oncelik(a.zorunlu) - oncelik(b.zorunlu) || a.py - b.py);

      for (const b of konusanlar) {
        const gecen = t - b.bas, kalan = b.bit - t;
        const op = azHareket ? 1 : Math.max(0, Math.min(1, gecen / 0.32, kalan / 0.55));
        const girisY = !azHareket && gecen < 0.32 ? (1 - gecen / 0.32) * 4 : 0;
        const { px, py, ayakAlt, bw, bh } = b;
        const ustBos = 5, yanBos = Math.max(10, 12 * olcek);
        const minCx = Math.min(offW * 0.5, bw * 0.5 + 4);
        const maxCx = Math.max(offW * 0.5, offW - bw * 0.5 - 4);
        const minAltY = Math.min(offH - 4, bh + 4);
        const maxAltY = Math.max(minAltY, offH - 4);

        const degerlendir = (adX, adAltY) => {
          const cx = Math.max(minCx, Math.min(maxCx, adX));
          const altY = Math.max(minAltY, Math.min(maxAltY, adAltY));
          const sol = cx - bw * 0.5, sag = cx + bw * 0.5, ustY = altY - bh;
          const dxKutu = Math.max(0, sol + 8 - px, px - (sag - 8));
          const dyKutu = ustY > ayakAlt ? ustY - ayakAlt : altY < py ? py - altY : 0;
          let ceza = Math.hypot(cx - px, (ustY + altY) * 0.5 - (py - bh * 0.38)) * 0.28;
          if (dxKutu > 24) ceza += (dxKutu - 24) * 1.9;
          if (dyKutu > 32) ceza += (dyKutu - 32) * 1.7;
          if (ustY >= ayakAlt - 4) ceza += 11;
          let sertAlan = 0;
          for (const e of engeller) {
            if (e.sahip === b.ref && altY <= py + 4) continue;
            const ox = Math.max(0, Math.min(sag, e.sag) - Math.max(sol, e.sol));
            const oy = Math.max(0, Math.min(altY, e.alt) - Math.max(ustY, e.ust));
            if (ox > 0 && oy > 0) {
              ceza += ox * oy * e.agirlik;
              if (e.sert) sertAlan += ox * oy;
            }
          }
          return { cx, altY, sol, sag, ustY, ceza, sertAlan, dxKutu };
        };

        const adaylar = [
          [px, py - ustBos],
          [px - bw * 0.36, py - ustBos],
          [px + bw * 0.36, py - ustBos],
          [px - bw * 0.72, py - ustBos],
          [px + bw * 0.72, py - ustBos],
          [px - bw * 0.5 - yanBos, py + bh * 0.42],
          [px + bw * 0.5 + yanBos, py + bh * 0.42],
          [px - bw * 0.5 - yanBos - 4, py + bh * 0.9],
          [px + bw * 0.5 + yanBos + 4, py + bh * 0.9],
          [px, py - ustBos - bh * 0.72],
          [px - bw * 0.52, py - ustBos - bh * 0.68],
          [px + bw * 0.52, py - ustBos - bh * 0.68],
          [px, ayakAlt + bh + 4],
          [px - bw * 0.45, ayakAlt + bh + 4],
          [px + bw * 0.45, ayakAlt + bh + 4],
        ];

        let enIyi = null;
        for (const [ax, ay] of adaylar) {
          const sonuc = degerlendir(ax, ay);
          if (!enIyi || sonuc.ceza < enIyi.ceza) {
            enIyi = sonuc;
            if (sonuc.sertAlan === 0 && sonuc.ceza < 14) break;
          }
        }
        // Tüm yakın adaylar bir masa kartına veya başka balona değiyorsa önce çevrede, sonra tüm sahnede boş cep ara
        if (enIyi.sertAlan > 0) {
          for (const dyOff of [-bh * 1.35, -bh * 0.35, bh * 0.55, ayakAlt - py + bh + 8]) {
            for (const dxOff of [-bw * 1.1, -bw * 0.55, 0, bw * 0.55, bw * 1.1]) {
              const sonuc = degerlendir(px + dxOff, py + dyOff);
              if (sonuc.ceza < enIyi.ceza) enIyi = sonuc;
            }
          }
        }
        if (enIyi.sertAlan > 0) {
          for (let gi = 0; gi <= 5; gi++) {
            const gx = minCx + ((maxCx - minCx) * gi) / 5;
            for (let gj = 0; gj <= 4; gj++) {
              const gy = minAltY + ((maxAltY - minAltY) * gj) / 4;
              const sonuc = degerlendir(gx, gy);
              if (sonuc.ceza < enIyi.ceza) enIyi = sonuc;
            }
          }
        }
        // Kullanıcı bizzat tıklamadıysa ve sahnede hiç çakışmasız cep kalmadıysa otomatik balonu gizle (üst üste binmesin)
        if (b.zorunlu !== "tik" && (enIyi.sertAlan > 1 || (!b.zorunlu && enIyi.dxKutu > 58))) {
          b.iptal();
          continue;
        }

        engeller.push({ sol: enIyi.sol - 7, sag: enIyi.sag + 7, ust: enIyi.ustY - 6, alt: enIyi.altY + 6, agirlik: 2400, sert: true, sahip: b.ref });
        b.el.dataset.acik = "1";
        b.el.style.display = "block";
        b.el.style.left = `${enIyi.cx.toFixed(1)}px`;
        b.el.style.top = `${(enIyi.altY + girisY).toFixed(1)}px`;
        b.el.style.opacity = op.toFixed(2);
        const ok = b.el.querySelector(".ob-ok");
        if (ok) {
          const kenar = b.kavga ? "rgba(240,120,109,.55)" : "rgba(255,255,255,.15)";
          if (enIyi.altY <= py + 8) {
            const ox = Math.max(9, Math.min(bw - 9, px - enIyi.sol));
            ok.style.cssText = `left:${ox.toFixed(1)}px;top:100%;border-right:1px solid ${kenar};border-bottom:1px solid ${kenar}`;
          } else if (enIyi.ustY >= ayakAlt - 8) {
            const ox = Math.max(9, Math.min(bw - 9, px - enIyi.sol));
            ok.style.cssText = `left:${ox.toFixed(1)}px;top:0%;border-left:1px solid ${kenar};border-top:1px solid ${kenar}`;
          } else if (enIyi.cx < px) {
            const oy = Math.max(8, Math.min(bh - 8, (py + 8) - enIyi.ustY));
            ok.style.cssText = `left:100%;top:${oy.toFixed(1)}px;border-top:1px solid ${kenar};border-right:1px solid ${kenar}`;
          } else {
            const oy = Math.max(8, Math.min(bh - 8, (py + 8) - enIyi.ustY));
            ok.style.cssText = `left:0%;top:${oy.toFixed(1)}px;border-left:1px solid ${kenar};border-bottom:1px solid ${kenar}`;
          }
        }
      }
    }

    // 4) Şirket kedisi çizimi
    if (kediAktif) {
      const [ksx, ksy] = iso(kedi.x, kedi.y, 0);
      kediEl.setAttribute("transform", `translate(${ksx.toFixed(1)} ${ksy.toFixed(1)})`);
      kediEl.querySelector(".kd-yon").setAttribute("transform", kedi.yon < 0 ? "scale(-1 1)" : "");
      const uyuyor = kedi.mod === "uyu";
      kediEl.querySelector(".kd-uyu").style.display = uyuyor ? "inline" : "none";
      kediEl.querySelector(".kd-yuru").style.display = uyuyor ? "none" : "inline";
      if (!uyuyor) {
        const yuruyor = kedi.mod === "yuru";
        const sal = yuruyor ? Math.sin(kedi.faz) * 2.2 : 0;
        kediEl.querySelector(".kd-b1").setAttribute("x2", (-4.6 + sal).toFixed(1));
        kediEl.querySelector(".kd-b4").setAttribute("x2", (5.0 + sal).toFixed(1));
        kediEl.querySelector(".kd-b2").setAttribute("x2", (3.8 - sal).toFixed(1));
        kediEl.querySelector(".kd-b3").setAttribute("x2", (-2.2 - sal).toFixed(1));
        const kuy = Math.sin(t * 3.6) * 2.4;
        kediEl.querySelector(".kd-kuyruk").setAttribute("d", `M-6.5 -5.5 q${(-4.2 + kuy * 0.4).toFixed(1)} -3 ${(-3.2 + kuy).toFixed(1)} -7.5`);
      }
      kediUst.setAttribute("transform", `translate(${ksx.toFixed(1)} ${ksy.toFixed(1)})`);
      if (kedi.balonBit && t > kedi.balonBit) {
        kedi.balonBit = 0; kedi.zorunluBalon = false; kediBalonEl.dataset.acik = "0"; kediBalonEl.style.display = "none";
      }
      if (!kedi.balonBit && uyuyor) {
        const zFaz = (t * 0.7) % 2.4;
        kediUst.querySelector(".balon").innerHTML = `<text x="6" y="${(-11 - zFaz * 4).toFixed(1)}" fill="#cbd5dc" opacity="${(0.65 - zFaz * 0.25).toFixed(2)}" font-size="7.5" font-weight="700">zZ</text>`;
      } else {
        kediUst.querySelector(".balon").innerHTML = "";
      }
    }

    bulut.innerHTML = bulutHtml;
  }

  function kavgaBulutu(sx, sy, t) {
    let h = `<g transform="translate(${sx.toFixed(1)} ${(sy - 21).toFixed(1)})">`;
    for (let i = 0; i < 7; i++) {
      const a = t * 3.2 + i * 0.9, r = 14 + 5 * Math.sin(t * 5.2 + i);
      h += `<circle cx="${(Math.cos(a) * r).toFixed(1)}" cy="${(Math.sin(a) * r * 0.56).toFixed(1)}" r="${(8.5 + 3 * Math.sin(t * 6.8 + i * 2)).toFixed(1)}" class="toz"/>`;
    }
    for (let i = 0; i < 4; i++) {
      const a = t * 5 + i * 1.57;
      const x1 = Math.cos(a) * 15, y1 = Math.sin(a) * 8 - 6, x2 = Math.cos(a) * 24, y2 = Math.sin(a) * 13 - 6;
      h += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="cizgi"/>`;
    }
    for (let i = 0; i < 3; i++) {
      const a = -t * 3.8 + i * 2.1;
      h += `<text x="${(Math.cos(a) * 21).toFixed(1)}" y="${(Math.sin(a) * 9 - 16).toFixed(1)}" class="yildiz" text-anchor="middle">${i === 1 ? "💥" : "✦"}</text>`;
    }
    return h + "</g>";
  }

  function guncelle(t, dt) {
    // Aktif ikili diyalogların adım yönetimi (A konuşur -> 11 sn okunur -> B yanıtlar -> A tamamlar)
    const gorulenDiyalog = new Set();
    for (const s of kisiler) {
      const d = s.diyalog;
      if (!d || gorulenDiyalog.has(d)) continue;
      gorulenDiyalog.add(d);
      if (d.bitti || asanlar.length || d.a.canli || d.b.canli || geceAktif()) { diyalogBitir(s); continue; }
      const hazir = (d.a.mod === "sohbetBekle" && d.b.mod === "sohbetBekle") || t > d.baslamaSinir;
      if (!hazir) continue;
      // Birbirlerine dönsünler
      const [ex, ey] = iso(d.b.x - d.a.x, d.b.y - d.a.y, 0);
      d.a.yon = ex >= 0 ? 1 : -1; d.a.arka = ey < -0.05;
      d.b.yon = -d.a.yon; d.b.arka = -ey < -0.05;

      if (t >= d.sonraki) {
        if (d.adim < d.replikler.length) {
          const konusan = d.adim % 2 === 0 ? d.a : d.b;
          const metin = d.replikler[d.adim];
          const sure = Math.min(16, 12 + metin.length * 0.06);
          balonGoster(konusan, metin, sure, true);
          d.adim++;
          d.sonraki = t + sure - 1.6; // önceki cümle bitmeye yakın doğal karşılık gelir
        } else {
          d.a.mod = "bekle"; d.a.bekle = t + 2 + Math.random() * 4; d.a.soz = t + 10 + Math.random() * 14;
          d.b.mod = "bekle"; d.b.bekle = t + 2 + Math.random() * 4; d.b.soz = t + 10 + Math.random() * 14;
          diyalogBitir(s);
        }
      }
    }

    for (const s of kisiler) {
      // Masa sandalyesine oturma / kalkma yumuşak geçişi
      if (s.mod === "yerles" || s.mod === "kalkis") {
        const p = Math.min(1, (t - s.gecis) / GECIS);
        s.gecisOran = s.mod === "yerles" ? p : 1 - p;
        const [ax, ay] = s.mod === "yerles" ? s.yanasma : s.koltuk, [bx, by] = s.mod === "yerles" ? s.koltuk : s.yanasma;
        s.x = ax + (bx - ax) * p; s.y = ay + (by - ay) * p;
        s.yuruAgirlik = 0.55; s.adimFaz += dt * 7;
        if (p >= 1) {
          s.yuruAgirlik = 0;
          if (s.mod === "yerles") masaOtur(s);
          else { s.mod = "bekle"; s.bekle = t + 0.4; ogeG.appendChild(s.el); sonSira = ""; }
        }
        continue;
      }
      // Kanepeye oturma / kalkma yumuşak geçişi
      if (s.mod === "kanepeYerles" || s.mod === "kanepeKalkis") {
        const sl = S0.kanepeKoltuklar[s.kanepeSlot];
        if (!sl) { s.mod = "bekle"; ogeG.appendChild(s.el); sonSira = ""; continue; }
        const p = Math.min(1, (t - s.gecis) / GECIS);
        s.gecisOran = s.mod === "kanepeYerles" ? p : 1 - p;
        const [ax, ay] = s.mod === "kanepeYerles" ? sl.yanasma : sl.koltuk, [bx, by] = s.mod === "kanepeYerles" ? sl.koltuk : sl.yanasma;
        s.x = ax + (bx - ax) * p; s.y = ay + (by - ay) * p;
        s.yuruAgirlik = 0.45; s.adimFaz += dt * 6;
        if (p >= 1) {
          s.yuruAgirlik = 0;
          if (s.mod === "kanepeYerles") { kanepeOtur(s); s.kanepeBit = t + 14 + Math.random() * 14; }
          else { kanepeBirak(s); s.mod = "bekle"; s.bekle = t + 0.6; ogeG.appendChild(s.el); sonSira = ""; }
        }
        continue;
      }
      // Yatağa uzanma / yataktan kalkma yumuşak geçişi
      if (s.mod === "yatakYerles" || s.mod === "yatakKalkis") {
        const sl = S0.yatakSlotlar[s.yatakSlot];
        if (!sl) { yatakBirak(s); s.mod = "bekle"; ogeG.appendChild(s.el); sonSira = ""; continue; }
        const p = Math.min(1, (t - s.gecis) / YATAK_GECIS);
        s.gecisOran = s.mod === "yatakYerles" ? p : 1 - p;
        const [ax, ay] = s.mod === "yatakYerles" ? sl.yanasma : sl.yatak, [bx, by] = s.mod === "yatakYerles" ? sl.yatak : sl.yanasma;
        s.x = ax + (bx - ax) * p; s.y = ay + (by - ay) * p;
        s.yuruAgirlik = s.gecisOran < 0.55 ? 0.48 : 0;
        if (s.gecisOran < 0.55) s.adimFaz += dt * 6;
        if (p >= 1) {
          s.yuruAgirlik = 0;
          if (s.mod === "yatakYerles") { yatakUyu(s); s.soz = Math.max(s.soz, t + 26 + Math.random() * 24); }
          else { yatakBirak(s); s.mod = "bekle"; s.bekle = t + 0.45; ogeG.appendChild(s.el); sonSira = ""; }
        }
        continue;
      }

      const istek = hedefMod(s);
      s.hedefKisi = istek.hedef || null;

      // Durum değişimleri (çalışmaya başlama, kavgaya koşma, gece yatağa geçme, sabah uyanma)
      if (s.mod === "otur" && istek.mod !== "otur") { masaKalk(s); continue; }
      if (s.mod === "kanepeOtur" && (istek.mod !== "gez" || t > s.kanepeBit)) { kanepeKalk(s); continue; }
      if (s.mod === "yatakUyu" && istek.mod !== "uyu") { yatakKalk(s); continue; }
      if (istek.mod !== "gez" && s.diyalog) diyalogBitir(s);

      if (s.mod === "yataga" && istek.mod !== "uyu") {
        yatakBirak(s);
        if (istek.mod === "gez") { s.mod = "bekle"; s.bekle = t + 0.5; s.yol = []; }
      }
      if (istek.mod === "otur" && s.mod !== "otur" && s.mod !== "oturmaya") {
        kanepeBirak(s); yatakBirak(s); ogeG.appendChild(s.el); sonSira = "";
        s.mod = "oturmaya"; s.yol = yolBul(s.x, s.y, s.yanasma[0], s.yanasma[1]);
      }
      if (istek.mod === "dov" && s.mod !== "dov" && s.mod !== "dovmeye") {
        kanepeBirak(s); yatakBirak(s); ogeG.appendChild(s.el); sonSira = "";
        s.mod = "dovmeye"; s.yol = yolBul(s.x, s.y, istek.yer[0], istek.yer[1]);

let fableFormAcik = false;

// Sağlayıcıya özgü derin teknik telemetri şeridi (Claude önbellek & model ailesi, Codex muhakeme/pencere, Gemini CLI vs Antigravity)
function saglayiciTelemetriKarti(d, total, byModel) {
  const sgl = d.saglayici || "claude";
  const L = d.limit || null;
  const ham = L && L.ham ? L.ham : {};
  if (total.tok <= 0 && !(sgl === "gemini" && (Number.isFinite(ham["agy_claude.used_percentage"]) || Number.isFinite(ham["agy_gemini.used_percentage"])))) {
    return "";
  }

  // 1. Hücre: Bağlam Önbelleği (Prompt Cache) isabeti
  const cachePayda = total.input + total.cw + total.cr;
  const crPct = cachePayda > 0 ? (total.cr / cachePayda) * 100 : 0;
  const cwPct = cachePayda > 0 ? (total.cw / cachePayda) * 100 : 0;
  const inPct = Math.max(0, 100 - crPct - cwPct);
  const cacheAltEtiket = sgl === "claude"
    ? `<span><i class="tm-nokta" style="background:var(--ok)"></i>Okuma ${short(total.cr)}</span><span><i class="tm-nokta" style="background:var(--warn)"></i>5dk ${short(total.cw5m)} · 1sa ${short(total.cw1h)}</span><span><i class="tm-nokta" style="background:var(--ink-3)"></i>Taze ${short(total.input)}</span>`
    : sgl === "chatgpt"
      ? `<span><i class="tm-nokta" style="background:var(--ok)"></i>Cached input ${short(total.cr)}</span><span><i class="tm-nokta" style="background:var(--ink-3)"></i>Yeni girdi ${short(total.input)}</span>`
      : `<span><i class="tm-nokta" style="background:var(--ok)"></i>Cached bağlam ${short(total.cr)}</span><span><i class="tm-nokta" style="background:var(--ink-3)"></i>Girdi ${short(total.input)}</span>`;

  // 2. Hücre: Sağlayıcıya özel model / ekosistem kırılımı
  let h2Baslik = "", h2Pill = "", h2Deger = "", h2Cubuk = "", h2Etiket = "";
  const mEntries = [...byModel.entries()];
  const payYuzde = (u) => (total.usd > 0 ? Math.max(0, (u / total.usd) * 100) : 0);

  if (sgl === "claude") {
    let opusU = 0, sonnetU = 0, haikuU = 0;
    for (const [m, s] of mEntries) {
      if (/opus|fable/i.test(m)) opusU += s.usd;
      else if (/sonnet/i.test(m)) sonnetU += s.usd;
      else haikuU += s.usd;
    }
    const pO = payYuzde(opusU), pS = payYuzde(sonnetU), pH = payYuzde(haikuU);
    const baskin = opusU >= sonnetU && opusU >= haikuU ? `Opus %${Math.round(pO)}` : sonnetU >= haikuU ? `Sonnet %${Math.round(pS)}` : `Haiku %${Math.round(pH)}`;
    h2Baslik = "Claude Model Dağılımı";
    h2Pill = `${mEntries.length} model`;
    h2Deger = `${esc(baskin)} <small>ağırlıklı mimari</small>`;
    h2Cubuk = `${pO > 0 ? `<i style="flex:${pO.toFixed(2)};background:#c25927"></i>` : ""}${pS > 0 ? `<i style="flex:${pS.toFixed(2)};background:#e09453"></i>` : ""}${pH > 0 ? `<i style="flex:${pH.toFixed(2)};background:#64748b"></i>` : ""}`;
    h2Etiket = `<span><i class="tm-nokta" style="background:#c25927"></i>Opus ${money(opusU)}</span><span><i class="tm-nokta" style="background:#e09453"></i>Sonnet ${money(sonnetU)}</span>${haikuU > 0 ? `<span><i class="tm-nokta" style="background:#64748b"></i>Haiku ${money(haikuU)}</span>` : ""}`;
  } else if (sgl === "chatgpt") {
    let codexU = 0, gptU = 0, oSeriU = 0;
    for (const [m, s] of mEntries) {
      if (/codex/i.test(m)) codexU += s.usd;
      else if (/(^openai-|-)(o1|o3|o4)/i.test(m)) oSeriU += s.usd;
      else gptU += s.usd;
    }
    const pC = payYuzde(codexU), pG = payYuzde(gptU), pO = payYuzde(oSeriU);
    const baskin = codexU >= gptU && codexU >= oSeriU ? `Codex %${Math.round(pC)}` : gptU >= oSeriU ? `GPT-5 %${Math.round(pG)}` : `o-Serisi %${Math.round(pO)}`;
    h2Baslik = "Codex & Muhakeme Kırılımı";
    h2Pill = `Çıktı ${short(total.output)}`;
    h2Deger = `${esc(baskin)} <small>reasoning dahil</small>`;
    h2Cubuk = `${pC > 0 ? `<i style="flex:${pC.toFixed(2)};background:#10a37f"></i>` : ""}${pG > 0 ? `<i style="flex:${pG.toFixed(2)};background:#0ea5e9"></i>` : ""}${pO > 0 ? `<i style="flex:${pO.toFixed(2)};background:#f59e0b"></i>` : ""}`;
    h2Etiket = `<span><i class="tm-nokta" style="background:#10a37f"></i>Codex ${money(codexU)}</span>${gptU > 0 ? `<span><i class="tm-nokta" style="background:#0ea5e9"></i>GPT ${money(gptU)}</span>` : ""}${oSeriU > 0 ? `<span><i class="tm-nokta" style="background:#f59e0b"></i>o-Serisi ${money(oSeriU)}</span>` : ""}`;
  } else {
    let agyU = 0, agyTok = 0, cliU = 0, cliTok = 0;
    for (const [m, s] of mEntries) {
      if (String(m).startsWith("agy-")) { agyU += s.usd; agyTok += s.tok; }
      else { cliU += s.usd; cliTok += s.tok; }
    }
    const pA = payYuzde(agyU), pC = payYuzde(cliU);
    h2Baslik = "Antigravity IDE vs Gemini CLI";
    h2Pill = agyTok > 0 && cliTok > 0 ? "Hibrit kullanım" : agyTok > 0 ? "Antigravity" : "Gemini CLI";
    h2Deger = agyU >= cliU
      ? `%${Math.round(pA)} Antigravity <small>${money(agyU)}</small>`
      : `%${Math.round(pC)} Gemini CLI <small>${money(cliU)}</small>`;
    h2Cubuk = `${pA > 0 ? `<i style="flex:${pA.toFixed(2)};background:#8b5cf6"></i>` : ""}${pC > 0 ? `<i style="flex:${pC.toFixed(2)};background:#3b82f6"></i>` : ""}`;
    h2Etiket = `<span><i class="tm-nokta" style="background:#8b5cf6"></i>Antigravity ${money(agyU)} (${short(agyTok)})</span><span><i class="tm-nokta" style="background:#3b82f6"></i>Gemini CLI ${money(cliU)} (${short(cliTok)})</span>`;
  }

  // 3. Hücre: Aktif kota pencereleri & diskten sıfırlama zamanı
  const hs = d.haftaSifirlama && d.haftaSifirlama[sgl] ? d.haftaSifirlama[sgl] : null;
  const resetYazi = hs && hs.sonrakiReset ? `${gunAd(hs.sonrakiReset)} ${hm(hs.sonrakiReset)}` : "Pazartesi 00:00";
  const kaynakKisa = hs && hs.kaynak === "otomatik_disk" ? "Diskten otomatik" : hs && hs.kaynak === "elle" ? "Elle ayarlı" : "Takvim";
  let h3Baslik = "Kota Penceresi & Sıfırlama", h3Deger = "", h3Cubuk = "", h3Etiket = "";

  if (sgl === "gemini" && (Number.isFinite(ham["agy_claude.used_percentage"]) || Number.isFinite(ham["agy_gemini.used_percentage"]))) {
    const ac = Number.isFinite(ham["agy_claude.used_percentage"]) ? ham["agy_claude.used_percentage"] : 0;
    const ag = Number.isFinite(ham["agy_gemini.used_percentage"]) ? ham["agy_gemini.used_percentage"] : 0;
    const g5 = Number.isFinite(ham["agy_gemini_5h.used_percentage"]) && (!Number.isFinite(ham["agy_gemini_5h.resets_at"]) || ham["agy_gemini_5h.resets_at"] > d.now) ? ham["agy_gemini_5h.used_percentage"] : null;
    h3Baslik = "Antigravity Çift Havuz Durumu";
    h3Deger = `Gemini %${pctFmt(ag)} <small>· Claude/3P %${pctFmt(ac)}</small>`;
    h3Cubuk = `<i style="flex:${Math.max(4, ag).toFixed(1)};background:#3b82f6"></i><i style="flex:${Math.max(4, ac).toFixed(1)};background:#8b5cf6"></i><i style="flex:${Math.max(2, 200 - ac - ag).toFixed(1)};background:transparent"></i>`;
    h3Etiket = `<span><i class="tm-nokta" style="background:#3b82f6"></i>Gemini${g5 !== null ? ` (5s %${pctFmt(g5)})` : ""}</span><span><i class="tm-nokta" style="background:#8b5cf6"></i>Claude/3P</span><span>Sıfırlama: ${esc(resetYazi)}</span>`;
  } else {
    const h5 = L && L.h !== null && L.h !== undefined && L.hr > d.now ? L.h : null;
    const w7 = L && L.pct !== null && L.pct !== undefined ? L.pct : null;
    const m30 = Number.isFinite(ham["thirty_day.used_percentage"]) ? ham["thirty_day.used_percentage"] : (Number.isFinite(ham["chatgpt_30d.used_percentage"]) ? ham["chatgpt_30d.used_percentage"] : null);
    h3Deger = w7 !== null ? `%${pctFmt(w7)} <small>haftalık pencere</small>` : m30 !== null ? `%${pctFmt(m30)} <small>30 günlük pencere</small>` : `${esc(resetYazi)} <small>sıfırlama</small>`;
    const doluluk = w7 !== null ? Math.min(100, Math.max(2, w7)) : m30 !== null ? Math.min(100, Math.max(2, m30)) : 0;
    h3Cubuk = `<i style="width:${doluluk.toFixed(1)}%;background:var(--accent)"></i>`;
    h3Etiket = [
      h5 !== null ? `<span><i class="tm-nokta" style="background:var(--accent)"></i>5s: %${pctFmt(h5)}</span>` : "",
      m30 !== null ? `<span>30g: %${pctFmt(m30)}</span>` : "",
      `<span>Sıfırlama: ${esc(resetYazi)}</span>`,
    ].filter(Boolean).join("");
  }

  return `<section class="telemetri-kart" aria-label="${esc(saglayiciBilgi(sgl).ad)} teknik telemetri özeti">
    <div class="tm-hucre">
      <div class="tm-ust"><span>Bağlam Önbelleği (Prompt Cache)</span><span class="pill ${crPct >= 50 ? "pill-ok" : ""}">%${pctFmt(crPct)} isabet</span></div>
      <div class="tm-deger">${short(total.cr)} <small>/ ${short(cachePayda)} bağlam token'ı</small></div>
      <div class="tm-cubuk" aria-hidden="true">${crPct > 0 ? `<i style="flex:${crPct.toFixed(2)};background:var(--ok)"></i>` : ""}${cwPct > 0 ? `<i style="flex:${cwPct.toFixed(2)};background:var(--warn)"></i>` : ""}${inPct > 0 ? `<i style="flex:${inPct.toFixed(2)};background:var(--line-strong)"></i>` : ""}</div>
      <div class="tm-etiketler">${cacheAltEtiket}</div>
    </div>
    <div class="tm-hucre">
      <div class="tm-ust"><span>${esc(h2Baslik)}</span><span class="pill">${esc(h2Pill)}</span></div>
      <div class="tm-deger">${h2Deger}</div>
      <div class="tm-cubuk" aria-hidden="true">${h2Cubuk || `<i style="width:100%;background:var(--surface-3)"></i>`}</div>
      <div class="tm-etiketler">${h2Etiket}</div>
    </div>
    <div class="tm-hucre">
      <div class="tm-ust"><span>${esc(h3Baslik)}</span><span class="pill">${esc(kaynakKisa)}</span></div>
      <div class="tm-deger">${h3Deger}</div>
      <div class="tm-cubuk" aria-hidden="true">${h3Cubuk}</div>
      <div class="tm-etiketler">${h3Etiket}</div>
    </div>
  </section>`;
}

async function pageWeek(silent = false) {

  let d;
  try { d = await loadWeek(); } catch (e) { if (e.message !== "giriş" && !silent) showError("hafta", offlineMsg(e), () => pageWeek()); return; }
  const sgl = d.saglayici || "claude";
  const sb = saglayiciBilgi(sgl);
  const perDev = new Map(d.devices.map((x) => [x.id, sumZero()]));
  const byModel = new Map();
  const total = sumZero();
  for (const r of d.usage) {
    if (!perDev.has(r.device_id)) continue;
    add(perDev.get(r.device_id), r); add(total, r);
    if (!byModel.has(r.model)) byModel.set(r.model, sumZero());
    add(byModel.get(r.model), r);
  }
  const liveSet = liveSetOf(d);
  const devs = [...d.devices].sort((a, b) => perDev.get(b.id).usd - perDev.get(a.id).usd);
  const groups = gruplar(d, perDev);

    <div class="kpi">

      <div class="kpi-deger">${top ? esc(top.ad) : "—"}</div>

    <div class="kpi">
      <div class="kpi-etiket"><span>Ortak hesap kilidi</span><span class="pill ${!kilitAktif ? "" : kilit ? "pill-ok" : ""}">${!kilitAktif ? "Devre dışı" : engelliSayi ? `${engelliSayi} ayrı hesap` : kilit ? "Kilitli" : "Bekleniyor"}</span></div>
      <div class="kpi-deger ${kilit && kilit.eposta ? "kpi-eposta" : ""}"${kilit && (kilit.eposta || kilit.ozet) ? ` title="${esc(kilit.eposta || "#" + kilit.ozet)}"` : ""}>${!kilitAktif ? "Kapalı" : kilit ? (kilit.eposta ? esc(kilit.eposta) : `<span class="mono-hash">#${esc((kilit.ozet || "").slice(0, 8))}</span>`) : "Açık"}</div>
      <div class="kpi-alt">${!kilitAktif

    ? (d.devices.length
      ? `<div class="card" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px"><span class="muted">${esc(ofisTema(sgl).ad)} henüz boş: ${d.ayar && Array.isArray(d.ayar.ofisUyeler) ? "seçili üye yok" : `son haftalarda ${esc(sb.ad)} kullanan üye görünmüyor`}.</span><a class="btn btn-plain btn-sm" href="${urlKur("/pano/ayarlar/uyeler")}#h-ofis-uyeler" data-link>Ofis üyelerini seç</a></div>`

    : ofisGorunur

      : `<div class="card" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px"><span class="muted">Canlı ofis simülasyonu ayarlardan gizlendi.</span><a class="btn btn-plain btn-sm" href="${urlKur("/pano/ayarlar/ofis")}" data-link>Ofis ayarlarını aç</a></div>`;
  const gunBasSaat = hm(d.start);

  shell("hafta", `
    ${weekHeader(d, title, "/pano")}
    ${kpiHtml}
    ${saglayiciTelemetriKarti(d, total, byModel)}
    ${bosSaglayiciBilgi}

      <div id="gunwrap">${dayBars(d, d.usage, haftaGun(d))}</div>
    </section>
    <section class="card" aria-labelledby="h-tur">
      <div class="card-head"><h2 id="h-tur">Bilgisayarlara göre</h2><span class="pill">${esc(sb.ad)}</span></div>
      <div class="table-wrap" tabindex="0" role="region" aria-labelledby="h-tur"><table>${head("Bilgisayar")}
        <tbody>${devs.map((x) => row(`<a href="/pano/bilgisayar/${x.id}${location.search}" data-link>${esc(x.label)}</a>${uyeAdi(d, x) && uyeAdi(d, x) !== x.label ? `<small class="muted"> · ${esc(uyeAdi(d, x))}</small>` : ""}`, perDev.get(x.id), maxDevUsd)).join("") || `<tr><td colspan="7" class="empty">Henüz bağlı bilgisayar yok.</td></tr>`}</tbody>
        <tfoot>${row("Toplam", total)}</tfoot></table></div>
    </section>

      <p class="note">API karşılığı, aynı token'ların resmi ${esc(sb.apiAd)} liste fiyatıyla ne tutacağını gösterir. Abonelik limitinin iç formülü açıklanmadığından bilgisayarları karşılaştırmak için en tutarlı ölçü budur.</p>

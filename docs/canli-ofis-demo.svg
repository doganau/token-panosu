<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Token Panosu Canlı İzometrik Ofis Simülasyonu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#171f32"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#457b9d"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes codePulse {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.95; }
        50% { stroke-dashoffset: 10; opacity: 0.45; }
      }
      @keyframes steam {
        0% { transform: translateY(0) scale(0.9); opacity: 0; }
        35% { opacity: 0.65; }
        100% { transform: translateY(-16px) scale(1.15); opacity: 0; }
      }
      @keyframes blink {
        0%, 48%, 100% { opacity: 1; }
        50%, 92% { opacity: 0.22; }
      }
      @keyframes floatBubble {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes walkBob {
        0%, 100% { transform: translate(0px, 0px); }
        25% { transform: translate(8px, 4px); }
        50% { transform: translate(16px, 8px); }
        75% { transform: translate(8px, 4px); }
      }
      @keyframes tailWag {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(14deg); }
      }
      @keyframes barBreath {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 1; }
      }
      .code-line { stroke-dasharray: 22 6; animation: codePulse 2.4s ease-in-out infinite; }
      .code-line.d2 { animation-delay: 0.6s; }
      .code-line.d3 { animation-delay: 1.2s; }
      .steam-1 { animation: steam 2.8s ease-out infinite; }
      .steam-2 { animation: steam 2.8s ease-out 1.3s infinite; }
      .led-1 { animation: blink 1.7s infinite; }
      .led-2 { animation: blink 2.3s 0.5s infinite; }
      .bubble { animation: floatBubble 3.2s ease-in-out infinite; }
      .bubble-2 { animation: floatBubble 3.6s ease-in-out 1.1s infinite; }
      .walker { animation: walkBob 5.4s ease-in-out infinite; }
      .cat-tail { transform-origin: 654px 376px; animation: tailWag 1.8s ease-in-out infinite; }
      .bar-fill { animation: barBreath 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card frame -->
  <rect width="960" height="500" rx="18" fill="url(#bg)" stroke="#243045" stroke-width="2"/>

  <!-- Top telemetry header bar -->
  <rect x="20" y="18" width="920" height="58" rx="12" fill="#131c2e" stroke="#26344d"/>
  <circle cx="44" cy="47" r="6" fill="#de9658"/>
  <text x="58" y="43" class="f" font-size="14" font-weight="700" fill="#f1f5f9">Token Panosu · Canlı İzometrik Ofis Simülasyonu</text>
  <text x="58" y="61" class="f" font-size="11.5" fill="#94a3b8">Claude Code · OpenAI Codex CLI · Google Gemini CLI · Google Antigravity IDE</text>

  <!-- Live provider badges on top-right -->
  <g transform="translate(534, 29)">
    <rect width="122" height="36" rx="9" fill="#1c2539" stroke="#d97757" stroke-opacity="0.45"/>
    <circle cx="16" cy="18" r="4.5" fill="#d97757"/>
    <text x="27" y="15" class="f" font-size="10.5" font-weight="700" fill="#e2e8f0">Claude Ofisi</text>
    <text x="27" y="28" class="m" font-size="10.5" font-weight="700" fill="#f6ad85">%64,5 · $152</text>
  </g>
  <g transform="translate(664, 29)">
    <rect width="122" height="36" rx="9" fill="#1c2539" stroke="#10a37f" stroke-opacity="0.45"/>
    <circle cx="16" cy="18" r="4.5" fill="#10a37f"/>
    <text x="27" y="15" class="f" font-size="10.5" font-weight="700" fill="#e2e8f0">Codex CLI</text>
    <text x="27" y="28" class="m" font-size="10.5" font-weight="700" fill="#5eead4">%52,4 · $73</text>
  </g>
  <g transform="translate(794, 29)">
    <rect width="132" height="36" rx="9" fill="#1c2539" stroke="#8b5cf6" stroke-opacity="0.55"/>
    <circle cx="16" cy="18" r="4.5" fill="#8b5cf6"/>
    <text x="27" y="15" class="f" font-size="10.5" font-weight="700" fill="#e2e8f0">Gemini + AGY</text>
    <text x="27" y="28" class="m" font-size="10.5" font-weight="700" fill="#c4b5fd">%61,8 · Çift Havuz</text>
  </g>

  <!-- Isometric Floor & Walls -->
  <g transform="translate(0, 12)">
    <!-- Back Left Wall -->
    <polygon points="480,102 150,252 150,166 480,16" fill="#1b263b" opacity="0.92" transform="translate(0, 68)"/>
    <!-- Back Right Wall -->
    <polygon points="480,102 810,252 810,166 480,16" fill="#162032" opacity="0.95" transform="translate(0, 68)"/>
    <!-- Isometric Floor Diamond -->
    <polygon points="480,170 810,320 480,456 150,320" fill="#131c2e" stroke="#293853" stroke-width="1.5"/>
    <!-- Subtle floor grid lines -->
    <g stroke="#1e2b42" stroke-width="1" opacity="0.65">
      <line x1="397" y1="207" x2="727" y2="354"/>
      <line x1="315" y1="245" x2="645" y2="388"/>
      <line x1="232" y1="282" x2="562" y2="422"/>
      <line x1="562" y1="207" x2="232" y2="354"/>
      <line x1="645" y1="245" x2="315" y2="388"/>
      <line x1="727" y1="282" x2="397" y2="422"/>
    </g>

    <!-- Panoramic Window on Left Wall -->
    <polygon points="245,168 385,104 385,152 245,216" fill="url(#sky)" stroke="#334868" stroke-width="2"/>
    <line x1="315" y1="136" x2="315" y2="184" stroke="#334868" stroke-width="2"/>
    <circle cx="355" cy="126" r="7" fill="#fde68a" opacity="0.85"/>

    <!-- Architecture Whiteboard on Right Wall -->
    <polygon points="555,104 665,154 665,198 555,148" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <rect x="572" y="132" width="14" height="10" rx="2" fill="#f59e0b" transform="skewY(24)"/>
    <rect x="594" y="130" width="14" height="10" rx="2" fill="#38bdf8" transform="skewY(24)"/>
    <rect x="616" y="128" width="14" height="10" rx="2" fill="#34d399" transform="skewY(24)"/>

    <!-- Server Rack (Right Corner) -->
    <g transform="translate(708, 224)">
      <polygon points="0,16 28,2 56,16 28,30" fill="#334155"/>
      <polygon points="0,16 28,30 28,84 0,70" fill="#1e293b"/>
      <polygon points="28,30 56,16 56,70 28,84" fill="#0f172a"/>
      <circle cx="10" cy="34" r="2.3" fill="#4ade80" class="led-1"/>
      <circle cx="17" cy="37" r="2.3" fill="#38bdf8" class="led-2"/>
      <circle cx="10" cy="48" r="2.3" fill="#4ade80" class="led-2"/>
      <circle cx="17" cy="51" r="2.3" fill="#fbbf24" class="led-1"/>
      <circle cx="10" cy="62" r="2.3" fill="#4ade80" class="led-1"/>
    </g>

    <!-- Coffee Station + Animated Steam (Left Corner) -->
    <g transform="translate(198, 246)">
      <polygon points="0,20 34,4 64,18 30,34" fill="#9a6b44"/>
      <polygon points="0,20 30,34 30,62 0,48" fill="#6f4a2d"/>
      <polygon points="30,34 64,18 64,46 30,62" fill="#583921"/>
      <rect x="22" y="4" width="16" height="18" rx="3" fill="#334155"/>
      <ellipse cx="32" cy="18" rx="18" ry="9" fill="url(#warmGlow)"/>
      <path d="M27,2 C24,-5 31,-9 28,-15" stroke="#cbd5e1" stroke-width="1.8" fill="none" stroke-linecap="round" class="steam-1"/>
      <path d="M34,4 C31,-3 38,-7 35,-13" stroke="#cbd5e1" stroke-width="1.6" fill="none" stroke-linecap="round" class="steam-2"/>
    </g>

    <!-- DESK 1: Deniz (Active Coding - Claude Opus + Antigravity) -->
    <g transform="translate(362, 214)">
      <ellipse cx="48" cy="32" rx="44" ry="20" fill="url(#screenGlow)"/>
      <polygon points="0,26 58,0 98,18 40,44" fill="#b78355"/>
      <polygon points="0,26 40,44 40,51 0,33" fill="#855a35"/>
      <polygon points="40,44 98,18 98,25 40,51" fill="#6b4728"/>
      <!-- Paper stack (spend height) -->
      <polygon points="70,18 82,12 91,16 79,22" fill="#f8fafc"/>
      <polygon points="70,18 79,22 79,30 70,26" fill="#cbd5e1"/>
      <!-- Monitor -->
      <polygon points="28,6 60,-9 60,15 28,30" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <line x1="33" y1="9" x2="54" y2="-1" stroke="#38bdf8" stroke-width="2" class="code-line"/>
      <line x1="33" y1="15" x2="50" y2="7" stroke="#f472b6" stroke-width="2" class="code-line d2"/>
      <line x1="33" y1="21" x2="56" y2="10" stroke="#4ade80" stroke-width="2" class="code-line d3"/>
      <!-- Developer seated -->
      <circle cx="62" cy="24" r="7.5" fill="#f1c29d"/>
      <path d="M55,22 Q62,13 69,22" fill="#2b211b"/>
      <rect x="54" y="31" width="16" height="20" rx="5" fill="#d97757"/>
      <!-- Desk Pill -->
      <g transform="translate(10, -34)">
        <rect width="92" height="26" rx="8" fill="#0f172a" fill-opacity="0.92" stroke="#334155"/>
        <circle cx="11" cy="13" r="3.5" fill="#4ade80"/>
        <text x="19" y="12" class="f" font-size="10" font-weight="700" fill="#f8fafc">Deniz</text>
        <text x="55" y="12" class="m" font-size="9.5" font-weight="700" fill="#93c5fd">$64,20</text>
        <text x="19" y="22" class="f" font-size="8.5" fill="#94a3b8">şu an aktif · 2 cihaz</text>
      </g>
    </g>

    <!-- DESK 2: Ece (Active Coding - Codex CLI) -->
    <g transform="translate(506, 272)">
      <ellipse cx="48" cy="32" rx="44" ry="20" fill="url(#screenGlow)"/>
      <polygon points="0,26 58,0 98,18 40,44" fill="#b78355"/>
      <polygon points="0,26 40,44 40,51 0,33" fill="#855a35"/>
      <polygon points="40,44 98,18 98,25 40,51" fill="#6b4728"/>
      <polygon points="28,6 60,-9 60,15 28,30" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <line x1="33" y1="9" x2="55" y2="-1" stroke="#34d399" stroke-width="2" class="code-line d2"/>
      <line x1="33" y1="15" x2="48" y2="8" stroke="#fbbf24" stroke-width="2" class="code-line d3"/>
      <line x1="33" y1="21" x2="53" y2="12" stroke="#60a5fa" stroke-width="2" class="code-line"/>
      <circle cx="62" cy="24" r="7.5" fill="#e5b08a"/>
      <path d="M54,23 Q62,12 70,24" fill="#4a2e1b"/>
      <rect x="54" y="31" width="16" height="20" rx="5" fill="#10a37f"/>
      <g transform="translate(8, -34)">
        <rect width="90" height="26" rx="8" fill="#0f172a" fill-opacity="0.92" stroke="#334155"/>
        <circle cx="11" cy="13" r="3.5" fill="#4ade80"/>
        <text x="19" y="12" class="f" font-size="10" font-weight="700" fill="#f8fafc">Ece</text>
        <text x="50" y="12" class="m" font-size="9.5" font-weight="700" fill="#5eead4">$48,50</text>
        <text x="19" y="22" class="f" font-size="8.5" fill="#94a3b8">Codex + Gemini</text>
      </g>
    </g>

    <!-- DESK 3: Kaan (Quota Over-Share Alert Badge) -->
    <g transform="translate(292, 298)">
      <polygon points="0,26 58,0 98,18 40,44" fill="#b78355"/>
      <polygon points="0,26 40,44 40,51 0,33" fill="#855a35"/>
      <polygon points="40,44 98,18 98,25 40,51" fill="#6b4728"/>
      <!-- Tall paper stack showing high API equivalent -->
      <polygon points="68,8 82,2 92,6 78,12" fill="#ffffff"/>
      <polygon points="68,8 78,12 78,27 68,23" fill="#cbd5e1"/>
      <polygon points="28,6 60,-9 60,15 28,30" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <line x1="33" y1="10" x2="55" y2="0" stroke="#f87171" stroke-width="2" class="code-line"/>
      <line x1="33" y1="17" x2="51" y2="9" stroke="#fb923c" stroke-width="2" class="code-line d2"/>
      <circle cx="62" cy="24" r="7.5" fill="#eac09e"/>
      <rect x="54" y="31" width="16" height="20" rx="5" fill="#6366f1"/>
      <g transform="translate(2, -36)">
        <rect width="98" height="27" rx="8" fill="#1e1318" stroke="#ef4444" stroke-opacity="0.7"/>
        <circle cx="11" cy="13" r="3.5" fill="#f87171"/>
        <text x="19" y="12" class="f" font-size="10" font-weight="700" fill="#f8fafc">Kaan</text>
        <text x="53" y="12" class="m" font-size="9.5" font-weight="700" fill="#fca5a5">$91,40</text>
        <text x="19" y="22" class="f" font-size="8.5" font-weight="700" fill="#f87171">+%6,8 kota aşımı</text>
      </g>
    </g>

    <!-- Walking Developer on Coffee Break (Selin) -->
    <g class="walker" transform="translate(454, 348)">
      <ellipse cx="0" cy="24" rx="10" ry="4.5" fill="#090d16" opacity="0.6"/>
      <rect x="-4" y="9" width="3.5" height="14" rx="1.5" fill="#334155"/>
      <rect x="1" y="9" width="3.5" height="14" rx="1.5" fill="#1e293b"/>
      <rect x="-7" y="-9" width="14" height="19" rx="4.5" fill="#3b82f6"/>
      <circle cx="0" cy="-16" r="6.8" fill="#f1c29d"/>
      <path d="M-7,-17 Q0,-26 7,-16" fill="#3b2316"/>
      <!-- Coffee mug in hand -->
      <rect x="7" y="-2" width="5" height="6" rx="1" fill="#f8fafc"/>
    </g>

    <!-- Speech Bubble 1 (Floating, Collision-Avoided) -->
    <g class="bubble" transform="translate(392, 134)">
      <rect width="222" height="32" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="11" y="20" class="f" font-size="10.5" fill="#e2e8f0"><tspan font-weight="700" fill="#38bdf8">Deniz:</tspan> Cache okuma %92 geldi, kota rahat!</text>
    </g>

    <!-- Speech Bubble 2 -->
    <g class="bubble-2" transform="translate(476, 304)">
      <rect width="210" height="30" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="11" y="19" class="f" font-size="10.5" fill="#e2e8f0"><tspan font-weight="700" fill="#fbbf24">Selin:</tspan> Taze kahve aldım, PR'a bakıyorum!</text>
    </g>

    <!-- Tekir the Office Cat -->
    <g transform="translate(646, 372)">
      <ellipse cx="0" cy="6" rx="9" ry="4" fill="#090d16" opacity="0.55"/>
      <ellipse cx="0" cy="2" rx="8" ry="5" fill="#df8840"/>
      <circle cx="-7" cy="-2" r="4.2" fill="#df8840"/>
      <polygon points="-10,-5 -8,-9 -6,-5" fill="#df8840"/>
      <polygon points="-6,-5 -4,-9 -2,-5" fill="#df8840"/>
    </g>
    <path d="M654,376 Q664,368 666,374" stroke="#df8840" stroke-width="2.6" fill="none" stroke-linecap="round" class="cat-tail"/>
  </g>

  <!-- Bottom Telemetry & Fair Share Strip -->
  <rect x="20" y="438" width="920" height="44" rx="11" fill="#131c2e" stroke="#26344d"/>
  <text x="36" y="464" class="f" font-size="11.5" font-weight="700" fill="#cbd5e1">Bağlam Önbelleği İsabeti: <tspan fill="#4ade80">%92,6</tspan></text>
  <rect x="218" y="455" width="96" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="218" y="455" width="88" height="9" rx="4.5" fill="#22c55e" class="bar-fill"/>

  <text x="336" y="464" class="f" font-size="11.5" font-weight="700" fill="#cbd5e1">Antigravity Çift Havuz:</text>
  <rect x="478" y="455" width="76" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="478" y="455" width="47" height="9" rx="4.5" fill="#8b5cf6" class="bar-fill"/>
  <rect x="562" y="455" width="76" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="562" y="455" width="31" height="9" rx="4.5" fill="#3b82f6" class="bar-fill"/>

  <text x="662" y="464" class="f" font-size="11.5" fill="#94a3b8">Sıfır Dış İstek · RSA-3072 &amp; HMAC İmzalı · Cloudflare D1 ($0/ay)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Token Panosu Mimari ve Gizlilik Akışı">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes flow {
        to { stroke-dashoffset: -28; }
      }
      .wire { stroke-dasharray: 8 6; animation: flow 1.3s linear infinite; }
    </style>
  </defs>

  <rect width="960" height="280" rx="16" fill="url(#abg)" stroke="#243045" stroke-width="2"/>

  <!-- Node 1: Local Disk Sources -->
  <g transform="translate(24, 30)">
    <rect width="256" height="220" rx="14" fill="#141e33" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="28" class="f" font-size="13" font-weight="800" fill="#f8fafc">1. Yerel Oturum Dosyaları</text>
    <text x="18" y="46" class="f" font-size="11" fill="#94a3b8">Salt-okunur · Dış API sorgusu atılmaz</text>

    <rect x="16" y="60" width="224" height="32" rx="7" fill="#1c273d" stroke="#d97757" stroke-opacity="0.45"/>
    <text x="26" y="75" class="f" font-size="10.5" font-weight="700" fill="#f6ad85">Claude Code &amp; Masaüstü</text>
    <text x="26" y="87" class="m" font-size="9.5" fill="#cbd5e1">~/.claude/projects/**/*.jsonl</text>

    <rect x="16" y="99" width="224" height="32" rx="7" fill="#1c273d" stroke="#10a37f" stroke-opacity="0.45"/>
    <text x="26" y="114" class="f" font-size="10.5" font-weight="700" fill="#5eead4">OpenAI Codex CLI</text>
    <text x="26" y="126" class="m" font-size="9.5" fill="#cbd5e1">~/.codex/(archived_)sessions</text>

    <rect x="16" y="138" width="224" height="32" rx="7" fill="#1c273d" stroke="#3b82f6" stroke-opacity="0.45"/>
    <text x="26" y="153" class="f" font-size="10.5" font-weight="700" fill="#93c5fd">Google Gemini CLI</text>
    <text x="26" y="165" class="m" font-size="9.5" fill="#cbd5e1">~/.gemini/tmp/**/session-*.json(l)</text>

    <rect x="16" y="177" width="224" height="32" rx="7" fill="#1c273d" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <text x="26" y="192" class="f" font-size="10.5" font-weight="700" fill="#c4b5fd">Google Antigravity IDE / CLI</text>
    <text x="26" y="204" class="m" font-size="9.5" fill="#cbd5e1">brain/**/transcript*.jsonl + vscdb</text>
  </g>

  <!-- Animated Connector 1 -> 2 -->
  <line x1="280" y1="140" x2="338" y2="140" stroke="#38bdf8" stroke-width="2.5" class="wire"/>
  <polygon points="336,134 346,140 336,146" fill="#38bdf8"/>

  <!-- Node 2: Signed Go Agent -->
  <g transform="translate(348, 44)">
    <rect width="244" height="192" rx="14" fill="#141e33" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="18" y="28" class="f" font-size="13" font-weight="800" fill="#f8fafc">2. İmzalı Go Gönderici</text>
    <text x="18" y="46" class="f" font-size="11" fill="#94a3b8">macOS · Windows · Linux (5 dk)</text>

    <text x="18" y="74" class="f" font-size="11" fill="#e2e8f0">• Prompt ve kod metinleri okunmaz</text>
    <text x="18" y="96" class="f" font-size="11" fill="#e2e8f0">• Yalnızca token &amp; kota sayaçları</text>
    <text x="18" y="118" class="f" font-size="11" fill="#e2e8f0">• Keychain / DPAPI HMAC-SHA256</text>
    <text x="18" y="140" class="f" font-size="11" fill="#e2e8f0">• Yerel e-posta ve saat doğrulaması</text>
    <rect x="18" y="154" width="208" height="24" rx="6" fill="#0f172a" stroke="#26344d"/>
    <text x="24" y="170" class="m" font-size="10" fill="#4ade80">HMAC-SHA256 + RSA-3072 İmza</text>
  </g>

  <!-- Animated Connector 2 -> 3 -->
  <line x1="592" y1="140" x2="650" y2="140" stroke="#4ade80" stroke-width="2.5" class="wire"/>
  <polygon points="648,134 658,140 648,146" fill="#4ade80"/>

  <!-- Node 3: Cloudflare Worker + D1 + Web UI -->
  <g transform="translate(660, 30)">
    <rect width="276" height="220" rx="14" fill="#141e33" stroke="#4ade80" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="18" y="28" class="f" font-size="13" font-weight="800" fill="#f8fafc">3. Cloudflare Worker + D1</text>
    <text x="18" y="46" class="f" font-size="11" fill="#4ade80">$0/ay Ücretsiz Katman · Kendi Alan Adın</text>

    <text x="18" y="74" class="f" font-size="11" fill="#e2e8f0">• Resmi liste fiyatlarıyla API karşılığı ($)</text>
    <text x="18" y="96" class="f" font-size="11" fill="#e2e8f0">• Ortak hesap e-posta kilidi</text>
    <text x="18" y="118" class="f" font-size="11" fill="#e2e8f0">• Diskten otomatik hafta sıfırlama saati</text>
    <text x="18" y="140" class="f" font-size="11" fill="#e2e8f0">• Kişi başı adil kota payı &amp; Fable takibi</text>
    <text x="18" y="162" class="f" font-size="11" fill="#e2e8f0">• 60 FPS izometrik canlı ofis simülasyonu</text>

    <rect x="18" y="178" width="240" height="28" rx="7" fill="#0f172a" stroke="#26344d"/>
    <text x="30" y="196" class="m" font-size="10.5" fill="#93c5fd">/ (Vitrin) · /kurulum · /pano</text>
  </g>
</svg>

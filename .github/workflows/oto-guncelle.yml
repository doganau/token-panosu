name: Otomatik Sürüm Senkronizasyonu ve Dağıtım

on:
  schedule:
    # Her 12 saatte bir ana depodaki (doganau/token-panosu) yeni sürümü kontrol eder
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      zorla_yayinla:
        description: "Sürüm değişmemiş olsa bile yeniden derle ve Cloudflare'e yayınla"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  oto-guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ana depodan (doganau/token-panosu) yeni sürümü kontrol et ve eşitle
        id: esitle
        env:
          KAYNAK_REPO: "doganau/token-panosu"
        run: |
          YEREL_SURUM="$(sed -nE 's/^[[:space:]]*Surum[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' go/main.go | head -n 1)"
          echo "yerel_surum=${YEREL_SURUM}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REPOSITORY}" = "${KAYNAK_REPO}" ]; then
            echo "degisti=false" >> "$GITHUB_OUTPUT"
            echo "Ana depo üzerinde çalışıyor; dış senkronizasyon atlandı."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${KAYNAK_REPO}.git" || git remote set-url upstream "https://github.com/${KAYNAK_REPO}.git"
          git fetch upstream main
          YEREL_SHA="$(git rev-parse HEAD)"
          UZAK_SHA="$(git rev-parse upstream/main)"
          if [ "$YEREL_SHA" != "$UZAK_SHA" ] && ! git merge-base --is-ancestor "$UZAK_SHA" "$YEREL_SHA"; then
            git merge --no-edit upstream/main
            git push origin HEAD:main
            echo "degisti=true" >> "$GITHUB_OUTPUT"
          else
            echo "degisti=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dağıtım gerekip gerekmediğini belirle
        id: karar
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZORLA: ${{ github.event.inputs.zorla_yayinla }}
        run: |
          if [ -n "$CF_TOKEN" ] && { [ "${{ steps.esitle.outputs.degisti }}" = "true" ] || [ "$ZORLA" = "true" ]; }; then
            echo "yayinla=true" >> "$GITHUB_OUTPUT"
          else
            echo "yayinla=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node.js kur
        if: steps.karar.outputs.yayinla == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Go kur
        if: steps.karar.outputs.yayinla == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Testleri çalıştır ve 42 izole gönderici ikilisini derle/imzala
        if: steps.karar.outputs.yayinla == 'true'
        env:
          TOKEN_PANOSU_URL: ${{ secrets.TOKEN_PANOSU_URL }}
          TOKEN_PANOSU_IMZA_PEM: ${{ secrets.TOKEN_PANOSU_IMZA_PEM }}
          TOKEN_PANOSU_MUHUR_HEX: ${{ secrets.TOKEN_PANOSU_MUHUR_HEX }}
        run: |
          npm ci
          node --test src/*.test.mjs
          (cd go && go test ./...)
          sh araclar/derle.sh
          if [ -n "${TOKEN_PANOSU_IMZA_PEM:-}" ]; then
            python3 araclar/imzala.py imzala
          else
            python3 araclar/imzala.py imzasiz
          fi

      - name: wrangler.toml hazırla ve Cloudflare Workers üzerine yayınla
        if: steps.karar.outputs.yayinla == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
        run: |
          if [ ! -f wrangler.toml ]; then
            cp wrangler.toml.ornek wrangler.toml
            sed -i -E "s|^name[[:space:]]*=[[:space:]]*\"[^\"]*\"|name = \"${WORKER_NAME:-token-panosu}\"|" wrangler.toml
            sed -i -E "s|^database_name[[:space:]]*=[[:space:]]*\"[^\"]*\"|database_name = \"${D1_DATABASE_NAME:-token-panosu}\"|" wrangler.toml
            sed -i -E "s|^database_id[[:space:]]*=[[:space:]]*\"[^\"]*\"|database_id = \"${D1_DATABASE_ID}\"|" wrangler.toml
          fi
          npx wrangler deploy
